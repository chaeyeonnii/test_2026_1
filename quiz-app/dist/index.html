<script>
// ────────────────────────────────────────────────
// 중간고사 퀴즈 — 과목·챕터별로 골라 푸는 모바일 퀴즈
// 기록은 이 기기(localStorage)에 바로 저장하고, claude.ai에 로그인돼 있으면
// db 개인 영역에도 저장해 폰과 PC가 같은 기록을 본다.
// ────────────────────────────────────────────────
(function () {
  "use strict";

  const TYPE = { ox: "OX", mc: "객관식", sa: "단답형", bl: "빈칸" };
  const SRC_LABEL = { "퀴즈": "수업 퀴즈", "요약정리": "요약정리 예상문제", "강의": "강의 확인문제", "추가": "추가 문제" };
  const ORDER = ["ca", "ai", "bd", "ds", "py"];
  const DEFAULT_EXAM = "2026-10-26";
  const LS_KEY = "midterm-quiz-v2";
  const NUMS = ["①", "②", "③", "④", "⑤"];
  const ICON = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>'
  };

  // ── 문항 준비: id는 과목 + 장 + 문제 텍스트 해시 (순서가 바뀌어도 기록 유지) ──
  function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
  const SUBJ = {};
  BANK.forEach(function (b) {
    b.qs.forEach(function (q) { q.id = b.id + "." + q.c + "." + hash(q.q + (q.k || "") + q.t); q.subj = b.id; if (!q.src) q.src = "추가"; });
    SUBJ[b.id] = b;
  });
  const IDS = ORDER.filter(function (id) { return SUBJ[id]; });

  // ── 상태 ──
  // rec[qid] = { c: 맞힌 횟수, w: 틀린 횟수, l: 마지막 결과(1/0), t: 마지막 시각 }
  // cfg[과목] = { ch: [선택 챕터], types: [유형], scope: "all|new|wrong|star", n: 문제 수 }
  let state = { rec: {}, exam: {}, cfg: {}, updatedAt: 0 };
  try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}

  let docRef = null, syncOn = false, pushTimer = null, pushing = false, again = false;
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function touch() { state.updatedAt = Date.now(); saveLocal(); if (syncOn) { clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500); } }
  async function push() {
    if (!docRef) return;
    if (pushing) { again = true; return; }
    pushing = true;
    try { await docRef.set({ rec: state.rec, exam: state.exam, cfg: state.cfg, updatedAt: state.updatedAt }); } catch (e) {}
    pushing = false;
    if (again) { again = false; push(); }
  }
  // 다른 기기 기록과 합치기: 문항별로 더 최근에 푼 쪽을 남긴다
  function merge(r) {
    if (!r) return false;
    let changed = false;
    Object.keys(r.rec || {}).forEach(function (id) {
      const a = state.rec[id], b = r.rec[id];
      if (!a || (b.t || 0) > (a.t || 0)) { state.rec[id] = b; changed = true; }
    });
    if ((r.updatedAt || 0) > (state.updatedAt || 0)) {
      state.exam = Object.assign({}, state.exam, r.exam || {});
      state.cfg = Object.assign({}, state.cfg, r.cfg || {});
      changed = true;
    }
    return changed;
  }
  async function initSync() {
    if (!window.claude || !window.claude.use) return;
    try {
      const user = await window.claude.use("user");
      const db = await window.claude.use("db");
      if (!user || !db) return;
      const uid = await user.id();
      if (!uid) return;
      docRef = db.doc("data/users/" + uid + "/progress");
      const snap = await docRef.get();
      syncOn = true;
      const remote = snap.exists ? snap.data() : null;
      if (remote && merge(remote)) { saveLocal(); if (view.name !== "quiz") render(); }
      if (!remote || state.updatedAt > (remote.updatedAt || 0)) push();
    } catch (e) { syncOn = false; }
  }

  // ── 계산 ──
  function stats(qs) {
    let seen = 0, ok = 0, ng = 0;
    qs.forEach(function (q) { const r = state.rec[q.id]; if (r) { seen++; if (r.l === 1) ok++; else ng++; } });
    return { total: qs.length, seen: seen, ok: ok, ng: ng };
  }
  function examDate(id) { return state.exam[id] || DEFAULT_EXAM; }
  function daysLeft(d) { const now = new Date(); now.setHours(0, 0, 0, 0); return Math.round((new Date(d + "T00:00:00") - now) / 86400000); }
  function ddayText(id) { const n = daysLeft(examDate(id)); return n > 0 ? "D-" + n : (n === 0 ? "D-DAY" : "시험 끝"); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function chapterKeys(b) { return Object.keys(b.chapters).filter(function (c) { return b.qs.some(function (q) { return String(q.c) === c; }); }); }
  function getCfg(id) {
    const b = SUBJ[id];
    const c = state.cfg[id] || {};
    return {
      ch: Array.isArray(c.ch) ? c.ch.filter(function (x) { return b.chapters[x]; }) : chapterKeys(b),
      types: Array.isArray(c.types) && c.types.length ? c.types : ["ox", "mc", "sa", "bl"],
      scope: c.scope || "all",
      // 0 = 전부. `c.n || 10`으로 쓰면 0이 10으로 바뀌므로 숫자인지로 판단한다
      n: typeof c.n === "number" ? c.n : 10
    };
  }
  function setCfg(id, cfg) { state.cfg[id] = cfg; touch(); }
  function poolFor(id, cfg) {
    return SUBJ[id].qs.filter(function (q) {
      if (cfg.ch.indexOf(String(q.c)) < 0 || cfg.types.indexOf(q.t) < 0) return false;
      const r = state.rec[q.id];
      if (cfg.scope === "new") return !r;
      if (cfg.scope === "wrong") return r && r.l === 0;
      if (cfg.scope === "star") return !!q.s;
      return true;
    });
  }
  function draw(pool, n) { const a = shuffle(pool.slice()); return n === 0 ? a : a.slice(0, n); }

  // ── 텍스트: 이스케이프 후 `코드`만 code 태그로 ──
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmt(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function fmtNote(s) { return fmt(s).replace(/&lt;(\/?)b&gt;/g, "<$1b>"); }

  // ── 화면 ──
  const app = document.getElementById("app"), dock = document.getElementById("dock"), dockIn = document.getElementById("dockIn");
  let view = { name: "home" }, session = null;
  function setDock(h) { if (!h) { dock.hidden = true; dockIn.innerHTML = ""; } else { dock.hidden = false; dockIn.innerHTML = h; } }
  function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 1600); }
  function go(v) { view = v; render(); window.scrollTo(0, 0); }
  function on(id, fn) { const el = document.getElementById(id); if (el) el.onclick = fn; }
  function render() {
    ({ home: renderHome, subject: renderSubject, quiz: renderQuiz, result: renderResult, notes: renderNotes, wrong: renderWrong })[view.name]();
  }
  function meter(st) {
    const okW = st.total ? st.ok / st.total * 100 : 0, ngW = st.total ? st.ng / st.total * 100 : 0;
    return '<div class="meter" role="img" aria-label="맞힘 ' + st.ok + ', 틀림 ' + st.ng + ', 전체 ' + st.total + '"><i class="ok" style="width:' + okW + '%"></i><i class="ng" style="width:' + ngW + '%"></i></div>';
  }

  // 홈 — 과목 목록
  function renderHome() {
    let h = '<div class="bar"><h1>중간고사 퀴즈</h1></div><div class="stack">';
    let allWrong = 0;
    IDS.forEach(function (id) {
      const b = SUBJ[id], st = stats(b.qs);
      allWrong += st.ng;
      const acc = st.seen ? Math.round(st.ok / st.seen * 100) + "%" : "-";
      h += '<div class="card subj"><div class="subj-top"><h2>' + esc(b.name) + '</h2><span class="dday">' + ddayText(id) + '</span></div>' +
        meter(st) + '<div class="meta"><span>' + st.seen + ' / ' + st.total + '문제 풀이</span><span>정답률 ' + acc + '</span><span>오답 ' + st.ng + '</span></div>' +
        '<div class="subj-btns"><button class="btn" type="button" data-s="' + id + '">문제 풀기</button><button class="btn light" type="button" data-sum="' + id + '">요약 보기</button></div></div>';
    });
    h += '</div><p class="foot">기록은 자동 저장됩니다' + (syncOn ? " · 폰과 PC 동기화 중" : "") + '</p>';
    app.innerHTML = h;
    const noteCount = wrongList(null).length;
    setDock('<button class="btn light" id="wrongAll" type="button">오답노트 ' + noteCount + '문제</button>');
    app.querySelectorAll("[data-s]").forEach(function (el) { el.onclick = function () { go({ name: "subject", id: el.dataset.s }); }; });
    app.querySelectorAll("[data-sum]").forEach(function (el) { el.onclick = function () { go({ name: "notes", id: el.dataset.sum }); }; });
    on("wrongAll", function () { go({ name: "wrong", id: null }); });
  }

  // 과목 — 챕터 선택 + 출제 설정
  function renderSubject() {
    const id = view.id, b = SUBJ[id], cfg = getCfg(id);
    const keys = chapterKeys(b);
    let h = '<div class="bar"><button class="icon-btn" id="back" type="button" aria-label="뒤로">' + ICON.back + '</button><h1>' + esc(b.name) + '</h1></div>' +
      tabs("quiz") + '<div class="stack">';

    // 챕터
    h += '<section class="card"><div class="sec-head"><h3>챕터</h3><button class="link" id="allCh" type="button">' + (cfg.ch.length === keys.length ? "전체 해제" : "전체 선택") + '</button></div>';
    keys.forEach(function (c) {
      const qs = b.qs.filter(function (q) { return String(q.c) === c; }), st = stats(qs);
      h += '<div class="chap"><input type="checkbox" id="ch-' + c + '" data-ch="' + c + '"' + (cfg.ch.indexOf(c) >= 0 ? " checked" : "") + '>' +
        '<label for="ch-' + c + '"><span class="nm">' + esc(c + "장 " + b.chapters[c]) + '</span><span class="st">' + st.total + '문제 · 풀이 ' + st.seen + ' · 오답 ' + st.ng + '</span></label>' +
        '<button class="only" type="button" data-only="' + c + '">이 챕터만</button></div>';
    });
    h += '</section>';

    // 설정
    const typeCount = function (t) { return b.qs.filter(function (q) { return q.t === t && cfg.ch.indexOf(String(q.c)) >= 0; }).length; };
    h += '<section class="card"><div class="row"><span class="label">문제 유형</span><div class="chips">' +
      ["ox", "mc", "sa", "bl"].map(function (t) { return '<button class="chip" type="button" data-type="' + t + '" aria-pressed="' + (cfg.types.indexOf(t) >= 0) + '">' + TYPE[t] + '<small>' + typeCount(t) + '</small></button>'; }).join("") + '</div></div>';
    h += '<div class="row"><span class="label">범위</span><div class="chips">' +
      [["all", "전체"], ["new", "안 푼 문제"], ["wrong", "틀린 문제"], ["star", "★ 빈출"]].map(function (x) { return '<button class="chip" type="button" data-scope="' + x[0] + '" aria-pressed="' + (cfg.scope === x[0]) + '">' + x[1] + '</button>'; }).join("") + '</div></div>';
    h += '<div class="row"><span class="label">문제 수</span><div class="chips">' +
      [5, 10, 20, 30, 0].map(function (n) { return '<button class="chip" type="button" data-n="' + n + '" aria-pressed="' + (cfg.n === n) + '">' + (n ? n + "문제" : "전부") + '</button>'; }).join("") + '</div></div>';
    const pool = poolFor(id, cfg);
    const take = cfg.n ? Math.min(cfg.n, pool.length) : pool.length;
    h += '<p class="pool">선택한 조건의 문제 <b>' + pool.length + '</b>개 중 <b>' + take + '</b>개를 섞어서 냅니다' + (cfg.ch.length > 1 ? " (여러 챕터 섞임)" : "") + '</p></section>';

    h += '<section class="card"><div class="sec-head" style="margin:0"><h3>시험일</h3><input class="date-in" type="date" id="examDate" value="' + examDate(id) + '"></div></section>';
    h += '<button class="link" id="reset" type="button" style="align-self:center">이 과목 기록 초기화</button></div>';
    app.innerHTML = h;
    setDock('<button class="btn" id="go" type="button"' + (pool.length ? "" : " disabled") + '>' + (pool.length ? take + "문제 시작" : "조건에 맞는 문제가 없어요") + '</button>');

    const from = { name: "subject", id: id };
    on("back", function () { go({ name: "home" }); });
    bindTabs(id);
    on("allCh", function () { cfg.ch = cfg.ch.length === keys.length ? [] : keys.slice(); setCfg(id, cfg); render(); });
    app.querySelectorAll("[data-ch]").forEach(function (el) {
      el.onchange = function () {
        const c = el.dataset.ch;
        cfg.ch = cfg.ch.filter(function (x) { return x !== c; });
        if (el.checked) cfg.ch.push(c);
        setCfg(id, cfg); render();
      };
    });
    app.querySelectorAll("[data-only]").forEach(function (el) {
      el.onclick = function () {
        const one = Object.assign({}, cfg, { ch: [el.dataset.only] });
        const p = poolFor(id, one);
        if (!p.length) { toast("이 챕터에 조건에 맞는 문제가 없어요"); return; }
        start(function () { return draw(poolFor(id, one), one.n); }, b.name + " " + el.dataset.only + "장", from);
      };
    });
    app.querySelectorAll("[data-type]").forEach(function (el) {
      el.onclick = function () {
        const t = el.dataset.type, has = cfg.types.indexOf(t) >= 0;
        if (has && cfg.types.length === 1) { toast("유형은 하나 이상 골라야 해요"); return; }
        cfg.types = has ? cfg.types.filter(function (x) { return x !== t; }) : cfg.types.concat([t]);
        setCfg(id, cfg); render();
      };
    });
    app.querySelectorAll("[data-scope]").forEach(function (el) { el.onclick = function () { cfg.scope = el.dataset.scope; setCfg(id, cfg); render(); }; });
    app.querySelectorAll("[data-n]").forEach(function (el) { el.onclick = function () { cfg.n = +el.dataset.n; setCfg(id, cfg); render(); }; });
    document.getElementById("examDate").onchange = function (e) { if (e.target.value) { state.exam[id] = e.target.value; touch(); } };
    on("go", function () {
      const title = cfg.ch.length === 1 ? b.name + " " + cfg.ch[0] + "장" : b.name + " " + (cfg.ch.length === keys.length ? "전체" : cfg.ch.length + "개 챕터");
      start(function () { return draw(poolFor(id, cfg), cfg.n); }, title, from);
    });
    const rb = document.getElementById("reset");
    rb.onclick = function () {
      if (rb.dataset.armed) { b.qs.forEach(function (q) { delete state.rec[q.id]; }); touch(); toast("기록을 초기화했어요"); render(); return; }
      rb.dataset.armed = "1"; rb.textContent = "한 번 더 누르면 초기화돼요"; rb.style.color = "var(--ng)";
      setTimeout(function () { if (rb.isConnected) { delete rb.dataset.armed; rb.textContent = "이 과목 기록 초기화"; rb.style.color = ""; } }, 3000);
    };
  }

  // 퀴즈 시작: maker()를 다시 부르면 같은 조건의 새 문제 세트가 나온다(새로고침)
  function start(maker, title, from) {
    const qs = maker();
    if (!qs.length) { toast("풀 문제가 없어요"); return; }
    session = { maker: maker, qs: qs, i: 0, res: [], typed: [], picked: null, answered: false, revealed: false, title: title, from: from };
    go({ name: "quiz" });
  }
  function refresh() {
    const qs = session.maker();
    if (!qs.length) { toast("새로 낼 문제가 없어요"); return; }
    Object.assign(session, { qs: qs, i: 0, res: [], typed: [], picked: null, answered: false, revealed: false });
    toast("새 문제로 바꿨어요");
    render(); window.scrollTo(0, 0);
  }
  function record(q, ok) {
    const r = state.rec[q.id] || { c: 0, w: 0 };
    if (ok) r.c++; else r.w++;
    r.l = ok ? 1 : 0; r.t = Date.now();
    if (!ok) delete r.x; // 다시 틀리면 오답노트에 다시 올린다
    state.rec[q.id] = r;
    session.res[session.i] = ok;
    session.answered = true;
    touch();
  }
  // 직접 쓴 답과 정답 비교용: 공백·대소문자·문장부호 차이는 무시한다
  function norm(t) { return String(t).toLowerCase().replace(/[\s.,·;:'"`()\[\]{}]/g, ""); }
  function answerText(q) { return q.t === "mc" ? NUMS[q.a] + " " + q.o[q.a] : (q.t === "ox" ? q.a : q.a); }

  function renderQuiz() {
    const s = session, q = s.qs[s.i], b = SUBJ[q.subj];
    let h = '<div class="bar"><button class="icon-btn" id="quit" type="button" aria-label="그만하기">' + ICON.close + '</button>' +
      '<h1>' + esc(s.title) + ' <span class="sub">' + (s.i + 1) + ' / ' + s.qs.length + '</span></h1>' +
      '<button class="icon-btn" id="refresh" type="button" aria-label="새 문제로 새로고침">' + ICON.refresh + '새 문제</button></div>';
    h += '<div class="progress"><i style="width:' + ((s.i + (s.answered ? 1 : 0)) / s.qs.length * 100) + '%"></i></div>';
    h += '<article class="card"><div class="qhead"><span class="tag type">' + TYPE[q.t] + '</span><span class="tag">' + esc(b.name + " · " + q.c + "장") + '</span>' +
      '<span class="tag">' + esc(SRC_LABEL[q.src] || q.src) + '</span>' + (q.org ? '<span class="tag">' + esc(q.org) + '</span>' : "") + (q.s ? '<span class="tag star">★ 빈출</span>' : "") + '</div>';
    h += '<div class="qtext">' + fmt(q.q) + '</div>';
    if (q.k) h += '<pre class="code">' + esc(q.k) + '</pre>';
    if (q.t === "ox") {
      h += '<div class="ox">' + ["O", "X"].map(function (v) {
        const cls = s.answered ? (v === q.a ? "right" : (v === s.picked ? "wrong" : "")) : "";
        return '<button type="button" class="' + cls + '" data-ox="' + v + '"' + (s.answered ? " disabled" : "") + '>' + v + '</button>';
      }).join("") + '</div>';
    } else if (q.t === "mc") {
      h += '<div class="opts">' + q.o.map(function (o, k) {
        const cls = s.answered ? (k === q.a ? " right" : (k === s.picked ? " wrong" : "")) : "";
        return '<button type="button" class="opt' + cls + '" data-mc="' + k + '"' + (s.answered ? " disabled" : "") + '><span class="n">' + (k + 1) + '</span><span>' + fmt(o) + '</span></button>';
      }).join("") + '</div>';
    }
    const self = q.t === "sa" || q.t === "bl";
    if (s.answered || (self && s.revealed)) {
      const ok = s.res[s.i];
      const cls = s.answered ? (ok ? " ok" : " ng") : "";
      const v = s.answered ? (ok ? "정답입니다" : "오답입니다") : "정답";
      const mine = self ? (s.typed[s.i] || "").trim() : "";
      h += '<div class="feedback' + cls + '">' +
        (mine ? '<span class="mine"><b>내 답</b>' + esc(mine) + '</span>' : "") +
        '<span class="v">' + v + '</span>' +
        (mine && !s.answered && norm(mine) === norm(q.a) ? '<span class="same">정답과 똑같이 썼어요</span>' : "") +
        '<span class="ans">' + fmt(answerText(q)) + '</span>' + (q.e ? '<span class="ex">' + fmt(q.e) + '</span>' : "") + '</div>';
    } else if (self) {
      h += '<textarea class="myans" id="myans" placeholder="답을 직접 써 보세요" aria-label="내 답 입력">' + esc(s.typed[s.i] || "") + '</textarea>';
      h += '<p class="hint">답을 쓰고 ‘정답 확인’을 누른 뒤, 맞았는지 직접 고르세요. 비워 두고 확인해도 돼요.</p>';
    }
    h += '</article>';
    app.innerHTML = h;

    const last = s.i === s.qs.length - 1;
    if (s.answered) {
      setDock('<button class="btn" id="next" type="button">' + (last ? "결과 보기" : "다음 문제") + '</button>');
      on("next", next);
    } else if (self && s.revealed) {
      setDock('<button class="btn ng" id="mark0" type="button">틀렸어요</button><button class="btn ok" id="mark1" type="button">맞았어요</button>');
      on("mark1", function () { record(q, true); next(); });
      on("mark0", function () { record(q, false); renderQuiz(); });
    } else if (self) {
      setDock('<button class="btn" id="reveal" type="button">정답 확인</button>');
      on("reveal", function () { s.revealed = true; renderQuiz(); });
      const ta = document.getElementById("myans");
      ta.oninput = function () { s.typed[s.i] = ta.value; };
      // Ctrl/⌘ + Enter로 바로 정답 확인
      ta.onkeydown = function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); s.revealed = true; renderQuiz(); } };
    } else {
      setDock('<button class="btn light" id="skip" type="button">건너뛰기</button>');
      on("skip", next);
    }
    app.querySelectorAll("[data-ox]").forEach(function (el) { el.onclick = function () { s.picked = el.dataset.ox; record(q, s.picked === q.a); renderQuiz(); }; });
    app.querySelectorAll("[data-mc]").forEach(function (el) { el.onclick = function () { s.picked = +el.dataset.mc; record(q, s.picked === q.a); renderQuiz(); }; });
    on("refresh", refresh);
    on("quit", function () { if (s.res.some(function (x) { return x !== undefined; })) go({ name: "result" }); else go(s.from); });
  }
  function next() {
    const s = session;
    if (s.i >= s.qs.length - 1) { go({ name: "result" }); return; }
    Object.assign(s, { i: s.i + 1, picked: null, answered: false, revealed: false });
    renderQuiz(); window.scrollTo(0, 0);
  }

  function renderResult() {
    const s = session;
    const done = s.qs.filter(function (_, k) { return s.res[k] !== undefined; });
    const ok = s.res.filter(function (x) { return x === true; }).length;
    let h = '<div class="bar"><button class="icon-btn" id="back" type="button" aria-label="뒤로">' + ICON.back + '</button><h1>' + esc(s.title) + ' 결과</h1></div><div class="stack">';
    h += '<div class="card score"><b>' + ok + ' / ' + done.length + '</b><span class="label">' + (done.length ? Math.round(ok / done.length * 100) : 0) + '점</span></div>';
    h += '<div class="card rlist">';
    s.qs.forEach(function (q, k) {
      if (s.res[k] === undefined) return;
      h += '<div class="ritem' + (s.res[k] ? "" : " ng") + '"><span class="mk">' + (s.res[k] ? "O" : "X") + '</span><p>' + fmt(q.q.split("\n")[0]) + (s.typed[k] && s.typed[k].trim() ? '<small>내 답: ' + esc(s.typed[k].trim()) + '</small>' : "") + '<small>정답: ' + fmt(answerText(q)) + '</small></p></div>';
    });
    h += '</div></div>';
    app.innerHTML = h;
    const wrong = s.qs.filter(function (_, k) { return s.res[k] === false; });
    setDock((wrong.length ? '<button class="btn light" id="retry" type="button">틀린 ' + wrong.length + '문제 다시</button>' : "") + '<button class="btn" id="again" type="button">새 문제로 다시</button>');
    on("back", function () { go(s.from); });
    on("retry", function () { start(function () { return shuffle(wrong.slice()); }, s.title + " 오답", s.from); });
    on("again", function () { start(s.maker, s.title, s.from); });
  }

  // 과목 화면 상단 탭: 문제 / 요약 / 오답노트
  function tabs(active) {
    return '<div class="tabs" role="tablist">' +
      [["subject", "문제"], ["notes", "요약"], ["wrong", "오답노트"]].map(function (t) {
        return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (active === t[0]) + '">' + t[1] + '</button>';
      }).join("") + '</div>';
  }
  function bindTabs(id) {
    app.querySelectorAll("[data-tab]").forEach(function (el) {
      el.onclick = function () { if (el.getAttribute("aria-selected") !== "true") go({ name: el.dataset.tab, id: id }); };
    });
  }

  // 오답노트에 오르는 문제: 마지막으로 틀렸고, ‘외웠어요’로 빼지 않은 것
  function wrongList(id) {
    const out = [];
    (id ? [id] : IDS).forEach(function (sid) {
      SUBJ[sid].qs.forEach(function (q) { const r = state.rec[q.id]; if (r && r.l === 0 && !r.x) out.push(q); });
    });
    return out;
  }

  // 오답노트 — 과목 탭에서 열면 그 과목만, 홈에서 열면 전 과목(과목 필터 가능)
  function renderWrong() {
    const fixed = view.id || null; // 과목 화면 탭에서 들어오면 그 과목으로 고정
    const filter = view.filter || null;
    const sid = fixed || filter;
    const sort = view.sort || "recent";
    let list = wrongList(sid);
    list.sort(function (a, b) {
      const ra = state.rec[a.id], rb = state.rec[b.id];
      if (sort === "many") return rb.w - ra.w || rb.t - ra.t;
      if (sort === "chapter") return IDS.indexOf(a.subj) - IDS.indexOf(b.subj) || Number(a.c) - Number(b.c);
      return rb.t - ra.t;
    });
    let h = '<div class="bar"><button class="icon-btn" id="back" type="button" aria-label="뒤로">' + ICON.back + '</button><h1>' +
      (fixed ? esc(SUBJ[fixed].name) : "오답노트") + '</h1></div>';
    if (fixed) h += tabs("wrong");
    else {
      h += '<div class="chips jump"><button class="chip" type="button" data-f="" aria-pressed="' + !filter + '">전체<small>' + wrongList(null).length + '</small></button>' +
        IDS.map(function (id) { return '<button class="chip" type="button" data-f="' + id + '" aria-pressed="' + (filter === id) + '">' + esc(SUBJ[id].name) + '<small>' + wrongList(id).length + '</small></button>'; }).join("") + '</div>';
    }
    h += '<div class="chips jump"><span class="label" style="align-self:center">정렬</span>' +
      [["recent", "최근 틀린 순"], ["many", "많이 틀린 순"], ["chapter", "챕터 순"]].map(function (x) { return '<button class="chip" type="button" data-sort="' + x[0] + '" aria-pressed="' + (sort === x[0]) + '">' + x[1] + '</button>'; }).join("") + '</div>';
    h += '<div class="stack">';
    if (!list.length) {
      h += '<div class="card empty"><b>오답노트가 비어 있어요</b><p>문제를 풀다 틀리면 여기에 자동으로 모입니다.</p></div>';
    }
    list.forEach(function (q) {
      const r = state.rec[q.id], b = SUBJ[q.subj];
      const d = new Date(r.t);
      h += '<article class="card wnote"><div class="qhead"><span class="tag type">' + TYPE[q.t] + '</span><span class="tag">' + esc(b.name + " · " + q.c + "장") + '</span>' +
        '<span class="tag miss">' + r.w + '번 틀림</span>' + (q.s ? '<span class="tag star">★ 빈출</span>' : "") + '<span class="tag">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span></div>' +
        '<div class="qtext">' + fmt(q.q) + '</div>' + (q.k ? '<pre class="code">' + esc(q.k) + '</pre>' : "") +
        (q.t === "mc" ? '<ol class="wopts">' + q.o.map(function (o, k) { return '<li class="' + (k === q.a ? "right" : "") + '">' + NUMS[k] + ' ' + fmt(o) + '</li>'; }).join("") + '</ol>' : "") +
        '<details class="wans"><summary>정답과 해설 보기</summary><div class="feedback"><span class="ans">' + fmt(answerText(q)) + '</span>' + (q.e ? '<span class="ex">' + fmt(q.e) + '</span>' : "") + '</div></details>' +
        '<div class="wbtns"><button class="link" type="button" data-one="' + q.id + '">이 문제 다시 풀기</button><button class="link done" type="button" data-done="' + q.id + '">외웠어요 (노트에서 빼기)</button></div></article>';
    });
    h += '</div>';
    app.innerHTML = h;
    setDock(list.length ? '<button class="btn" id="retryAll" type="button">오답 ' + list.length + '문제 전부 다시 풀기</button>' : null);

    const here = { name: "wrong", id: view.id, filter: filter, sort: sort };
    on("back", function () { go(fixed ? { name: "subject", id: fixed } : { name: "home" }); });
    if (fixed) bindTabs(fixed);
    app.querySelectorAll("[data-f]").forEach(function (el) { el.onclick = function () { go(Object.assign({}, here, { filter: el.dataset.f || null })); }; });
    app.querySelectorAll("[data-sort]").forEach(function (el) { el.onclick = function () { view.sort = el.dataset.sort; render(); }; });
    on("retryAll", function () {
      start(function () { return shuffle(wrongList(sid)); }, (sid ? SUBJ[sid].name + " " : "") + "오답 다시 풀기", here);
    });
    app.querySelectorAll("[data-one]").forEach(function (el) {
      el.onclick = function () { const q = list.find(function (x) { return x.id === el.dataset.one; }); start(function () { return [q]; }, "오답 다시 풀기", here); };
    });
    app.querySelectorAll("[data-done]").forEach(function (el) {
      el.onclick = function () { state.rec[el.dataset.done].x = true; touch(); toast("오답노트에서 뺐어요"); render(); };
    });
  }

  // 요약 — 챕터별 핵심 정리, 챕터로 바로 이동·그 챕터 문제 풀기
  function renderNotes() {
    const b = SUBJ[view.id], cfg = getCfg(b.id);
    const keys = Object.keys(b.notes);
    let h = '<div class="bar"><button class="icon-btn" id="back" type="button" aria-label="뒤로">' + ICON.back + '</button><h1>' + esc(b.name) + '</h1></div>' + tabs("notes");
    h += '<div class="chips jump">' + keys.map(function (c) { return '<button class="chip" type="button" data-jump="' + c + '">' + c + '장</button>'; }).join("") + '</div><div class="stack">';
    const detail = b.notesHtml || {};
    keys.forEach(function (c) {
      const n = b.qs.filter(function (q) { return String(q.c) === c; }).length;
      const bullets = '<ul>' + b.notes[c].map(function (t) { return "<li>" + fmtNote(t) + "</li>"; }).join("") + '</ul>';
      h += '<section class="card note" id="note-' + c + '"><h3>' + esc(c + "장 " + b.chapters[c]) + '</h3>';
      // 상세 요약(요약정리 HTML에서 가져온 것)이 있으면 그것을 보여 주고, 짧은 핵심 정리는 접어 둔다
      if (detail[c]) h += '<details class="nquick"><summary>핵심만 빠르게 보기</summary>' + bullets + '</details><div class="ndoc">' + detail[c] + '</div>';
      else h += bullets;
      h += (n ? '<button class="link" type="button" data-solve="' + c + '">이 챕터 문제 풀기 (' + n + '문제) →</button>' : "") + '</section>';
    });
    h += '</div>';
    app.innerHTML = h;
    setDock(null);
    on("back", function () { go({ name: "home" }); });
    bindTabs(b.id);
    app.querySelectorAll("[data-jump]").forEach(function (el) {
      el.onclick = function () { const t = document.getElementById("note-" + el.dataset.jump); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); };
    });
    app.querySelectorAll("[data-solve]").forEach(function (el) {
      el.onclick = function () {
        const one = Object.assign({}, cfg, { ch: [el.dataset.solve], scope: "all", types: ["ox", "mc", "sa", "bl"] });
        start(function () { return draw(poolFor(b.id, one), one.n); }, b.name + " " + el.dataset.solve + "장", { name: "notes", id: b.id });
      };
    });
  }

  render();
  initSync();
})();
</script>

</body></html>
