BANK.find(b => b.id === "ai").notesHtml = {
 "1": "<h4 class=\"n-sub\">이론 · 현실 문제를 AI의 언어로 번역하기</h4><h5>① 규칙의 한계, 학습의 시작</h5><div class=\"n-tbl\"><table><thead><tr><th>구분</th><th>전통적 프로그램</th><th>데이터 기반 인공지능</th></tr></thead><tbody><tr><td>방식</td><td>사람이 직접 규칙 작성 (if '무료' in message …)</td><td>입력 데이터와 정답의 관계를 알고리즘이 <span>스스로 발견</span></td></tr><tr><td>장점/한계</td><td>판단 과정이 명확 / 예외를 모두 미리 작성하기 어려움 (예: 정상적인 병원 예약 문자도 스팸으로 오분류)</td><td>규칙의 예외가 많을수록 패턴을 학습하는 AI가 필수적</td></tr></tbody></table></div><h5>② 문제 구조화 : 현실 문제 → 데이터 → 학습 문제</h5><ul><li><b>[Step 1] 현실 문제 → [Step 2] 데이터 → [Step 3] 학습 문제(X → y)</b></li><li>‘AI로 ~하자’ 라는 목표만으로는 학습 문제를 만들 수 없다. <span>어떤 정보를 이용해, 무엇을, 얼마나 미리 예측할 것인가?</span>를 구체화해야 한다.</li><li>예) 환자 상태 악화 예측: X = HR·BP·SpO₂·RR·Lab → y = 정상/악화 &nbsp;|&nbsp; 설비 고장 예측: X = 진동·온도·압력·전류·RPM → y = 정상/고장</li></ul><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">좋은 학습 문제를 설계하는 3가지 기둥</div><div class=\"n-tbl\"><table><thead><tr><th>기둥</th><th>질문</th><th>예시</th></tr></thead><tbody><tr><td>01 대상 (Target)</td><td>누구/무엇을 ‘하나의 사례(관측 대상)’로 볼 것인가?</td><td>문자 메시지 1건, 환자 1명, 주택 1채</td></tr><tr><td>02 시점 (Timing)</td><td>언제까지의 정보로, 언제의 결과를 예측하는가?</td><td>어제까지의 기상 데이터 → 내일의 기온</td></tr><tr><td>03 출력 (Output)</td><td>모델이 무엇을 결과로 내놓아야 하는가? (숫자·범주·집단)</td><td>스팸 여부(범주), 예상 거래 가격(숫자)</td></tr></tbody></table></div></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">AI를 구성하는 핵심 요소 : ŷ = f(X)</div><p>ŷ = f(X)</p><div class=\"n-tbl\"><table><thead><tr><th>기호</th><th>이름</th><th>의미</th></tr></thead><tbody><tr><td>X</td><td>입력 특징 (Features)</td><td>모델이 예측을 수행하기 위한 단서로 입력받는 데이터</td></tr><tr><td>f</td><td>학습된 모델 (Model)</td><td>X를 예측값 ŷ로 변환하는 내부 핵심 알고리즘(함수)</td></tr><tr><td>ŷ</td><td>예측값 (Prediction)</td><td>학습된 모델 f가 새로운 X를 받아 최종 계산한 예측 결과</td></tr><tr><td>y</td><td>실제 정답 (Ground Truth)</td><td>학습용 데이터셋에 미리 기록된 올바른 결과 = 모델의 최종 정답지</td></tr><tr><td>Row</td><td>관측 대상 (Instance)</td><td>데이터 표의 <span>하나의 행 = 하나의 관측 대상</span>(문자 메시지 1건)</td></tr></tbody></table></div><p><b>학습</b> = 입력과 정답의 관계를 이용해 모델이 더 적절한 출력을 내도록 <span>내부 매개변수를 조정</span>하는 과정. 예: 행렬 X(4건 × 4특징: 문자길이·링크개수·무료포함·연락처저장), 벡터 y(스팸여부 0:정상, 1:스팸).</p></div><h5>③ 모든 데이터는 결국 숫자(X)</h5><div class=\"n-tbl\"><table><thead><tr><th>데이터</th><th>변환 방법</th></tr></thead><tbody><tr><td>텍스트</td><td>단어·토큰·임베딩을 거쳐 숫자 벡터로 변환</td></tr><tr><td>이미지</td><td>픽셀값의 배열로 변환</td></tr><tr><td>오디오</td><td>시간에 따른 신호 파형을 숫자로 변환</td></tr></tbody></table></div><h5>④ 머신러닝의 학습 유형</h5><div class=\"n-tbl\"><table><thead><tr><th>구분</th><th>제공 정보</th><th>목표</th><th>대표 사례</th></tr></thead><tbody><tr><td>지도학습</td><td>X와 정답 y</td><td>정답을 정확히 예측</td><td>스팸 문자 분류, 주택 가격 예측</td></tr><tr><td>비지도학습</td><td>정답 없이 X만</td><td>데이터의 숨은 구조 발견</td><td>유사 고객 군집화, 이상치 탐지</td></tr><tr><td>강화학습</td><td>상태·행동·보상</td><td>누적 보상의 최대화</td><td>게임 AI, 자율주행, 로봇 제어</td></tr></tbody></table></div><ul><li><b>지도학습의 두 갈래</b> — <span>회귀(Regression)</span>: 연속적인 ‘수치’ 예측(주택 가격, 전력 사용량, 배송 소요 시간) / <span>분류(Classification)</span>: 미리 정해진 ‘범주’ 예측(정상/스팸, 질병 있음/없음)</li><li>비지도학습의 목표: 군집화(비슷한 대상 묶기) · 차원 축소(핵심 정보만 적은 축으로 요약) · 이상치 탐지</li><li>강화학습 메커니즘: 상태(State) → 행동(Action) → 환경의 반응 → 보상(Reward)</li></ul><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">치명적 설계 함정 : 데이터 누출 (Data Leakage)</div><p><b>정의</b> : 실제 예측을 수행하는 시점에는 <span>절대 알 수 없는 ‘미래의 정보’</span>가 학습 데이터 X에 포함되는 현상 → 모델 성능이 실제보다 비정상적으로 좋아 보이는 <b>착시</b>.</p><ul><li>스팸 실시간 판별 → <b>사용자의 사후 신고 여부</b> 포함</li><li>학업 중단 예측 → <b>자퇴 처리 완료 여부</b> 포함</li><li>질병 조기 예측 → <b>최종 확진 결과</b> 포함</li></ul><p><b>비유</b> : 답안지를 미리 본 학생. 공부 자료=학습 데이터(X), 시험 시점=예측 시점, 정답지=미래의 정보, 부정행위=데이터 누출. 모의고사(검증)는 100점이라 실력처럼 보이나 실전(새로운 문제)에서는 점수 폭락.</p><p>원칙 : 특징(X)은 반드시 실제 예측 시점에 가용해야 한다. 시험 ‘전’에 볼 수 있는 자료로 공부한 점수만이 진짜 실력.</p></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">어떤 정보(X)를 입력할까? 4가지 점검 기준</div><div class=\"n-tbl\"><table><thead><tr><th>기준</th><th>질문</th></tr></thead><tbody><tr><td>01 관련성</td><td>예측하려는 결과(y)와 논리적·통계적 관련이 있는가?</td></tr><tr><td>02 가용성 (누출 방지)</td><td>실제 예측을 수행하는 바로 그 시점에 얻을 수 있는 데이터인가?</td></tr><tr><td>03 측정 가능성</td><td>일관된 기준과 방법으로 안정적으로 수집할 수 있는가?</td></tr><tr><td>04 적절성</td><td>개인정보 보호·편향·윤리적/법적 문제가 없는가?</td></tr></tbody></table></div></div><ul><li><b>개인정보 보호(Privacy)</b> : 예측 목적에 꼭 필요한 <span>최소한</span>의 정보인가? 수집 시 동의를 얻었는가? 다른 정보와 결합 시 특정 개인을 재식별할 위험은 없는가?</li><li><b>편향과 공정성(Bias &amp; Fairness)</b> : X가 실제 대상 집단을 고르게 대표하는가? 특정 성별·인종 집단에서 예측 오류가 더 크게 나타나지 않는가? 과거 인간의 차별적 판단이 정답(y) 자체에 섞여 있지 않은가?</li></ul><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>스팸 판별 문제 설계도</b> : 현실 문제=스팸 문자를 줄여 사용자 불편 해소 / 관측 대상=문자 메시지 한 건 / X=문자 길이·링크 개수·특정 단어 포함 여부 (사후 신고 제외) / y=0(정상)·1(스팸) / 학습 유형=<b>지도학습 → 이진 분류</b> / ŷ=스팸일 확률. <br>출구 질문 : 해결하고 싶은 문제에서 1개의 행(Row), X, y, ŷ는 각각 무엇인가?</div><h4 class=\"n-sub\">실습 · 나만의 스마트 스팸 메시지 판별기 (2주차 · 25분)</h4><ul><li>코딩이 아니라 <b>데이터의 구조(X와 y)를 직접 설계·검증</b>하는 실습. 준비물: spam_messages.csv(<b>44건</b>), spam_lab.ipynb</li><li>3대 목표 : <b>번역</b>(문제→X→y 표) · <b>검증</b>(누출 컬럼으로 성능 착시 확인) · <b>점검</b>(편향·개인정보)</li></ul><div class=\"n-tbl\"><table><thead><tr><th>단계</th><th>내용</th><th>핵심</th></tr></thead><tbody><tr><td>1 데이터 열기</td><td>컬럼: 번호·메시지·차단버튼클릭·사후신고여부·스팸여부</td><td>한글 문장은 컴퓨터가 그대로 이해 못함 → 숫자 특징 필요</td></tr><tr><td>2 y·X 설계</td><td>y=스팸여부(1 스팸 / 0 정상). 라벨링 규칙을 <b>먼저 문장으로</b> 합의</td><td>X: 문자길이·무료포함·당첨포함·URL포함·광고표기. <code>df[\"무료포함\"]=df[\"메시지\"].str.contains(\"무료\").astype(int)</code></td></tr><tr><td>3 데이터 누출</td><td>‘차단버튼클릭’을 X에 넣으면 정확도 <span>100%</span> → 제거하면 <span>85.7%</span></td><td>도착한 순간엔 차단 여부를 알 수 없음 → 서비스에서 쓸모없는 모델</td></tr><tr><td>4 편향·개인정보</td><td>클래스 균형 스팸 22 : 정상 22 (50:50) / 전화번호 마스킹</td><td><code>re.sub(r\"\\d{2,3}-?\\d{3,4}-?\\d{4}\", \"***-****-****\", text)</code></td></tr><tr><td>5 정리</td><td>좋은 AI는 좋은 코드가 아니라 <b>좋은 표</b>에서 시작</td><td>다음주 과제: 관심 주제 X,y 표 설계(특징 5개 이상 + 누출 컬럼 1개 포함)</td></tr></tbody></table></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">누출 판별 질문 3가지 — 하나라도 ‘아니오’면 삭제!</div><div class=\"n-tbl\"><table><thead><tr><th>관점</th><th>질문</th></tr></thead><tbody><tr><td>시점</td><td>예측해야 하는 그 순간에 이미 알 수 있는 정보인가?</td></tr><tr><td>인과</td><td>정답이 정해진 뒤에 생겨나는 결과가 아닌가?</td></tr><tr><td>재현</td><td>새 데이터가 들어와도 같은 방식으로 구할 수 있는가?</td></tr></tbody></table></div></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>편향 점검 포인트</b> — ① 클래스 균형: 현실은 스팸이 훨씬 적다. 불균형 데이터에서 ‘전부 정상’이라 답해도 정확도 95%가 나오는 함정을 주의. ② 유형 편향: 스팸이 전부 ‘(광고)’ 말투면 ‘검찰청입니다…’ 같은 <b>보이스피싱형 스팸</b>은 놓친다. ③ 애매한 사례(동아리 경품 당첨 문자)는 팀이 합의해야 데이터 품질 유지.</div>",
 "2": "<h4 class=\"n-sub\">이론 · 모델의 학습과 성능 평가</h4><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">목표는 ‘안 본 문제’를 맞히는 것 (일반화)</div><ul><li>기출문제 암기생(과적합 모델): <b>문제집 100점, 수능 50점</b> ↔ 원리 이해자(일반화 모델): 문제집 90점, 수능 95점</li><li>AI의 진짜 목적은 훈련 데이터의 ‘암기’가 아니라 <span>한 번도 보지 못한 새로운 데이터에 대한 ‘예측’</span>.</li><li>입력 x=공부시간, 정답 y=실제 시험점수, 예측값 ŷ=모델이 예상한 점수</li></ul></div><h5>① 4가지 미션</h5><div class=\"n-tbl\"><table><thead><tr><th>미션</th><th>질문</th><th>핵심 개념</th></tr></thead><tbody><tr><td>01</td><td>모델은 무엇을 돌리며 학습하는가?</td><td>매개변수 (θ: w, b)</td></tr><tr><td>02</td><td>잘못된 예측을 어떻게 숫자로 벌주는가?</td><td>손실함수</td></tr><tr><td>03</td><td>왜 문제집과 모의고사를 나누어야 하는가?</td><td>데이터 분할</td></tr><tr><td>04</td><td>진짜 실력을 어떤 자(Ruler)로 잴 것인가?</td><td>평가지표</td></tr></tbody></table></div><h5>② 매개변수와 손실함수</h5><ul><li>모델 <b>ŷ = f(x; θ)</b>, 선형회귀 <b>ŷ = wx + b</b>. 학습이란 프로그램이 스스로 코드를 짜는 것이 아니라 <span>다이얼(w, b)을 미세하게 돌려 조율</span>하는 과정.</li><li><b>오차(Error)</b> = 실제 정답 y − 예측값 ŷ (예: 예측 72점, 정답 80점 → <span>오차 8점</span>). 오차들을 모아 ‘얼마나 틀렸는가’를 하나의 숫자로 압축한 것이 <b>손실함수(Loss, L)</b>. 목표: 손실을 최소로 줄이는 다이얼 위치 찾기.</li></ul><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">회귀 손실 MSE · 분류 손실 교차엔트로피</div><p>MSE = (1/n) Σ (y − ŷ)²</p><ul><li>제곱을 하는 이유: ① +2와 −2 오차가 0으로 <b>상쇄되는 것을 방지</b> ② 작은 실수보다 <span>큰 실수에 훨씬 무거운 벌점</span>(예: 오차 2→4, 4→16)을 주어 큰 오차를 피하도록 강제.</li><li><b>교차 엔트로피</b>(분류): 정답을 맞혔는지뿐 아니라 <span>얼마나 확신했는지(확률)</span>가 중요. 정답이 1(고양이)인데 0.1로 예측하면 엄청난 손실, 0.9로 예측하면 손실 아주 작음.</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">경사하강법과 학습률(η)</div><ul><li>안개 낀 산속 하산: 현재 위치=현재 매개변수 상태, 산의 높이=현재 손실, 내려가는 방향=<b>기울기의 반대</b>. <b>최적화(Optimization)</b>=손실함수의 골짜기 바닥을 찾아가는 탐험.</li><li><b>학습률(η)</b> = 매개변수를 한 번에 얼마나 업데이트할지(보폭). 너무 작으면 느린 수렴(바닥 도달 전 해가 저뭄), 적절하면 안정적 안착, <span>너무 크면 반대편으로 튀어 발산/불안정</span>.</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">매개변수 vs 하이퍼파라미터</div><div class=\"n-tbl\"><table><thead><tr><th>구분</th><th>매개변수 (Parameter)</th><th>하이퍼파라미터 (Hyperparameter)</th></tr></thead><tbody><tr><td>누가 정하나</td><td><b>모델이</b> 데이터를 풀며 스스로 깨우치고 변경</td><td><b>개발자가</b> 학습 시작 전에 외부에서 미리 설정</td></tr><tr><td>예시</td><td>w, b (<code>model.coef_</code>)</td><td>learning_rate, max_depth, 다항회귀의 degree</td></tr></tbody></table></div></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">공정한 실력 측정을 위한 3단계 분할</div><div class=\"n-tbl\"><table><thead><tr><th>데이터</th><th>비율</th><th>비유</th><th>역할</th></tr></thead><tbody><tr><td>훈련 (Train)</td><td><b>70%</b></td><td>매일 푸는 문제집</td><td>답안지 보며 오답 노트 작성 → 매개변수 학습</td></tr><tr><td>검증 (Validation)</td><td><b>15%</b></td><td>9월 모의고사</td><td>학습 방향 점검 및 하이퍼파라미터 수정 기회</td></tr><tr><td>테스트 (Test)</td><td><b>15%</b></td><td>봉인된 수능 시험지</td><td>실전 단 한 번뿐, 결과를 보고 훈련 방식을 절대 되돌릴 수 없음</td></tr></tbody></table></div><p>테스트 결과를 보고 모델 설정을 반복 수정하면 → 테스트 데이터까지 ‘간접적으로 학습’한 셈 → 평가의 신뢰성 붕괴. 테스트는 반드시 마지막 최종 평가에서만 개봉.</p></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">과소적합 · 적절한 학습 · 과적합</div><div class=\"n-tbl\"><table><thead><tr><th>상태</th><th>모델</th><th>훈련 성능</th><th>테스트 성능</th></tr></thead><tbody><tr><td>과소적합 (Underfitting)</td><td>1차 모형 — 수업을 전혀 못 따라감</td><td>낮음 ↓</td><td>낮음 ↓</td></tr><tr><td>적절한 학습 (일반화)</td><td>적절한 차수 — 원리 완벽 이해</td><td>높음 ↑</td><td>높음 ↑</td></tr><tr><td>과적합 (Overfitting)</td><td>15차 모형 — 기출 번호와 오타까지 암기</td><td><span>매우 높음</span></td><td>상대적으로 낮음 ↓</td></tr></tbody></table></div><p>잡음(Noise)까지 규칙으로 착각해 암기하면 실전에서 무너짐. 예) <b>훈련 95%, 테스트 68% → 전형적 과적합</b>. 두 성능 간 격차가 벌어지는 순간을 포착하는 것이 중요.</p></div><h5>③ 회귀 평가 : 오차를 재는 세 가지 자</h5><div class=\"n-tbl\"><table><thead><tr><th>지표</th><th>특징</th></tr></thead><tbody><tr><td>MAE (절댓값 자)</td><td>눈금 간격이 일정, 원래 단위로 해석 쉬움</td></tr><tr><td>MSE (돋보기 자)</td><td>큰 오차 부분의 눈금이 기하급수적으로 벌어짐 → 큰 오차에 민감</td></tr><tr><td>RMSE (원상복구 자)</td><td>MSE로 커진 단위를 원래 스케일로 압축(제곱근)한 실용적인 자</td></tr><tr><td>R² (결정계수)</td><td>평균만 찍었을 때보다 얼마나 똑똑하게 맞췄는지를 1에 가깝게 표현</td></tr></tbody></table></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">분류 평가 : 혼동행렬 · 정밀도 · 재현율 · F1</div><div class=\"n-tbl\"><table><thead><tr><th></th><th>실제 양성</th><th>실제 음성</th></tr></thead><tbody><tr><td>예측 양성</td><td>TP 정답</td><td>FP 오탐 (정상을 양성으로)</td></tr><tr><td>예측 음성</td><td>FN 놓침 (양성을 음성으로)</td><td>TN 정답</td></tr></tbody></table></div><ul><li><b>데이터 불균형의 함정</b> : 365일 중 364일 맑은 사하라 기상청이 매일 ‘비 안 옴’으로 찍으면 <span>정확도 99.7%</span>, 하지만 비 오는 날은 한 번도 못 맞힘 → 쓸모없는 깡통.</li><li><b>정밀도(Precision)</b> 중요 : 스팸 메일 필터 (정상 메일을 차단하는 <b>오탐 FP</b>이 안 될 때)</li><li><b>재현율(Recall)</b> 중요 : 암 환자 진단 (환자를 정상으로 오해해 돌려보내는 <b>놓침 FN</b>이 안 될 때)</li><li><b>F1 점수</b> = 정밀도와 재현율의 균형을 잡는 <span>조화평균</span> 지표.</li></ul></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>생성형 AI 활용법</b> : 단순히 코드를 짜달라고 하지 말고, 수치 결과의 이유와 현상을 설명해 달라고 질의하며 <b>실험 설계 보조자</b>로 활용. 예) “15차 모델에서 훈련 MSE는 작지만 테스트 MSE는 커. 과적합 용어로 설명해줘.”</div><h4 class=\"n-sub\">실습 · 모델을 복잡하게 만들면 더 똑똑해질까? (다항회귀)</h4><ul><li>핵심 조작: <b>Polynomial degree</b>(복잡도 다이얼) — degree=1 단순(과소적합 가능) / 3 적절한 곡선 / <b>15 매우 복잡(과적합 가능)</b>. 이번 실험의 하이퍼파라미터=degree.</li><li>핵심 비교: <b>Train MSE vs Test MSE</b>. 관측값 = 규칙 + 잡음. 25분 실습에서는 원리 확인을 위해 Train/Test만 사용.</li><li>MSE = 평균(실제값 − 예측값)². 좋은 모델이라면 <b>Test MSE</b>가 작아야 한다.</li></ul><div class=\"n-tbl\"><table><thead><tr><th>상태</th><th>Train MSE</th><th>Test MSE</th><th>해석</th></tr></thead><tbody><tr><td>과소적합</td><td>큼</td><td>큼</td><td>학습을 못한 모델</td></tr><tr><td>적절한 학습</td><td>작음</td><td>작음</td><td>일반화 양호</td></tr><tr><td>과적합</td><td>매우 작음</td><td>다시 커짐</td><td>학습을 못한 게 아니라 훈련 데이터를 ‘너무 잘’ 학습 — Train MSE↓ ≠ Test MSE↓</td></tr></tbody></table></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>오늘의 결론(3줄)</b> ① 복잡한 모델이 항상 좋은 모델은 아니다. ② 훈련 성능이 가장 높은 모델이 항상 좋은 모델은 아니다. ③ 보지 않은 데이터에서도 잘 작동하는 모델(= <b>일반화</b>)이 좋은 모델이다.</div>",
 "3": "<h4 class=\"n-sub\">이론 · 비지도 학습, K-means, PCA</h4><ul><li>학습의 패러다임이 ‘관계’에서 ‘내부 구조’로: <b>지도학습</b>=예측과 정답의 차이(오차)를 줄이는 훈련 / <b>비지도학습</b>=데이터 내부의 <span>거리와 분산(Structure)</span>을 최적화하는 탐험.</li><li>비지도로 찾는 4가지 구조: <b>고객 세분화</b>(구매 패턴 비슷한 고객군) · <b>문서 탐색</b>(내용 비슷한 문서 군집화) · <b>이상 탐지</b>(정상에서 멀리 떨어진 사례) · <b>시각화</b>(수백 개 특징을 2차원 지도로 요약).</li></ul><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">K-means : 거리 + 반복 = 군집 내부의 최적화</div><p>각 점을 가까운 중심에 배정하고, 중심을 다시 계산한다.</p><div class=\"n-tbl\"><table><thead><tr><th>시작 전 정해야 할 3가지 규칙</th><th>의미</th></tr></thead><tbody><tr><td>K (군집의 개수)</td><td>운동장에 몇 개의 깃발을 꽂을 것인가? — <span>알고리즘이 자동으로 정해주지 않음 (우리가 지정)</span></td></tr><tr><td>거리 (가까움의 기준)</td><td>어떤 길을 따라 걸을 것인가?</td></tr><tr><td>초기 중심 (출발점)</td><td>첫 깃발을 어디에 던질 것인가?</td></tr></tbody></table></div><div class=\"n-tbl\"><table><thead><tr><th>4단계 라이프사이클</th><th>내용</th></tr></thead><tbody><tr><td>1. 배정</td><td>각 점을 가장 가까운 깃발(중심)로 배정</td></tr><tr><td>2. 갱신</td><td>각 군집의 중심을 다시 계산</td></tr><tr><td>3. 확인</td><td>아직 움직이는가? 변화가 있으면 1단계로 복귀</td></tr><tr><td>4. 종료</td><td>중심이 더 이상 움직이지 않으면 군집 완성</td></tr></tbody></table></div></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">비지도학습도 결국 ‘손실(Loss)’을 줄이는 과정</div><ul><li>지도학습의 손실 = 예측값과 정답 사이의 오차 / <b>비지도학습(K-means)의 손실 = 데이터 x<sub>i</sub>와 군집 중심 μ<sub>c(i)</sub> 사이의 ‘거리(텐션)’</b>. 고무줄들의 전체 장력이 최소가 되는 상태를 찾는 최적화.</li><li><span>손실(inertia)은 K가 커질수록 무조건 줄어든다.</span> 하지만 ‘수학적 최적’이 항상 ‘현실의 정답’은 아니다 → 도메인 지식을 통한 해석이 필수 (K=2, 3, 5 비교).</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">차원의 저주 (Curse of Dimensionality)</div><div class=\"n-tbl\"><table><thead><tr><th>공간</th><th>필요 격자</th><th>의미</th></tr></thead><tbody><tr><td>1차원 (골목길)</td><td>10¹</td><td>닿을 듯 가까운 이웃</td></tr><tr><td>2차원 (광장)</td><td>10²</td><td>100명이면 다시 구조가 보임</td></tr><tr><td>고차원 (우주)</td><td>10¹⁰⁰</td><td>공간이 너무 방대해 모두가 홀로 고립됨</td></tr></tbody></table></div><ul><li>특징(Feature)이 많다고 AI가 더 잘 배우는 것은 아님: 차원이 늘면 <b>이웃이 사라지고</b>, 최근접 거리와 최원 거리의 차이가 희미해져 ‘누가 더 가까운가’ 판단 불가(거리 개념의 붕괴).</li><li>잡음 특징은 모델을 ‘융통성 없는 암기생’으로 만든다 → <b>잡음에 집중하는 과적합</b> vs 저차원/핵심 원리를 파악한 일반화 모델.</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">PCA (주성분 분석) : 본질을 투영하다</div><ul><li>PCA는 불필요한 차원을 버리고 데이터의 정보(<b>분산</b>)를 가장 많이 담아내는 <span>‘새로운 축’</span>을 찾는 과정.</li><li>그림자 비유: 데이터가 가장 넓게 퍼지는 방향(= <b>분산이 최대화</b>되는 축)이 정보 손실이 가장 적은 최적의 투영 좌표.</li></ul><p>Σv = λv</p><div class=\"n-tbl\"><table><thead><tr><th>기호</th><th>이름</th><th>의미</th></tr></thead><tbody><tr><td>Σ</td><td>공분산 행렬</td><td>데이터 구름 자체의 입체적인 모양</td></tr><tr><td>v</td><td>고유벡터</td><td>빛을 비추는 ‘최적의 각도’ = 새로운 축의 방향</td></tr><tr><td>λ</td><td>고유값</td><td>그림자가 쫙 퍼진 넓이 = 그 축이 설명하는 분산의 크기</td></tr></tbody></table></div><p><b>가장 큰 λ(고유값)를 가지는 v(고유벡터)가 제1주성분(PC1)</b>.</p><div class=\"n-tbl\"><table><thead><tr><th>PCA 4단계 파이프라인</th><th>내용</th></tr></thead><tbody><tr><td>1. 중심화 및 표준화</td><td>데이터를 원점(0,0)으로 옮기고 찌그러진 스케일 맞추기</td></tr><tr><td>2. 공분산 계산</td><td>특징들이 어떻게 함께 변하는지(Σ) 파악</td></tr><tr><td>3. 축 선택</td><td>고유벡터를 고유값이 큰 순서대로 정렬</td></tr><tr><td>4. 투영 (Transform)</td><td>원래 데이터를 선택한 2D 캔버스(새 좌표)로 눌러 찍기</td></tr></tbody></table></div><p>설명분산비 예: <b>PC1 68% + PC2 22% (+ PC3 10%)</b> → PC1+PC2 = 단 2개의 축만으로 전체 정보(분산)의 <span>90% 보존</span>.</p></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">현실 세계의 두 함정 : 단위와 누출</div><ul><li><b>함정 1 — 단위에 지배당한 알고리즘</b> (코끼리와 쥐): 몸무게(0~5000 kg)·꼬리 길이(0~50 mm)처럼 단위가 다르면 숫자가 큰 특징이 거리 계산을 지배 → <b>표준화(Standardization, Z-score)</b>: 모든 특징을 평균 0, 표준편차 1 수준의 동등한 잣대로.</li><li><b>함정 2 — 미래를 훔쳐보는 죄(데이터 누출)</b>: 훈련과 테스트를 동시에 섞어 기준을 잡으면 실패. <span>훈련 데이터로만 기준을 세우고(fit), 테스트에는 적용(transform)만</span> 하면 성공.</li></ul></div><div class=\"n-tbl\"><table><thead><tr><th>종합</th><th>지도학습</th><th>비지도학습</th></tr></thead><tbody><tr><td>학습 대상</td><td>X와 y의 관계</td><td>X 내부의 구조</td></tr><tr><td>손실(Loss)</td><td>예측과 정답의 차이</td><td>데이터와 중심의 거리</td></tr><tr><td>매개변수</td><td>회귀계수 / 가중치(Weight)</td><td>군집 중심 / 주성분 축</td></tr><tr><td>일반화 목표</td><td>새로운 데이터의 예측</td><td>안정적이고 유용한 구조 도출</td></tr></tbody></table></div><p>정답(y)이 없다는 것뿐, 비지도 학습 역시 목적함수와 최적화라는 AI의 거대한 법칙 안에서 작동한다.</p><h4 class=\"n-sub\">실습 · Iris 데이터 : K-means · StandardScaler · PCA (Colab)</h4><ul><li>오늘의 질문: 정답(label)이 없어도 데이터에서 의미 있는 구조를 찾을 수 있을까? X=꽃받침 길이·너비, 꽃잎 길이·너비(<b>4개</b> 측정값), y=실제 품종은 처음에 사용하지 않고 마지막에 확인.</li></ul><div class=\"n-tbl\"><table><thead><tr><th>단계</th><th>코드 / 핵심</th><th>포인트</th></tr></thead><tbody><tr><td>1 K-means</td><td><code>KMeans(n_clusters=3, random_state=0, n_init='auto')</code> · <code>fit_predict(X)</code></td><td>중심 배정→중심 갱신→반복. 군집 번호 0·1·2는 품종 이름이 아니라 <b>단순한 군집 ID</b>. K는 우리가 지정.</td></tr><tr><td>2 표준화</td><td><code>StandardScaler</code> : 각 특성을 평균 0, 표준편차 1 수준으로</td><td>K-means는 <b>거리 기반</b> → 스케일 영향. 표준화 전·후 군집 비교.</td></tr><tr><td>3 K 바꾸기</td><td>K = 2, 3, 4, 5 실행, 각 K의 <b>inertia</b> 기록</td><td>inertia는 K가 커질수록 감소 → ‘가장 작은 값’만으로 K를 고르면 안 됨.</td></tr><tr><td>4 PCA</td><td><code>PCA(n_components=2)</code> · <code>fit_transform(X_scaled)</code></td><td>4개 특성 → PC1, PC2 두 축. <code>explained_variance_ratio_</code>로 누적 설명분산비 확인.</td></tr><tr><td>5·6 시각화·정답 공개</td><td>PCA 좌표 위 K-means 군집 색칠 → 같은 좌표를 실제 품종으로 다시 색칠</td><td><span>군집은 분류와 같지 않다</span>.</td></tr></tbody></table></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>연결</b> : K-means=거리 손실을 줄이는 방향으로 군집을 최적화 / PCA=분산을 많이 보존하는 축을 찾음. AI는 ‘정답 생성기’가 아니라 <b>분석 파트너</b> — AI 설명 중 ‘실험 결과로 확인 가능한 주장’과 그렇지 않은 주장을 구분할 것. <br>과제: k=2, k=4로 군집화 → PCA 공간 그림 + 실제 품종과 <b>교차표</b> 비교 → 어느 쪽이 실제 품종 구조와 더 비슷한지 근거 설명.</div>",
 "4": "<h4 class=\"n-sub\">이론 · 순전파 연산과 비선형성의 비밀</h4><ul><li>강의 여정: 과거(2~4주차) 데이터 이해·구조 탐색(지도학습, K-means, PCA) → <b>현재(5주차) 인공 뇌의 구조 설계와 예측(MLP와 순전파)</b> → 미래(6주차) 오차 역전파 → (7주차) 깊은 신경망 학습. 오늘의 목표는 ‘학습’이 아니라 AI가 어떻게 <span>예측값(Prediction)을 도출</span>하는지 그 구조와 흐름 이해.</li></ul><h5>① 자연의 설계도 vs 공학자의 설계도</h5><div class=\"n-tbl\"><table><thead><tr><th>생물 뉴런</th><th>인공 뉴런(퍼셉트론)</th><th>역할</th></tr></thead><tbody><tr><td>신호 수신 (Dendrite)</td><td>입력 데이터 (Input, x)</td><td>외부 환경의 정보</td></tr><tr><td>시냅스 연결 (Synapse)</td><td>가중치 (Weight, w)</td><td>‘볼륨 조절기’ — 각 정보의 중요도를 결정</td></tr><tr><td>세포체 (Soma)</td><td>가중합 (Summation, Σ)</td><td>들어온 신호들의 총합을 계산</td></tr><tr><td>축삭둔덕 (Axon Hillock)</td><td>활성화 함수 (Activation, f)</td><td>신호를 다음으로 보낼지 결정</td></tr></tbody></table></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">단층 퍼셉트론</div><p>z = w₁x₁ + w₂x₂ + b &nbsp;→&nbsp; y = f(z)</p><ul><li>가중치 w = 각 입력의 영향력(중요도) / <b>편향 b</b> = 판단 기준의 위치를 이동(기본 성향) / 계단 함수: <code>z ≥ 0이면 1, 아니면 0</code></li><li>예) ‘우산을 챙길까?’ x₁=일기예보 비 확률(0.8), x₂=현재 구름 양(0.5) → 챙긴다(1)/안 챙긴다(0).</li><li><code>X @ w</code> 는 여러 관측치의 가중합을 한 번에 계산한다.</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">XOR 문제 · 첫 번째 AI 겨울</div><ul><li>AND·OR 는 <b>직선 하나로</b> 분리 가능(선형 분리 가능) / <span>XOR는 선형 분리 불가능</span> — 같은 클래스의 점이 <b>대각선</b> 방향에 놓임.</li><li><b>단층 퍼셉트론의 치명적 한계</b>: 하나의 선으로는 절대 풀 수 없는 문제 → 이 수학적 장벽이 첫 번째 <b>‘AI 겨울(AI Winter)’</b>을 불렀다.</li><li>학습 횟수의 문제가 아니라 모델이 만들 수 있는 경계가 직선 하나이기 때문 (실습: AND는 정확도 100%, XOR는 오분류가 남음).</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">돌파구 ① 은닉층 · ② 활성화 함수 (비선형성)</div><ul><li><b>은닉층(Hidden Layer)</b> : 단일 결정 → ‘위원회 합의’. 원본 데이터를 해결하기 쉬운 <span>새로운 표현(Representation)</span>으로 변환하는 역할. (A 패턴 위원, B 패턴 위원의 보고를 종합해 최종 결정)</li><li><b>선형성의 덫</b> : 각 층이 곱셈·덧셈(선형 변환)만 하면 층을 백 개, 천 개 쌓아도 결국 ‘거대한 하나의 선형식’으로 압축. 예) 3·(2·x) = 6x. 수식: <code>(XW₁)W₂ = X(W₁W₂)</code> (행렬곱의 결합법칙) → 비선형 변환이 없으면 깊이를 늘려도 표현력이 늘지 않는다.</li><li><b>활성화 함수</b> : 선형 변환 사이에 끼어 평탄한 공간을 구부리고 꺾어 복잡한 <b>결정 경계</b>를 만들게 해주는 필수 장치. 은닉층(구조) + 활성화 함수(비선형성) → 세상의 어떤 복잡한 패턴도 표현 가능.</li></ul></div><div class=\"n-tbl\"><table><thead><tr><th>함수</th><th>특징</th><th>평가</th></tr></thead><tbody><tr><td>Step (계단)</td><td>너무 극단적이고 미분 불가능 → 신경망을 ‘학습’시킬 수 없음</td><td>퇴출(Obsolete)</td></tr><tr><td>Sigmoid (S자 곡선)</td><td>확률(0~1) 표현에 좋지만 층이 깊어지면 신호가 약해지는 <b>기울기 소실(Vanishing Gradient)</b>, 큰 |z|에서 기울기 감소</td><td>제한적 사용</td></tr><tr><td>ReLU (꺾은선)</td><td><code>y = max(0, z)</code> — 음수는 0(차단), 양수는 그대로 통과(45°). 연산이 압도적으로 빠르고 깊은 망에서도 신호 전달 잘 됨</td><td><b>현대의 표준</b> (은닉층에서 널리 사용)</td></tr></tbody></table></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">MLP 구조와 순전파 (Forward Propagation)</div><ul><li><b>MLP</b> = 입력층(감각 기관) → 은닉층(‘가중합 + 활성화 함수’의 반복, 데이터를 새로운 관점으로 해석) → 출력층(최종 예측값)</li><li>순전파 = 주어진 데이터를 층의 순서대로 통과시켜 최종 결과를 만들어내는 계산 과정. 4단계: <b>① 가중합 z = Wx + b → ② 활성화 a = ReLU(z) → ③ 다음 층으로 전달 → ④ 최종 출력 ŷ</b></li><li>수식: Z₁ = XW₁ + b₁ → A₁ = ReLU(Z₁) → Z₂ = A₁W₂ + b₂ → ŷ = sigmoid(Z₂)</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">왜 행렬인가? Shape 매칭 퍼즐</div><ul><li>여러 뉴런의 계산을 행렬 W 하나로 묶으면 한 번에 연산 가능 → 행렬 연산에 특화된 <b>GPU</b>가 현대 AI의 심장.</li><li><b>절대 규칙 (N×M)·(M×K) = (N×K)</b> : <span>안쪽 차원 M이 반드시 일치</span>해야 곱할 수 있다. 파이썬 실습 중 오류의 90%는 차원 불일치(Dimension mismatch) → 코드를 짜기 전 반드시 종이에 shape을 그려볼 것.</li></ul></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>5주차 요약 · Cliffhanger</b> : 구조적 한계 극복(은닉층 도입) · 비선형성 추가(ReLU) · 고속 연산 엔진(행렬곱 순전파). 하지만 순전파는 단지 현재 실력으로 ‘찍어보는 것’일 뿐 — AI는 아직 스스로 <b>학습</b>하지 못했다. → 다음 주: 오답을 분석해 가중치를 스스로 수정하는 <b>역전파(Backpropagation)</b>.</div><h4 class=\"n-sub\">실습 · XOR 한계부터 순전파와 행렬 shape까지 (Colab 25분)</h4><ul><li>확인할 네 가지: <b>퍼셉트론의 계산(가중합+계단함수) · 선형성의 한계(AND vs XOR) · 비선형성의 추가(ReLU+은닉층) · 순전파(행렬 계산과 shape)</b></li></ul><div class=\"n-tbl\"><table><thead><tr><th>내용</th><th>코드 / 결과</th></tr></thead><tbody><tr><td>퍼셉트론 순전파</td><td><code>z = X @ w + b</code>, <code>step(z) = (z >= 0).astype(int)</code></td></tr><tr><td>선형층 연쇄</td><td><code>np.allclose((X@W_a)@W_b, X@(W_a@W_b))</code> → <b>True</b> (비선형 변환이 없으면 깊이가 무의미)</td></tr><tr><td>MLP로 XOR 해결</td><td><code>MLPClassifier(hidden_layer_sizes=(4,), activation=\"relu\", solver=\"lbfgs\", max_iter=5000, random_state=0)</code> — 은닉 뉴런 4개 1층. 경계가 직선 하나가 아니며 네 점 모두 분류.</td></tr><tr><td>행렬 shape</td><td>X:(4,2) · W1:(2,2) → Z1=X@W1+b1:(4,2) · W2:(2,1) → Z2=A1@W2+b2:(4,1). <b>4=샘플 수, 마지막 1=출력 뉴런 수</b>. shape 확인은 가장 빠른 신경망 디버깅 방법.</td></tr><tr><td>손으로 만든 XOR 해</td><td>W1=[[1,-1],[-1,1]], W2=[[10],[10]] → h1은 x1&gt;x2, h2는 x2&gt;x1 에 반응 → 확률 0.5 기준으로 [0, 1, 1, 0]</td></tr></tbody></table></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>핵심 정리</b> ① 단일 퍼셉트론=직선 결정 경계만 표현 ② XOR=선형 분리 불가능 ③ 은닉층+ReLU=비선형 결정 경계 표현 ④ 순전파=행렬곱과 활성화의 반복. 선택 실험: 은닉층 크기·활성화 함수를 바꿔 결정 경계 비교 — 복잡한 경계가 항상 좋은 것은 아니다(과제 문항 3: 은닉 뉴런이 많을수록 모든 문제에서 늘 좋은가? → 아니다). 과제: 은닉 뉴런 1~4개일 때 XOR 예측값·정확도 비교.</div>",
 "5": "<h4 class=\"n-sub\">이론 · 미분의 연쇄 법칙과 역전파</h4><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">학습 한 사이클 : 예측 → 손실 계산 → 기울기 계산 → 가중치 수정</div><ul><li>학습 = <b>가중치를 조정하는 과정</b>. 입력 x → 예측 ŷ → 정답 y와 비교 → 가중치 수정. 같은 입력이라도 가중치가 바뀌면 예측값이 달라진다. 목표: 처음 보지 않은 데이터에서도 예측 오차 줄이기.</li><li><b>손실함수</b> : 회귀 = MSE (1/n) Σ(yᵢ − ŷᵢ)² (제곱하여 평균) / 분류 = <b>교차 엔트로피</b> (정답 범주에 준 확률이 낮을수록 큰 벌점).</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">미분과 경사하강법</div><p>f′(x) ≈ [f(x + Δx) − f(x)] / Δx</p><ul><li>미분 = 작은 변화에 대한 반응. <b>기울기 = 출력 변화 ÷ 입력 변화</b>. 양수 기울기: x를 올리면 함수값 증가 / 음수 기울기: x를 올리면 함수값 감소.</li><li><b>경사하강법</b> : 기울기 반대 방향으로 한 걸음.</li></ul><p>w<sub>new</sub> = w<sub>old</sub> − η · ∂L/∂w</p><p>η = 학습률. 너무 크면 최솟값을 지나치고, 너무 작으면 학습이 느리다.</p></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">합성함수와 연쇄 법칙 (Chain Rule)</div><p>x → u = g(x) → L = f(u) &nbsp;⇒&nbsp; dL/dx = (dL/du) · (du/dx)</p><ul><li>전체 변화율 = 경로를 따라 <span>단계별 변화율을 곱한 것</span> (x가 u에 미치는 영향 × u가 L에 미치는 영향).</li><li><b>계산 예</b> : u = 3x, L = u², x = 2 → u = 6, dL/du = 12, du/dx = 3 → <span>dL/dx = 12 × 3 = 36</span> (직접 계산 L = 9x² → 도함수 18x = 36 으로 검산).</li></ul></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">순전파 vs 역전파 · 한 은닉 뉴런의 역전파</div><ul><li><b>순전파</b>: 왼쪽 → 오른쪽으로 값을 계산 / <b>역전파</b>: 오른쪽 → 왼쪽으로 손실의 기울기를 계산.</li><li>모형: z = wx + b → h = σ(z) → ŷ = vh → L(ŷ, y)</li></ul><p>∂L/∂w = (∂L/∂ŷ)(∂ŷ/∂h)(∂h/∂z)(∂z/∂w)</p><p>첫 층의 가중치 w를 아주 조금 바꾸면 최종 손실 L이 얼마나 변할까? → 연쇄 법칙으로 4개 항을 곱한다.</p></div><h4 class=\"n-sub\">실습 · 코드 한 줄을 수식 한 줄로 읽는 역전파 (25분 · 9개 셀)</h4><p><code>grad = dL_dyhat * dyhat_dh * dh_dz * dz_dw</code> — 변수 이름 <b>dA_dB는 ∂A/∂B</b>로 읽는다. 셀 2~4: 숫자 하나로 계산 / 셀 5~9: 같은 계산을 행렬로.</p><div class=\"n-tbl\"><table><thead><tr><th>셀</th><th>코드가 하는 일</th><th>확인할 숫자</th></tr></thead><tbody><tr><td>1</td><td>sigmoid 정의(<code>np.clip</code>으로 exp 오버플로 방지), 출력 자릿수 설정</td><td><code>set_printoptions(precision=4)</code></td></tr><tr><td>2</td><td>뉴런 하나의 순전파 (x=1, y=1, w=0.5, b=0, v=1 / 출력층은 선형 ŷ = vh)</td><td>z=0.5 → h=0.6225 → ŷ=0.6225 → <b>loss = 0.071268</b> (L=½(ŷ−y)²)</td></tr><tr><td>3</td><td>연쇄법칙 기울기 + <b>수치 미분(중앙 차분, eps=1e-5)</b> 검산 (<code>assert np.isclose</code>)</td><td><b>grad = −0.088723</b></td></tr><tr><td>4</td><td>가중치 한 번 수정 (lr=0.5)</td><td><b>w: 0.5000 → 0.5444</b>, 손실 0.071268 → 0.067408</td></tr><tr><td>5</td><td>XOR 데이터, 매개변수 초기화 (<code>seed=7</code>, 딕셔너리 p)</td><td><b>W1 (2,4), W2 (4,1)</b></td></tr><tr><td>6</td><td>행렬 순전파 forward(), 교차 엔트로피 <code>mean(logaddexp(0,Z2) − Y*Z2)</code></td><td><b>초기 손실 0.6994</b> ≈ ln 2 = 0.6931 (‘모르는 상태’)</td></tr><tr><td>7</td><td>역전파 함수 backward(), 5000번 반복 학습</td><td><b>최종 손실 0.0019</b>, 손실 기록 5001개</td></tr><tr><td>8</td><td>학습 곡선, 결정 영역 그림</td><td>확률 0.5 경계선</td></tr><tr><td>9</td><td>학습률만 바꿔 비교 (seed 고정)</td><td>lr 0.01 / 1.0 / 200</td></tr></tbody></table></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">셀 3 · 연쇄법칙 4항의 값</div><div class=\"n-tbl\"><table><thead><tr><th>코드 변수</th><th>수식</th><th>값</th><th>의미</th></tr></thead><tbody><tr><td>dL_dyhat</td><td>∂L/∂ŷ = ŷ − y</td><td>−0.3775</td><td>예측이 정답보다 작다</td></tr><tr><td>dyhat_dh</td><td>∂ŷ/∂h = v</td><td>1.0</td><td>출력층 가중치</td></tr><tr><td>dh_dz</td><td>∂h/∂z = h(1 − h)</td><td>0.2350</td><td>시그모이드 미분 (최대 0.25)</td></tr><tr><td>dz_dw</td><td>∂z/∂w = x</td><td>1.0</td><td>입력</td></tr></tbody></table></div><p>grad = −0.3775 × 1.0 × 0.2350 × 1.0 = <b>−0.088723</b>. 음수 기울기를 빼면(<code>w_new = w − lr·grad</code>) w는 커진다: 0.5 − 0.5×(−0.0887) = 0.5444.</p></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">셀 7 · backward() = 셀 3의 곱셈을 행렬로</div><div class=\"n-tbl\"><table><thead><tr><th>연쇄법칙의 항</th><th>셀 3 (숫자 하나)</th><th>셀 7 backward()</th><th>크기</th></tr></thead><tbody><tr><td>출력의 오차</td><td>y_hat − y</td><td>dZ2 = (P−Y)/len(X)</td><td>4×1</td></tr><tr><td>뒤 가중치 곱하기</td><td>* v</td><td>dH = dZ2 @ W2.T</td><td>4×4</td></tr><tr><td>시그모이드 미분</td><td>* h(1−h)</td><td>dZ1 = dH*H*(1−H)</td><td>4×4</td></tr><tr><td>입력 곱하기</td><td>* x</td><td>X.T @ dZ1 (→ dW1)</td><td>2×4</td></tr></tbody></table></div><ul><li>dW2 = H.T @ dZ2 (4×1) · db2 = dZ2.sum(axis=0) (1×1) · db1 = dZ1.sum(axis=0) (1×4). <b>기울기의 크기 = 그 매개변수의 크기</b>.</li><li>출력 오차가 (P−Y)/n 인 이유: 시그모이드와 교차 엔트로피를 함께 미분하면 σ′ 항이 약분되어 오차만 남고, n(=4)은 손실이 4개 표본의 <b>평균</b>이기 때문.</li><li><code>train()</code>의 1 epoch = <b>① 순전파 ② 손실 기록 ③ 역전파 ④ 수정</b> (기울기를 모두 구한 뒤 한꺼번에 수정). 순전파 shape: X 4×2 @ W1 2×4 → H 4×4 → @ W2 4×1 → Z2 4×1.</li></ul></div><div class=\"n-tbl\"><table><thead><tr><th>학습률 (셀 9)</th><th>최종 손실</th><th>정확도</th><th>해석</th></tr></thead><tbody><tr><td>0.01</td><td>0.694</td><td>50%</td><td>보폭이 작아 아직 ln 2 근처에 머묾</td></tr><tr><td>1.0</td><td><b>0.0019</b></td><td><b>100%</b></td><td>적절</td></tr><tr><td>200</td><td>43.44</td><td>50%</td><td>보폭이 커서 손실이 진동</td></tr></tbody></table></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>학습 결과</b> : 손실 0.6994 → 0.0019, 학습 후 확률 (0,0) .0012 · (0,1) .9981 · (1,0) .9978 · (1,1) .0024 — 네 표본 모두 정답. 초기값(seed)을 고정하는 이유=학습률 하나만 바꾼 공정 비교. 과제: rates를 [0.1, 0.5, 2.0]으로 바꿔 결과 표·그래프 제출.</div>",
 "6": "<h4 class=\"n-sub\">이론 · 기울기 소실 · 최적화 · 규제화</h4><ul><li><b>복습</b> : 역전파 4단계 = ① 예측(순전파) ② 손실 계산 ③ 기울기 계산(연쇄 법칙) ④ 가중치 수정 w ← w − η·∂L/∂w. 학습이 막히는 세 지점과 해결책:</li></ul><div class=\"n-tbl\"><table><thead><tr><th>PART</th><th>문제</th><th>해결</th></tr></thead><tbody><tr><td>1 기울기 소실</td><td>앞쪽 층까지 학습 신호가 닿지 않는다</td><td>ReLU, 가중치 초기화 (Xavier/He)</td></tr><tr><td>2 최적화</td><td>손실이 흔들리거나 너무 느리게 준다</td><td>모멘텀, RMSprop, Adam</td></tr><tr><td>3 규제화</td><td>훈련 자료만 외우고 새 자료는 못 푼다 (과적합)</td><td>L1·L2, 드롭아웃, 조기 종료</td></tr></tbody></table></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">PART 1 · 기울기 소실 : 시그모이드의 기울기는 최대 0.25</div><p>σ′(z) = σ(z) · [1 − σ(z)] &nbsp;(최대 0.25, z=0에서)</p><ul><li>왜 0.25? σ(z)는 0~1 → 두 수 a와 (1−a)의 곱은 a=0.5에서 최대: 0.5×0.5 = <b>0.25</b>.</li><li><b>포화 구간</b> : 출력이 0이나 1에 붙으면 기울기는 거의 0 → 뉴런이 ‘확신’할수록 배우지 못함. 기울기가 작으면 수정량 η·g도 작아 <span>앞쪽(입력 쪽) 층은 거의 배우지 못한다</span> (귓속말 전달 게임).</li></ul><div class=\"n-tbl\"><table><thead><tr><th>층 수</th><th>1</th><th>2</th><th>3</th><th>5</th><th>10</th></tr></thead><tbody><tr><td>0.25ⁿ</td><td>0.25</td><td>0.0625</td><td>0.016</td><td>0.001</td><td><b>0.000001 (10⁻⁶)</b></td></tr></tbody></table></div><p>10층이면 앞쪽 층의 기울기는 최댓값으로 계산해도 약 <span>100만 분의 1</span>. (실제로는 가중치 크기·여러 경로의 합도 곱해지므로 해법은 활성화 함수 + 가중치 초기화 두 갈래)</p></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">해결책 ① ReLU · ② 가중치 초기화</div><ul><li><b>ReLU(z) = max(0, z)</b> : 양수 구간 <span>기울기 1</span>을 그대로 통과(시그모이드 최대 0.25 vs ReLU 1), 계산도 매우 빠름. <b>주의: 죽은 ReLU</b> — 입력이 계속 음수면 기울기 0 → 뉴런이 영영 멈춤. 보완: <b>Leaky ReLU</b>(음수 쪽에 작은 기울기).</li><li><b>초기화 목표</b> : 층을 지나도 신호의 분산이 크게 변하지 않게 (너무 작으면 사라짐, 너무 크면 폭발).</li></ul><div class=\"n-tbl\"><table><thead><tr><th>초기화</th><th>대상</th><th>분산</th></tr></thead><tbody><tr><td>Xavier</td><td>시그모이드·tanh 계열</td><td>Var(w) = 2 / (n_in + n_out)</td></tr><tr><td>He</td><td>ReLU 계열</td><td>Var(w) = 2 / n_in</td></tr></tbody></table></div></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">PART 2 · 최적화 : SGD → 모멘텀 → RMSprop → Adam</div><ul><li><b>SGD</b> : w<sub>t+1</sub> = w<sub>t</sub> − η·g<sub>t</sub>. 손실=산의 높이, 가중치=위치, 기울기 g=발밑 경사, 학습률 η=보폭, 미니배치=일부 자료만 보고 경사를 짐작 → 방향이 매번 조금씩 흔들림(전체 배치보다 계산량 작고 걸음 수 많음).</li><li>SGD가 고전하는 지형: <b>좁고 긴 골짜기</b>(가파른 벽 사이를 왔다 갔다) · <b>평지·안장점</b>(경사≈0 → 보폭≈0).</li></ul></div><div class=\"n-tbl\"><table><thead><tr><th>방법</th><th>수식 · 핵심</th><th>비유</th></tr></thead><tbody><tr><td><b>모멘텀</b></td><td>v<sub>t</sub> = β·v<sub>t−1</sub> + g<sub>t</sub>, w<sub>t+1</sub> = w<sub>t</sub> − η·v<sub>t</sub>, <b>β = 0.9</b>(이전 속도의 90% 기억). 같은 방향이면 <b>가속</b>(g=+1 반복 → v: 1.00, 1.90, 2.71, 3.44), 방향이 번갈아 바뀌면 <b>상쇄</b>(+1, −1 → v: 1.00, −0.10, 0.91, −0.18)</td><td>굴러가는 공의 관성</td></tr><tr><td><b>Adagrad</b></td><td>s<sub>t</sub> = s<sub>t−1</sub> + g<sub>t</sub>² — 과거 기울기 제곱을 계속 더함 → s가 커지기만 해 보폭이 0에 가까워져 학습이 멈출 수 있음. w ← w − η·g/√s</td><td>전부 기억하는 일기장</td></tr><tr><td><b>RMSprop</b></td><td>s<sub>t</sub> = ρ·s<sub>t−1</sub> + (1−ρ)·g<sub>t</sub>² — 최근 기울기 제곱의 이동평균(ρ≈0.9), 오래된 기억은 희미 → 보폭이 계속 살아 있음</td><td>최근 메모장</td></tr><tr><td><b>Adam</b></td><td><b>모멘텀(방향) + RMSprop(보폭)</b>: m<sub>t</sub> = β₁m<sub>t−1</sub> + (1−β₁)g<sub>t</sub>, v<sub>t</sub> = β₂v<sub>t−1</sub> + (1−β₂)g<sub>t</sub>², w ← w − η·m̂/(√v̂ + ε) (m̂, v̂ = 초반 0에서 출발한 값을 보정). 기본값 <b>η=0.001, β₁=0.9, β₂=0.999</b></td><td>가장 많이 쓰는 좋은 출발점 (모든 문제에서 최고는 아님)</td></tr></tbody></table></div><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">PART 3 · 규제화와 과적합</div><ul><li><b>과적합</b> = 기출문제 답만 외운 학생. 훈련 손실↓·검증 손실↑ 구간 = 훈련 자료의 우연한 패턴까지 맞추는 중. 그래서 자료를 <b>훈련·검증으로 나누고 검증 손실을 지켜본다</b>.</li><li><b>L1·L2 규제</b> : 전체 목표 = 원래 손실 + λ·규제 항 (λ↑ → 단순한 모델 쪽으로 강하게 끌어당김).</li></ul><div class=\"n-tbl\"><table><thead><tr><th>규제</th><th>식</th><th>효과</th></tr></thead><tbody><tr><td>L1</td><td>λ · Σ|w|</td><td>덜 중요한 가중치를 <b>정확히 0</b>으로 → 필요 없는 특징을 지움</td></tr><tr><td>L2 (weight decay)</td><td>λ · Σw²</td><td>모든 가중치를 <b>고르게 작게</b>(0은 아님) → 한 특징에 과하게 기대지 않음</td></tr></tbody></table></div><ul><li><b>드롭아웃</b> : 훈련 중 매 단계 무작위로 일부 뉴런의 출력을 0으로(예: p=0.5) → 매번 다른 ‘작은 신경망’ 학습. <span>테스트·실제 사용 때는 모든 뉴런을 켠다</span>(여러 작은 신경망의 의견을 모은 효과).</li><li><b>조기 종료</b> : 검증 손실이 나빠지기 시작하면 멈춘다. <b>patience</b>(인내심)만큼 개선이 없을 때까지 기다림.</li></ul></div><div class=\"n-tbl\"><table><thead><tr><th>에폭</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr></thead><tbody><tr><td>검증 손실</td><td>0.62</td><td>0.48</td><td>0.41</td><td><b>0.39</b></td><td>0.40</td><td>0.42</td><td>0.41</td></tr><tr><td>판단 (patience=3)</td><td>최저</td><td>최저</td><td>최저</td><td><b>최저·가중치 저장</b></td><td>개선없음 1</td><td>개선없음 2</td><td>개선없음 3 → <b>중단</b></td></tr></tbody></table></div><p>→ 마지막(7)이 아니라 <b>가장 좋았던 에폭 4의 가중치를 복원</b>해서 사용.</p><div class=\"n-star\"><span class=\"n-badge\">★★★</span><div class=\"n-sub\">증상 → 원인 → 처방 (학습 로그 진단표)</div><div class=\"n-tbl\"><table><thead><tr><th>증상 (loss 그래프·로그)</th><th>의심 원인</th><th>처방</th></tr></thead><tbody><tr><td>앞쪽 층 기울기≈0, loss가 거의 안 줄어듦</td><td><b>기울기 소실</b></td><td>ReLU 계열 + He 초기화</td></tr><tr><td>loss가 갑자기 커지거나 NaN</td><td><b>기울기 폭발</b></td><td>학습률↓, 초기화 점검</td></tr><tr><td>loss가 크게 들쭉날쭉, 느리게 감소</td><td>보폭·방향 문제</td><td>모멘텀·Adam, 학습률 조정</td></tr><tr><td>훈련 loss↓ 인데 검증 loss↑</td><td><b>과적합</b></td><td>L2·드롭아웃·조기 종료</td></tr></tbody></table></div></div><h4 class=\"n-sub\">실습 · 손으로 확인하는 깊은 신경망 학습 (7주차 · 25분)</h4><ul><li>데이터: 손글씨 숫자(digits) <b>8×8 이미지 1,797장, 0~9 열 개 클래스</b>. 훈련 <b>1,257장</b> · 검증 <b>540장</b>(70:30, stratify). 픽셀 0~16을 0~1로 정규화. 손실 = SparseCategoricalCrossentropy(from_logits=True). 아무것도 모르면 <b>손실 = ln 10 ≈ 2.30</b>, 정확도 0.10.</li><li><code>make_mlp(depth, width, act, init, p_drop, l2)</code> 인자 하나가 강의의 도구 하나. 초기화: small(±1/√n_in)·xavier(GlorotNormal)·he(HeNormal). 로그 칸: train_loss·val_loss·val_acc·grad(1층).</li><li>fit() 안에서 미니배치마다 예측→손실→기울기→수정(6주차 4단계). 1,257장 ÷ 64 = 20번 × 30에폭 = <b>600번</b> 수정. 콜백(EpochLogger)이 <code>tf.GradientTape</code>로 1층 기울기를 잰다.</li></ul><div class=\"n-tbl\"><table><thead><tr><th>실습</th><th>설정</th><th>결과</th></tr></thead><tbody><tr><td>1 기울기 소실</td><td>은닉층 10개: A=sigmoid+small, B=ReLU+He (학습 전 층별 기울기 노름)</td><td>1층÷10층 기울기: 시그모이드 <b>1.6×10⁻⁸</b> / ReLU+He <b>0.78</b>. SGD 30에폭 후 검증 정확도 <b>10.2%</b> vs <b>95.9%</b> (손실 2.30=ln10 → 열 개를 똑같이 찍음)</td></tr><tr><td>2 최적화</td><td>L = 0.05·w₁² + 2·w₂² (경사 40배 차이), 출발 (−9, 1.5) → 결승 (0,0), <b>40걸음</b>. SGD lr=0.45 / Momentum lr=0.08, β=0.9 / RMSprop lr=0.3, ρ=0.9 / Adam lr=0.3</td><td>40걸음 뒤 손실: SGD <b>0.102</b> · Momentum <b>0.050</b> · Adam <b>0.022</b> · <b>RMSprop 0.001</b> (가장 작음)</td></tr><tr><td>3 규제화</td><td>훈련 200장 + 라벨 20%(32장) 무작위 오염, 2×512 은닉층, 150에폭, Adam(1e-3)</td><td>표: 아래</td></tr></tbody></table></div><div class=\"n-tbl\"><table><thead><tr><th>규제 설정</th><th>훈련 손실</th><th>검증 손실</th><th>검증 정확도</th></tr></thead><tbody><tr><td>규제 없음</td><td>0.000</td><td>0.762</td><td>83.5%</td></tr><tr><td>L2 (λ=0.005)</td><td>0.078</td><td>0.623</td><td>81.7%</td></tr><tr><td>드롭아웃 (0.5)</td><td>0.002</td><td>0.693</td><td>82.4%</td></tr><tr><td><b>조기 종료</b> (13에폭 복원, patience=10)</td><td>0.134</td><td><b>0.489 (최저)</b></td><td><b>85.0% (최고)</b></td></tr></tbody></table></div><div class=\"n-note\"><div class=\"n-sub\">📝 LECTURE NOTE</div><b>실습 4 · 디버깅 튜터</b> : 로그 A = 훈련 손실 1.46→0.004, 검증 손실 13에폭 0.49 최저 후 0.61까지 상승 → <b>과적합</b> (p_drop=0.5 또는 patience=10) / 로그 B = 손실 2.30 정체, 1층 기울기≈3×10⁻⁹ → <b>기울기 소실</b> (act=\"relu\", init=\"he\") / 로그 C = 1에폭 손실 2.45, 3에폭부터 nan → <b>기울기 폭발(학습률 과대)</b> (lr 1.5→0.05) / 로그 D = 손실 2.19→0.42로 조금씩만 감소 → <b>보폭 문제(너무 느림)</b> (모멘텀 0.9 또는 Adam). AI 진단을 믿기 전에 ‘근거 숫자가 로그에 정말 있는가?’ 확인. 학습률↓ 처방은 로그 C엔 맞지만 로그 D엔 해롭다. 다음 주 예고: CNN.</div>"

    {t:"mc", c:1, src:"퀴즈", q:".env 가 아직 없는 1 장에서 .gitignore 를 먼저 만드는 이유는?", o:[".env 파일을 자동으로 만들어 주기 때문에","토큰이 생기기 전에 방어막을 세우려고 — 한 번 커밋되면 GitHub 이력에 남아 되돌릴 수 없다",".gitignore 가 있어야 저장소를 만들 수 있어서"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"저장소를 만들기 전에 git config 로 이름과 이메일을 설정해 두는 이유는?", o:["GitHub 로그인을 대신해 주기 때문에","커밋에는 누가 했는지가 함께 기록되기 때문에 — 안 하면 Author identity unknown 으로 막힌다","저장소 이름이 그 이름으로 만들어지기 때문에"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"메인 프로젝트 폴더 이름을 영문·숫자로 지으라고 하는 이유는?", o:["한글 폴더에서는 파이썬이 실행되지 않아서","한글 이름은 GitHub 에서 검색되지 않아서","폴더 이름이 저장소 이름으로 그대로 제안되는데, 한글은 한 글자당 하이픈 하나로 바뀌어서"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"커밋 메시지를 적지 않고 Commit 버튼을 먼저 누르면 어떻게 되는가?", o:["메시지 없이 그대로 커밋된다","커밋이 취소되고 아무 일도 일어나지 않는다","COMMIT_EDITMSG 가 열리고 소스 제어 패널이 잠긴 것처럼 보인다 — Git 이 기다리는 중이다"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"1 장에서 GitHub 저장소부터 만들어 두는 이유는?", o:["코드를 잃어버렸을 때 복구하려고","과제 제출을 GitHub 으로 받기 때문에","10 장에서 GitHub 가 내 코드를 대신 실행하려면 그 코드가 거기 있어야 하기 때문에"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"받은 watchlist.csv 를 열어 본 내용이다. 첫 줄 code,name 의 역할은?", k:"code,name\n005930,삼성전자\n000660,SK하이닉스\n005380,현대자동차", o:["첫 번째 종목","각 열의 이름(제목 줄)","파일 형식 표시"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:".gitignore 를 열면 맨 위에 아래 세 줄이 있다. 이것이 뜻하는 것은?", k:"# 비밀정보 — 절대 커밋하지 말 것. 한 번 커밋되면 GitHub 이력에 남아 되돌릴 수 없고,\n# 지금 private 이어도 나중에 public 으로 바꾸는 순간 그대로 공개된다.\n.env", o:[".env 파일을 자동으로 만들어 준다",".env 파일을 GitHub 에 올리지 않는다",".env 파일을 삭제한다"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"학기말까지의 로드맵에 있는 기능이 아닌 것은?", o:["봇이 내 폰에 말을 건다","종가가 DB 에 쌓인다","가만히 있어도 원하는 정보가 온다 (자동 실행)","핸드폰에서는 정보 확인이 불가능하다"], a:3, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"터미널에 아래 두 줄을 차례로 쳤다. 첫 줄과 둘째 줄이 각각 하는 일은?", k:"git config --global user.name\ngit config --global user.name \"hong-gildong\"", o:["첫 줄은 이름을 지우고, 둘째 줄은 이름을 넣는다","첫 줄은 지금 설정된 이름을 확인하고, 둘째 줄은 이름을 설정한다","둘 다 같은 일을 한다"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"직접 만든 .gitignore 의 앞부분이다. 이 목록 때문에 2 장에서 .env 를 만들고 나서 소스 제어 패널에서 보게 되는 것은?", k:"# 비밀정보 — 절대 커밋하지 말 것\n.env\n.env.*\n!.env.example\n*token*.txt\n*secret*", o:["Changes 목록에 .env 가 뜨지만 커밋은 되지 않는다","Changes 목록에 .env 가 아예 뜨지 않는다",".env 를 저장할 때마다 경고 창이 뜬다"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"같은 .gitignore 의 전체 내용이다. 이 파일이 GitHub 에 올라가지 못하게 막는 것이 아닌 것은?", k:".env\n.env.*\n!.env.example\n*token*.txt\n*secret*\n__pycache__/\n*.pyc\n*.docx\n*.pptx\n*.pdf\n*.jpg\n*.jpeg\n*.png", o:[".env","__pycache__/ 폴더","watchlist.csv"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"1 장에서 갖추는 개발 환경의 선후 관계를 설명한 것 중 잘못된 것은?", o:["Git 프로그램이 깔려 있어야 VS Code 소스 제어의 Publish to GitHub 가 동작한다","VS Code 를 설치해야 그 안에 확장 Python(게시자 Microsoft)을 설치할 수 있다","Git 을 설치한 직후 VS Code 가 켜져 있어도 소스 제어가 바로 Git 을 찾는다"], a:2, e:"설치한 뒤에는 VS Code를 껐다 켜야 Git을 찾는다."},
    {t:"sa", c:1, src:"퀴즈", q:"터미널에 그대로 치는 아래 한 줄로 설치되는 라이브러리는 모두 몇 개인가?", k:"pip install requests python-dotenv pandas matplotlib holidays streamlit libsql-client", a:"7개", e:"13장 동안 이 설치는 한 번뿐."},
    {t:"sa", c:1, src:"퀴즈", q:"13 장 뒤 텔레그램으로 오게 될 메시지다. 빈칸에 들어갈 것은?", k:"📈 삼성전자 ( ______ )\n    208,500원 🔺 +1.24%", a:"종목코드 005930", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"VS Code 왼쪽 탐색기에서 새 파일을 만들고 이름을 `gitignore`라고 쳤다. 무엇이 잘못됐는가?", a:"맨 앞의 점(.)이 빠졌다. 이름은 .gitignore여야 한다", e:"점이 없으면 Git이 목록으로 인식하지 않는다."},
    {t:"sa", c:1, src:"퀴즈", q:"맥에서 `git --version`을 쳤더니 버전 숫자 대신 설치 안내 창이 떴다. 어떻게 해야 하는가?", a:"안내 창에서 Xcode Command Line Tools를 설치한다 (설치 후 VS Code 재시작)", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"이 프로젝트가 지나가는 다섯 칸을 순서대로 나열하시오.\n㉠ 시각화 ㉡ 수집 ㉢ 확인 ㉣ 가공 ㉤ 저장", a:"㉡ → ㉤ → ㉣ → ㉠ → ㉢", e:"수집 → 저장 → 가공 → 시각화 → 확인."},
    {t:"sa", c:1, src:"퀴즈", q:"단계와 기술을 짝지으시오.\n(1) 수집 (2) 저장 (3) 시각화 (4) 확인\n㉠ matplotlib ㉡ 네이버 금융 API ㉢ Turso DB ㉣ 텔레그램 봇 · Streamlit 대시보드", a:"(1)-㉡ (2)-㉢ (3)-㉠ (4)-㉣", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"VS Code 에서 내 GitHub 저장소를 만드는 다섯 단계를 순서대로 나열하시오.\n㉠ 아래 public 을 마우스로 클릭한다\n㉡ 소스 제어 패널을 열어 아래 Publish to GitHub 를 누른다\n㉢ VS Code 로 메인 폴더를 열고 '신뢰함'을 고른다\n㉣ 로그인 창에서 승인한다\n㉤ 저장소 이름이 영문·숫자인지 확인한다", a:"㉢ → ㉡ → ㉤ → ㉠ → ㉣", e:"폴더 열기 → Publish → 이름 확인 → public → 승인."},
    {t:"sa", c:1, src:"퀴즈", q:"실수로 Initialize Repository 를 눌렀을 때의 복구 세 단계를 순서대로 나열하시오.\n㉠ 숨김 파일을 켜고 .git 폴더만 지운다\n㉡ 폴더를 다시 연다\n㉢ VS Code 를 닫는다", a:"㉢ → ㉠ → ㉡", e:"순서를 틀리면 복구되지 않는다."},
    {t:"sa", c:1, src:"퀴즈", q:"2 장부터 매 장마다 반복하는 다섯 단계를 순서대로 나열하시오.\n㉠ 파란 Commit 버튼을 누른다\n㉡ 그 장의 zip 을 풀어 메인 폴더에 덮어쓴다\n㉢ 버튼이 Sync Changes 로 바뀌면 한 번 더 누른다\n㉣ 소스 제어 패널을 열어 바뀐 파일 목록을 확인한다\n㉤ 맨 위 입력칸에 커밋 메시지를 쓴다", a:"㉡ → ㉣ → ㉤ → ㉠ → ㉢", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"이번 장에서 Git 관련으로 하는 네 가지를 순서대로 나열하시오.\n㉠ Publish to GitHub 를 누른다\n㉡ Git 프로그램을 설치한다\n㉢ git config 로 이름과 이메일을 설정한다\n㉣ VS Code 를 껐다 켠다", a:"㉡ → ㉣ → ㉢ → ㉠", e:"설치 후 VS Code를 재시작해야 소스 제어가 Git을 찾는다."},
    {t:"sa", c:1, src:"퀴즈", q:"버튼과 하는 일을 짝지으시오.\n(1) Initialize Repository (2) Publish to GitHub (3) Commit (4) Sync Changes\n㉠ '여기까지 됐다'고 내 컴퓨터에 도장을 찍는다\n㉡ 내 컴퓨터 안에만 저장소를 만든다\n㉢ 커밋한 것을 GitHub 으로 올려 원격과 로컬을 맞춘다\n㉣ 저장소 생성 · 첫 커밋 · 업로드를 한 번에 한다", a:"(1)-㉡ (2)-㉣ (3)-㉠ (4)-㉢", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"증상과 원인을 짝지으시오.\n(1) Author identity unknown (2) 저장소 이름이 하이픈 범벅 (3) Publish to GitHub 버튼이 없다 (4) 로그인 창이 두 번 뜬다\n㉠ 메인 폴더 이름에 한글 ㉡ git config 미설정 ㉢ 윈도우에서는 원래 그렇다 ㉣ 신뢰를 주지 않아 제한 모드", a:"(1)-㉡ (2)-㉠ (3)-㉣ (4)-㉢", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 윈도우에서 `python --version`을 쳤더니 python 을 찾을 수 없다고 나온다. 원인과 조치는?", a:"원인 — 설치 화면의 Add python.exe to PATH 체크를 하지 않았다 / 조치 — 그 체크박스를 켜고 Python을 다시 설치한다", e:"맥에서 같은 증상이면 명령 이름이 python3이다."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] `pip install -r requirements.txt`를 쳤더니 그런 파일이 없다며 실패한다. 원인과 조치는?", a:"원인 — 1장 누적본에는 requirements.txt가 없다(2장부터) / 조치 — 라이브러리 이름을 나열해 한 번에 설치한다", e:"pip install requests python-dotenv pandas matplotlib holidays streamlit libsql-client"},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] `git --version`을 쳤더니 git 을 찾을 수 없다고 나온다. 그대로 두면 무엇이 막히고 어떻게 조치하는가?", a:"원인 — Git 미설치 → Publish to GitHub 버튼이 아예 나타나지 않는다 / 조치 — 윈도우 Git for Windows, 맥 Xcode Command Line Tools 설치 후 VS Code를 껐다 켠다", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 저장소 이름을 친 뒤 그냥 엔터를 쳤더니 private 이다. 왜 그렇고 앞으로 무엇이 달라지는가?", a:"원인 — 위 private이 기본 선택 / 조치 — 수업은 진행 가능, 12장 배포 때 권한 승인 단계가 하나 더 있다. 바꾸려면 Settings 맨 아래에서 public으로 전환", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] Publish to GitHub 를 눌렀더니 Author identity unknown / Please tell me who you are 가 뜬다. 원인과 조치는?", a:"원인 — Git에 이름·이메일을 알려주지 않았다 / 조치 — git config --global user.name \"아이디\", git config --global user.email \"이메일\"", e:"이메일은 GitHub 계정 이메일과 같게."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 소스 제어 패널에 두 버튼이 없고 Manage Workspace Trust 만 보인다. 원인과 조치는?", a:"원인 — 폴더를 열 때 신뢰를 주지 않아 제한 모드 / 조치 — Manage Workspace Trust에서 신뢰함 선택", e:"그래도 없으면 Git 미설치."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 저장소를 브라우저로 열어 봤더니 이름이 ---------- 이다. 원인과 조치는?", a:"원인 — 메인 폴더 이름이 한글 / 조치 — Settings → Repository name에서 영문으로 Rename, VS Code에서 폴더를 다시 열어 Sync 확인", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 소스 제어 패널에서 위쪽 Initialize Repository 를 눌러 버렸다. 무엇이 잘못됐고 어떻게 되돌리는가?", a:"원인 — 내 컴퓨터에만 저장소를 만들어 GitHub 작업·첫 커밋이 건너뛰어짐(윈도우는 master 브랜치 → 10장 자동 실행 안 됨) / 조치 — VS Code 닫기 → .git 폴더만 삭제 → 폴더 다시 열기", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 2 장에서 .env 를 만들었더니 Changes 목록에 .env 가 보인다. 원인과 조치는?", a:"원인 — .gitignore가 없거나 이름·내용이 잘못됨 / 조치 — 커밋 전에 .gitignore의 파일 이름과 .env 줄을 확인해 고친다", e:"한 번 커밋되면 이력에 남는다."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 맥 Finder 로 메인 폴더를 열었는데 방금 만든 .gitignore 가 안 보인다. 원인과 조치는?", a:"원인 — 맥은 점으로 시작하는 파일을 숨긴다 / 조치 — Finder에서 ⌘⇧. 을 누르거나 VS Code 탐색기에서 확인", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] Commit 을 눌렀더니 COMMIT_EDITMSG 가 열리고 패널이 먹통이다. 원인과 조치는?", a:"원인 — 메시지 없이 Commit을 눌러 Git이 기다리는 중 / 조치 — 1번 줄에 메시지 → 저장 → 탭 닫기", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] Commit 을 눌러 Changes 목록이 비었는데 GitHub 에는 반영되지 않았다. 원인과 조치는?", a:"원인 — Sync Changes를 누르지 않아 원격에 안 감 / 조치 — Sync Changes를 한 번 더 누르고 OK", e:""},

    // ═════════ 2장 퀴즈 ═════════
    {t:"ox", c:2, src:"퀴즈", q:"텔레그램 앱 설치와 계정 만들기는 2 장 대면 수업 시간에 다 같이 하므로 미리 해 둘 필요가 없다.", a:"X", e:"2장 실습 사전 과제. 대면 수업은 봇 만들기부터 시작."},
    {t:"ox", c:2, src:"퀴즈", q:"requirements.txt 에 이름을 적어 두기만 하면 그 라이브러리가 자동으로 설치된다.", a:"X", e:"적는 것과 설치는 별개."},
    {t:"ox", c:2, src:"퀴즈", q:"notify_stock_price.py 는 이번 장에 처음 생겨서 13 장까지 계속 자라는 파일이다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:".gitignore 에 적어 두면 이미 GitHub 에 올라간 .env 도 자동으로 내려온다.", a:"X", e:"이미 올라간 파일은 되돌려 주지 않는다."},
    {t:"ox", c:2, src:"퀴즈", q:".env 를 만든 뒤 소스 제어 패널의 커밋 대상 목록에 .env 가 뜨지 않는다면, .gitignore 가 제 일을 하고 있다는 뜻이다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"토큰이 한 번 커밋되면, 나중에 그 파일을 지우고 다시 커밋해도 GitHub 이력에는 값이 그대로 남는다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"토큰이 노출됐다면 봇을 지우고 새로 만들어야 하며 TELEGRAM_CHAT_ID 도 다시 알아내야 한다.", a:"X", e:"/revoke로 토큰만 바꾸면 된다. CHAT_ID는 그대로."},
    {t:"ox", c:2, src:"퀴즈", q:"봇의 표시 이름(name)은 남과 겹쳐도 되지만, username 은 겹치면 안 되고 bot 으로 끝나야 한다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"토큰은 아이디와 함께 써야 봇을 조종할 수 있으므로, 토큰만 알아서는 아무것도 할 수 없다.", a:"X", e:"아이디를 따로 묻지 않는다. 값을 아는 사람이 곧 주인."},
    {t:"ox", c:2, src:"퀴즈", q:"telebot.py 를 실행했는데 'result': [] 만 나오면 토큰이 잘못된 것이므로 봇을 다시 만들어야 한다.", a:"X", e:"받은 메시지가 0건이라는 뜻."},
    {t:"ox", c:2, src:"퀴즈", q:"telebot.py 는 CHAT_ID 를 알아낸 뒤에도 매 장마다 한 번씩 실행해야 한다.", a:"X", e:"1회용. .env에 적고 나면 다시 쓸 일 없다."},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄은 .env 에 그 이름의 키가 없으면 프로그램을 오류로 멈춘다.", k:"TELEGRAM_BOT_TOKEN = os.environ.get(\"TELEGRAM_BOT_TOKEN\")", a:"X", e:"키가 없으면 None."},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄이 만드는 주소 안에는 내 토큰이 그대로 들어간다.", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"O", e:"그래서 주소째로 공개되면 안 된다."},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄에서 getUpdates 자리는 '기능(함수) 이름'이라, 메시지를 보낼 때는 이 조각만 sendMessage 로 바뀐다.", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"아래 딕셔너리에서 chat_id 는 '누구에게' 보낼지를 정하는 값이다.", k:"data = {\"chat_id\": TELEGRAM_CHAT_ID, \"text\": text, \"parse_mode\": \"HTML\"}", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄의 timeout=15 는 '실패하면 15 번까지 다시 보낸다'는 뜻이다.", k:"response = requests.post(url, data=data, timeout=15)", a:"X", e:"15초까지만 기다린다."},
    {t:"mc", c:2, src:"퀴즈", q:"이번 장의 작업을 마친 뒤 소스 제어 패널에서 해야 하는 일은?", o:["메시지를 쓰고 Commit 을 누른 뒤, Sync Changes 로 바뀐 버튼을 한 번 더 누른다","2 장에서는 아직 올리지 않고 3 장에서 한 번에 올린다","Commit 만 누르면 GitHub 까지 올라간다"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:".env 를 만들었더니 소스 제어 패널의 커밋 대상 목록에 .env 가 떴다. 이것이 뜻하는 것은?", o:[".env 파일 이름이 잘못됐다는 뜻이다","정상이다 — 커밋해도 .gitignore 가 알아서 걸러 준다",".gitignore 가 메인 폴더에 없거나 잘못 적혀 있다 — 이대로 커밋하면 토큰이 GitHub 으로 간다"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"이번 장에 새로 생기는 파일이 아닌 것은?", o:["notify_stock_price.py","telebot.py","watchlist.csv","requirements.txt"], a:2, e:"watchlist.csv는 1장 압축파일에 이미 있었다."},
    {t:"mc", c:2, src:"퀴즈", q:"파일 이름이 telegram 이 아니라 notify_stock_price 인 이유로 옳은 것은?", o:["이번 장에서만 쓰는 임시 파일이기 때문에","텔레그램 말고 다른 메신저도 쓰기 때문에","학기 끝에는 이 파일이 주가 알림 전체를 맡기 때문에"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"10 장에서 GitHub 가 requirements.txt 를 읽어 대신 설치할 때 쓰는 명령은?", o:["pip install -r requirements.txt","python requirements.txt","pip install requests python-dotenv"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:".env 를 만드는 가장 안전한 방법은?", o:["아무 파일이나 만들고 확장자를 지운다",".env.example 을 복사해 이름만 .env 로 바꾼다","메모장으로 새 파일을 만들어 .env 로 저장한다"], a:1, e:"메모장은 .env.txt가 될 수 있다."},
    {t:"mc", c:2, src:"퀴즈", q:".gitignore 의 !.env.example 한 줄이 뜻하는 것은?", o:[".env.example 을 지워라",".env.example 만은 예외로 올려도 된다",".env.example 도 절대 올리지 마라"], a:1, e:"본보기라 비밀이 아니다."},
    {t:"mc", c:2, src:"퀴즈", q:"토큰이 노출됐을 때의 올바른 조치는?", o:["@BotFather 에서 /revoke 로 새 토큰을 발급받아 .env 에 갈아끼운다","저장소를 private 으로 바꾸고 그대로 둔다","커밋 이력을 손봐서 값을 지운다"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"슬라이드가 든 토큰 노출 경로가 아닌 것은?", o:["편집기에서 .env 를 열어 둔 채 파일을 저장하는 것","제출 스크린샷에 .env 내용이 같이 찍히는 것",".env 를 선택해 둔 채 AI 도구를 쓰는 것","화면 공유·녹화 중에 .env 편집 화면이 찍히는 것"], a:0, e:"저장하는 것 자체는 노출이 아니다."},
    {t:"mc", c:2, src:"퀴즈", q:"봇 username 이 계속 거절될 때의 해결로 옳은 것은?", o:["bot 을 빼고 다시 시도한다","학번이나 이름을 넣어 고유하게 만든다","표시 이름을 짧게 줄인다"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"응답에서 TELEGRAM_CHAT_ID 를 찾아가는 경로로 옳은 것은?", o:["result → message → chat → id","ok → chat → id","result → message → from → id"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"telebot.py 를 실행하기 전에 반드시 해야 하는 일은?", o:[".gitignore 에 telebot.py 를 추가한다","requirements.txt 로 라이브러리를 다시 설치한다","텔레그램에서 내 봇에게 아무 메시지나 하나 보낸다"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"실행화면에 <Response [200]> 과 {'ok': True, 'result': []}만 나왔을 때 해야 할 일은?", o:["토큰을 재발급받는다","봇에게 메시지를 하나 보내고 다시 실행한다","봇을 다시 만든다"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"실행화면에 <Response [401]> 만 떴다. 이 숫자가 알려 주는 것은?", o:["토큰을 아예 못 읽었다","토큰은 읽었는데 값이 틀렸다","받은 메시지가 없다"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"실행화면에 <Response [404]> 만 떴을 때 가장 먼저 볼 곳은?", o:[".env 파일 이름·위치와 키 이름을 확인한다","BotFather 에서 토큰을 다시 복사한다","인터넷 연결을 확인한다"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 빈칸에 들어갈 기능 이름은? (메시지를 보내려는 코드다)", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/______\"", o:["sendMessage","newbot","getUpdates"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 빈칸에 들어갈 것은?", k:"response = requests.______(url, data=data, timeout=15)", o:["send","get","post"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 줄이 돌려주는 값의 종류는?", k:"return response.status_code == 200", o:["상태 코드 숫자(200, 401 …)","True 또는 False","응답 원문 문자열"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 호출부에서 ‘텔레그램으로 메시지를 전송했습니다!’가 찍히는 조건은?", k:"if send_telegram_message(\"안녕하세요! 제 봇이 보낸 첫 메시지입니다\"):\n    print(\"✅ 텔레그램으로 메시지를 전송했습니다!\")\nelse:\n    print(\"❌ 메시지 전송에 실패했습니다. 토큰과 CHAT_ID를 다시 확인해 주세요.\")", o:["폰에 알림이 도착했을 때","send_telegram_message 함수가 True 를 돌려줬을 때(= 텔레그램이 200 을 돌려줬을 때)","인터넷이 연결돼 있을 때"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 except 블록이 하는 일로 옳은 것은?", k:"except Exception as e:\n    print(f\"❌ 텔레그램 메시지 전송 중 오류 발생: {e}\")\n    return False", o:["프로그램을 즉시 종료한다","오류를 무시하고 True 를 돌려준다","이유를 화면에 찍고 False 를 돌려준다"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"폰에 알림이 안 왔을 때 가장 먼저 볼 곳은?", o:["@BotFather 대화창","텔레그램 앱","코드를 실행한 터미널"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"윈도우에서 UnicodeEncodeError 가 났다. 무엇이 원인인가?", o:["토큰이 틀렸다","코드에 오타가 있다","터미널이 이모지를 표현하지 못하는 인코딩 문제다"], a:2, e:""},
    {t:"sa", c:2, src:"퀴즈", q:".env 에 적어야 하는 키 이름 두 개를 대소문자까지 정확히 쓰시오.", a:"TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID", e:""},
    {t:"sa", c:2, src:"퀴즈", q:".gitignore 에 이미 적혀 있는, 비밀정보를 막는 세 줄을 쓰시오.", a:".env\n.env.*\n!.env.example", e:"!는 예외."},
    {t:"sa", c:2, src:"퀴즈", q:"TELEGRAM_BOT_TOKEN 이 123456789:AAH 라고 할 때, 아래 줄이 실제로 만드는 주소를 쓰시오.", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"https://api.telegram.org/bot123456789:AAH/getUpdates", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"아래 주소를 '메시지를 보내는' 주소로 바꾸려면 어느 부분을 무엇으로 바꿔야 하는가?", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"마지막 getUpdates를 sendMessage로", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"아래 출력에서 .env 에 TELEGRAM_CHAT_ID 로 적어야 할 숫자와 그 경로를 쓰시오.", k:"{'ok': True, 'result': [{'update_id': 870512345, 'message':\n  {'message_id': 12, 'from': {'id': 987654321, 'is_bot': False, 'first_name': '길동'},\n   'chat': {'id': 123456789, 'first_name': '길동', 'type': 'private'},\n   'date': 1757030400, 'text': '안녕'}}]}", a:"123456789 / result → message → chat → id", e:"from의 id가 아니다."},
    {t:"sa", c:2, src:"퀴즈", q:"`load_dotenv()` 한 줄이 하는 일을 말로 쓰시오.", a:"같은 폴더의 .env 파일 내용을 환경 변수로 불러온다", e:"그다음 os.environ.get()으로 값을 꺼낸다."},
    {t:"sa", c:2, src:"퀴즈", q:"아래 한 줄이 하는 일과, .env 에 그 키가 없을 때 들어가는 값을 쓰시오.", k:"TELEGRAM_BOT_TOKEN = os.environ.get(\"TELEGRAM_BOT_TOKEN\")", a:"환경 변수에서 TELEGRAM_BOT_TOKEN 값을 꺼내 변수에 저장한다 / 없으면 None", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"`return response.status_code == 200`이 무엇을 돌려주는지 쓰시오.", a:"상태 코드가 200이면 True, 아니면 False", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"`requests.post(url, data=data, timeout=15)`의 timeout=15 뜻과 이 줄을 try 안에 넣은 이유를 쓰시오.", a:"15초까지만 기다린다 / 인터넷이 끊기거나 응답이 늦으면 예외가 나서 프로그램이 멈추므로, except로 받아 False를 돌려주려고", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"telebot.py 를 실행했더니 {'ok': True, 'result': []}만 나왔다. 목록을 채우려면 무엇을 해야 하는지 한 문장으로 쓰시오.", a:"텔레그램에서 내 봇에게 아무 메시지나 보낸 뒤 다시 실행한다", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"아래 두 줄 중 값이 제대로 읽히지 않는 것을 고르고 그 이유를 쓰시오.", k:"TELEGRAM_BOT_TOKEN=123456:ABCdef\nTELEGRAM_BOT_TOKEN=“123456:ABCdef”", a:"둘째 줄 — 둥근 따옴표(“ ”)가 벗겨지지 않고 값 안에 그대로 들어간다", e:".env는 따옴표 없이 값만, VS Code로 편집."},
    {t:"sa", c:2, src:"퀴즈", q:".env 가 아니라 .env.txt 로 저장돼 있는지 확인하려면 윈도우와 맥에서 각각 무엇을 켜야 하는가?", a:"윈도우: 탐색기 보기 → 파일 확장명 / 맥: Finder 설정 → 고급 → 모든 파일 확장자 보기", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"notify_stock_price.py 를 실행하는 명령을 맥과 윈도우 각각 쓰시오.", a:"맥: python3 ./notify_stock_price.py / 윈도우: python ./notify_stock_price.py", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"토큰이 노출됐을 때의 조치를 순서대로 쓰시오.", a:"@BotFather → /revoke → 해당 봇 선택 → 새 토큰 발급 → .env에 갈아끼우기", e:"봇 재생성 불필요, CHAT_ID 그대로."},
    {t:"sa", c:2, src:"퀴즈", q:"봇 username 을 지을 때 지켜야 할 조건 두 가지와 예를 하나 쓰시오.", a:"① 남과 겹치면 안 된다(전 세계 유일) ② bot으로 끝나야 한다 / 예: stock_2026001_bot", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"오늘 진행하는 단계를 ⓪부터 ④까지 순서대로 쓰시오.", a:"⓪ 텔레그램 가입 ① 비밀정보 옮기기(.env) ② 봇 만들기 ③ CHAT_ID 알아내기 ④ 메시지 보내기", e:"②③을 건너뛰면 ④가 안 된다."},
    {t:"sa", c:2, src:"퀴즈", q:"아래 두 화면의 차이를 한 문장으로 쓰고, ①에서 ②로 넘어가는 방법을 쓰시오.\n① {'ok': True, 'result': []}\n② {'ok': True, 'result': [{'update_id': 870512345, 'message': …}]}", a:"차이: result 목록이 비었는지(받은 메시지가 있는지) / 방법: 봇에게 메시지 한 통 보내기", e:"코드·토큰·봇은 그대로."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 실행 결과가 <Response [200]> / {'ok': True, 'result': []} 이다. 오류인지 판단하고 원인과 조치를 쓰시오.", a:"오류가 아니다. 원인 — 봇에게 먼저 메시지를 보내지 않아 받은 메시지 0건 / 조치 — 봇에게 아무 말이나 보낸 뒤 다시 실행", e:"봇 재생성·토큰 재발급 금지."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 빈 배열이 나와서 봇을 새로 만들고 토큰도 새로 받았는데 여전히 'result': [] 다. 무엇이 잘못됐는가?", a:"원인 — 빠진 것은 토큰이 아니라 ‘봇에게 말을 거는 단계’ / 조치 — 새 봇 대화방에서 /start 후 아무 말이나 보내고 다시 실행", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 실행 시 <Response [404]> 한 줄만 뜬다. 원인과 조치는?", a:"원인 — 토큰을 아예 못 읽음 / 조치 — .env 이름(.env.txt 아닌지)·위치·키 이름 확인", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 실행 시 <Response [401]> 한 줄만 뜬다. 원인과 조치는?", a:"원인 — .env는 읽었으나 토큰 값이 틀림 / 조치 — @BotFather에서 토큰을 다시 확인해 붙여넣기(둥근 따옴표 의심)", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 404 와 401 을 둘 다 겪은 학생이 \"어차피 토큰 문제니 똑같지 않냐\"고 묻는다. 차이와 고칠 곳을 쓰시오.", a:"404 — .env를 못 읽음(파일 이름·위치·키 이름) / 401 — 토큰 값이 틀림(토큰 값)", e:"404인데 토큰만 다시 붙여넣으면 영원히 안 고쳐진다."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] print(TELEGRAM_BOT_TOKEN)을 넣어 보니 None 이 찍힌다. 가장 흔한 원인과 조치는?", a:"원인 — 파일이 .env.txt로 저장됨 / 조치 — 확장자를 보이게 켜고 .env로 이름 변경", e:".env.example을 복사하는 것이 가장 안전."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 파일 이름·위치·키 이름이 다 맞는데 계속 None 이다. 실행 방법에서 의심할 것과 조치는?", a:"원인 — Code Runner로 실행해 다른 위치 기준으로 .env를 못 찾음 / 조치 — 터미널에서 python 파일이름.py로 직접 실행", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 토큰을 제대로 붙여넣었는데 계속 인증 실패. .env 가 `TELEGRAM_BOT_TOKEN=“123456789:AAHdEfGh”` 이다. 원인과 조치는?", a:"원인 — 둥근 따옴표가 값 안에 들어감 / 조치 — 따옴표를 지우고 값만, VS Code로 편집", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] @BotFather 에서 username 이 계속 이미 사용 중이라고 거절된다. 원인과 조치는?", a:"원인 — username은 전 세계 유일 + bot으로 끝나야 함, 흔한 이름은 이미 사용 중 / 조치 — 학번·이름을 넣어 고유하게", e:"표시 이름은 바꿀 필요 없음."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 윈도우에서 실행했더니 UnicodeEncodeError 가 나며 멈춘다. 원인과 조치는?", a:"원인 — 터미널이 이모지를 표현 못 하는 인코딩 문제 / 조치 — PowerShell: $env:PYTHONIOENCODING=\"utf-8\"; python notify_stock_price.py", e:"cmd는 set PYTHONIOENCODING=utf-8. 맥에서는 안 생긴다."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 터미널에 ‘❌ 메시지 전송에 실패했습니다. 토큰과 CHAT_ID 를 다시 확인해 주세요.’가 찍혔다. 어디부터 확인하는가?", a:"원인 — send_telegram_message()가 False(200이 아니거나 예외) / 조치 — .env의 토큰과 CHAT_ID 확인", e:"원인을 찾는 곳은 터미널."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] .env 를 실수로 GitHub 에 올렸다. 파일을 지우고 다시 커밋했더니 목록에서 사라졌다. 해결됐는가?", a:"해결되지 않았다. 원인 — 이전 커밋 이력에 토큰이 남음 / 조치 — @BotFather → /revoke로 새 토큰을 받아 .env에 갈아끼우기", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] .env 를 만들고 소스 제어를 열었더니 Changes 목록에 .env 가 보인다. 커밋해도 되는가?", a:"안 된다. 원인 — .gitignore가 없거나 잘못됨 / 조치 — 커밋 전에 .gitignore 확인·수정. 이미 커밋했다면 /revoke로 토큰 교체", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] Commit 까지 눌렀는데 GitHub 저장소 화면에 이번 장 커밋이 안 보인다. 원인과 조치는?", a:"원인 — Sync Changes를 안 눌러 원격에 안 감 / 조치 — Sync Changes를 누르고 OK 후 새로 고쳐 확인", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 를 여러 번 실행했지만 CHAT_ID 를 못 찾았다. 실행 순서를 처음부터 쓰시오.", a:"① 텔레그램 앱에서 내 봇 대화방 열기 ② [시작] 또는 /start ③ 아무 글자나 한 번 더 보내기 ④ python ./telebot.py 실행(맥 python3) ⑤ chat의 id를 .env에 TELEGRAM_CHAT_ID로", e:"순서가 반대면 실패."},

    {t:"sa", c:3, src:"퀴즈", q:"삼성전자를 조회할 때 실제로 완성되는 API 주소를 쓰시오.", k:"url = f\"https://m.stock.naver.com/api/stock/{code}/basic\"", a:"https://m.stock.naver.com/api/stock/005930/basic", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"응답에서 우리가 쓰는 필드 이름 다섯 개를 대소문자까지 정확히 쓰고 용도를 쓰시오.", a:"stockName 종목 이름(첫 줄) · closePrice 현재가/종가 · fluctuationsRatio 등락률 · marketStatus 장 열림 여부(is_open) · localTradedAt 체결 시각(traded_at)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"closePrice 하나가 두 가지 값을 돌려준다. 장중일 때와 장마감 후일 때 각각 무엇인가?", a:"장중: 현재가 / 장마감 후: 그날 종가", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"marketStatus 가 어떤 값일 때 '장이 열려 있다'로 판단하는지, 그 결과가 담기는 키 이름을 쓰시오.", k:"\"is_open\": data.get(\"marketStatus\") == \"OPEN\",", a:"\"OPEN\"일 때 / is_open", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`data = response.json()`이 하는 일과, 이 줄을 거친 뒤 data 를 어떻게 다룰 수 있는지 쓰시오.", a:"JSON 문자열을 파이썬 딕셔너리로 바꾼다 / data[\"stockName\"]처럼 키로 값을 꺼낼 수 있다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"텔레그램은 건드리지 않고 콘솔에만 찍어 보는 4 줄을 순서대로 쓰시오.", a:"url = \"https://m.stock.naver.com/api/stock/005930/basic\"\nresponse = requests.get(url)\ndata = response.json()\nprint(data)", e:"맨 위 import requests."},
    {t:"sa", c:3, src:"퀴즈", q:"`print(data[\"closePrice\"] * 2)`가 찍는 것을 쓰고, 오류가 나는지도 쓰시오.", a:"223,000223,000 / 오류는 나지 않는다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"아래 세 줄 실행 시 price_str · price · 마지막 print 값은?", k:"price_str = data[\"closePrice\"].replace(\",\", \"\")\nprice = int(price_str)\nprint(price * 2)", a:"price_str = \"223000\", price = 223000, 출력 446000", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`prefix = f\"{223000:,}원\"`이 만드는 문자열과 콤마가 하는 일을 쓰시오.", a:"\"223,000원\" / 천 단위 구분 콤마를 다시 붙인다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`format_rate_badge(70000, -0.5)`가 돌려주는 문자열을 이모지까지 쓰시오.", a:"70,000원 ▼ -0.5%", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"retries 가 2 일 때 `for attempt in range(1, retries + 1):`이 몇 번 돌고, attempt 값은?", a:"2번 / 1, 2", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`price = int(price_str) if price_str.isdigit() else 0`에서 isdigit()이 False 이면 price 값과, 결국 함수가 돌려주는 값은?", a:"price = 0 → price <= 0이라 실패 처리 → 최종 None", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"fetch_naver_current_price() 성공 시 dict 키 여섯 개를 쓰고, 이번 장에서 쓰는 세 개를 고르시오.", a:"code, name, price, rate, is_open, traded_at / name, price, rate", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"notify_stock_price.py 를 실행하는 명령을 맥과 윈도우 각각 쓰시오.", a:"맥: python3 ./notify_stock_price.py / 윈도우: python ./notify_stock_price.py", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] ‘❌ [005930] 네이버 현재가 조회 실패 (응답 코드: 500, 1/2번째 시도)’가 두 번 찍히고 ‘현재가를 가져오지 못했습니다’로 끝난다. 원인과 조치는?", a:"원인 — 비공식 API라 일시적으로 막힘. 2회 재시도 모두 실패해 None / 조치 — 잠시 후 다시 실행", e:"내 코드 문제가 아니다."},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 응답은 200인데 ‘❌ [005930] 가격을 숫자로 읽지 못했습니다 (closePrice: '', 2/2번째 시도)’가 찍힌다. 원인과 조치는?", a:"원인 — closePrice가 숫자 문자열이 아니라 isdigit() False → price 0 → 실패 / 조치 — 잠시 후 다시 실행(0원을 막아 준 정상 동작)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 윈도우에서 `UnicodeEncodeError: 'cp949' codec can't encode character '\\u274c'`. 원인과 조치는?", a:"원인 — 터미널이 이모지를 표현 못 함 / 조치 — $env:PYTHONIOENCODING=\"utf-8\"; python notify_stock_price.py", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 맥에서 `zsh: command not found: python`. 원인과 조치는?", a:"원인 — 맥은 명령 이름이 python3 / 조치 — python3 ./notify_stock_price.py (설치는 pip3)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] `print(data[\"closePrice\"] * 2)`가 오류 없이 223,000223,000 을 찍는다. 원인과 조치는?", a:"원인 — closePrice가 콤마 찍힌 문자열이라 * 2가 반복 / 조치 — replace(\",\", \"\") 후 int()로 바꿔 계산, type()으로 먼저 확인", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] `int(data[\"closePrice\"])`에서 `ValueError: invalid literal for int() with base 10: '223,000'`. 원인과 조치는?", a:"원인 — 콤마가 남아 int()가 못 읽음 / 조치 — replace(\",\", \"\")로 콤마를 먼저 지운 뒤 int()", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 텔레그램에 ‘삼성전자 (005930) / 0원 ▫️ 0.0%’가 왔다. 실패인지 정상인지와 원인·조치는?", a:"실패다. 원인 — 가격을 못 읽어 0이 된 값을 그대로 돌려보냄 / 조치 — price <= 0이면 None을 돌려주고 호출부에서 if info is None으로 구분", e:"8장에서는 0원이 DB에 쌓인다."},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 콘솔에는 {'stockName': '삼성전자', 'closePrice': '223,000', ...} 가 잘 찍혔는데 폰에는 아무것도 안 온다. 원인과 조치는?", a:"원인 — API 호출은 성공, 전송(토큰·CHAT_ID) 문제 / 조치 — .env의 토큰과 CHAT_ID 확인(.env.txt·둥근 따옴표 여부)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 콘솔 확인 없이 전송 코드까지 다 붙여 실행했는데 폰에 아무것도 안 오고 어디가 문제인지 모르겠다. 원인과 조치는?", a:"원인 — 조회와 전송을 한 번에 붙여 어느 쪽 실패인지 구분 불가 / 조치 — requests.get → json → print 4줄로 ①부터 확인 후 ② 전송을 붙인다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 종목을 바꾸려는데 코드 여기저기의 005930 을 찾아다니다 하나를 빠뜨렸다. 원인과 조치는?", a:"원인 — 같은 값을 여러 군데 적음 / 조치 — 파일 맨 위 STOCK_CODE = \"005930\" 한 줄만 두고 그 이름을 쓴다", e:"6장에서는 watchlist.csv로."},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 실패 확인 없이 `telegram_message = f\"📈 {info['name']} ({STOCK_CODE})\"`를 썼더니 `TypeError: 'NoneType' object is not subscriptable`. 원인과 조치는?", a:"원인 — 조회 실패로 info가 None인데 바로 꺼냄 / 조치 — if info is None:으로 먼저 거르고 else 안에서만 조립·전송", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 저녁 8 시에 여러 번 실행했는데 ‘현재가’ 값이 계속 똑같다. 고장인가?", a:"고장이 아니다. 원인 — 장마감 후 closePrice는 그날 종가 / 조치 — 값 변화를 보려면 평일 장중에 실행(marketStatus가 OPEN인지 확인)", e:""},

    {t:"ox", c:4, src:"퀴즈", q:"try / except 는 오류가 아예 나지 않게 막아 주는 문법이다.", a:"X", e:"오류가 나도 계속 돌게 하는 문법."},

    {t:"ox", c:4, src:"퀴즈", q:"아래 for 문 첫 줄의 쉼표는 '짝으로 온 것을 나눠 받는 중'이라는 표시다.", k:"for code, info in current_prices.items():", a:"O", e:"언패킹."},
    {t:"ox", c:4, src:"퀴즈", q:"아래 두 줄에서 첫 줄만 천 단위 콤마가 붙고, 둘째 줄은 콤마 없이 그대로 찍힌다.", k:"print(f\"{price:,}원\")\nprint(f\"{price}원\")", a:"O", e:""},

    {t:"ox", c:4, src:"퀴즈", q:"아래 삼항 표현식을 읽는 순서는 가운데(조건) → 앞(참일 때) → 뒤(거짓일 때)다.", k:"price = int(price_str) if price_str.isdigit() else 0", a:"O", e:""},
    {t:"ox", c:4, src:"퀴즈", q:"아래 한 줄은 열 이름의 좌우 공백을 지우고 모두 소문자로 바꾼 새 리스트를 만들어 기존 값을 덮어쓴다.", k:"watchlist_df.columns = [c.strip().lower() for c in watchlist_df.columns]", a:"O", e:""},

    {t:"ox", c:4, src:"퀴즈", q:"슬라이싱 [시작:끝] 에서는 시작 번호와 끝 번호의 글자가 모두 포함된다.", a:"X", e:"끝은 미포함."},
    {t:"ox", c:4, src:"퀴즈", q:"아래 줄은 code 가 이미 history 에 있으면 기존 리스트를 버리고 빈 리스트로 덮어쓴다.", k:"history.setdefault(code, []).append({\"date\": date, \"close\": close})", a:"X", e:"있으면 기존 리스트를 그대로 가져온다."},

    {t:"mc", c:4, src:"퀴즈", q:"아래 한 줄의 뜻으로 옳은 것은?", k:"return price if (is_open or intraday_minutes or not daily_closes) else None", o:["조건과 상관없이 언제나 price 를 돌려준다","세 조건을 모두 만족해야 price 를 돌려준다","셋 중 하나라도 해당하면 price 를, 아니면 None 을 돌려준다"], a:2, e:""},
    {t:"mc", c:4, src:"퀴즈", q:"같은 줄에서 intraday_minutes 가 조건 자리에 그대로 쓰인 이유로 옳은 것은?", k:"return price if (is_open or intraday_minutes or not daily_closes) else None", o:["리스트가 비어 있으면 거짓, 값이 들어 있으면 참이 되기 때문","리스트의 길이가 자동으로 0 과 비교되어 True/False 로 바뀌기 때문","리스트는 원래 조건에 못 쓰지만 or 뒤에서는 예외로 허용되기 때문"], a:0, e:""},
