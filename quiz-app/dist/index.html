<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>중간고사 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 일반적인 모바일 퀴즈앱 — 상단 바, 카드 목록, 하단 고정 버튼 */
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #1c2230;
  --sub: #687083;
  --line: #e2e6ee;
  --primary: #3d6df2;
  --primary-soft: #e8eefe;
  --ok: #18a058;
  --ok-soft: #e4f6ec;
  --ng: #e5484d;
  --ng-soft: #fdeaea;
  --code: #f0f2f6;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b1f27; --text: #e9ecf2; --sub: #9aa2b2; --line: #2c3240;
    --primary: #6b8ff7; --primary-soft: #22304f; --ok: #3ccf7f; --ok-soft: #173326; --ng: #ff6b6f; --ng-soft: #3a1d20; --code: #252a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b1f27; --text: #e9ecf2; --sub: #9aa2b2; --line: #2c3240;
  --primary: #6b8ff7; --primary-soft: #22304f; --ok: #3ccf7f; --ok-soft: #173326; --ng: #ff6b6f; --ng-soft: #3a1d20; --code: #252a35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
code { font-family: var(--mono); font-size: .88em; background: var(--code); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre.code { margin: 0; background: var(--code); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 13px; line-height: 1.5; overflow-x: auto; white-space: pre; }

/* 상단 바 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); display: flex; align-items: center; gap: 8px; min-height: 56px; }
.bar h1 { font-size: 19px; font-weight: 700; flex: 1; min-width: 0; }
.bar .sub { font-size: 13px; color: var(--sub); font-weight: 400; }
.icon-btn { background: none; border: 0; min-width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--sub); font-size: 14px; padding: 0 8px; }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 22px; height: 22px; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.label { font-size: 13px; color: var(--sub); font-weight: 500; }

/* 홈: 과목 카드 */
.subj { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; }
.subj-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.subj h2 { font-size: 17px; }
.dday { font-size: 12px; color: var(--primary); font-weight: 700; background: var(--primary-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .ok { background: var(--ok); }
.meter .ng { background: var(--ng); }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }

/* 설정 */
.sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.sec-head h3 { font-size: 15px; }
.link { background: none; border: 0; color: var(--primary); font-size: 13px; padding: 4px 0; }
.chap { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.chap:first-of-type { border-top: 0; }
.chap input { width: 20px; height: 20px; accent-color: var(--primary); margin: 0; }
.chap label { min-width: 0; cursor: pointer; }
.chap .nm { font-size: 15px; display: block; }
.chap .st { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.chap .only { font-size: 13px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 10px; color: var(--primary); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--sub); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip small { opacity: .8; margin-left: 2px; }
.row { display: flex; flex-direction: column; gap: 8px; }
.row + .row { margin-top: 14px; }
.pool { font-size: 14px; color: var(--sub); margin-top: 12px; }
.pool b { color: var(--text); }
.date-in { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--card); font-size: 14px; }

/* 퀴즈 */
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--code); color: var(--sub); }
.tag.type { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.tag.star { color: #c47f00; background: color-mix(in srgb, #f5b100 18%, transparent); }
.qtext { font-size: 17px; font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; word-break: keep-all; margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 15px; overflow-wrap: anywhere; word-break: keep-all; }
.opt .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--code); display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; }
.opt:not(:disabled):hover { border-color: var(--primary); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .n { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
.opt.wrong .n { background: var(--ng); color: #fff; }
.opt:disabled { cursor: default; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.ox button { height: 84px; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; font-size: 36px; font-weight: 700; }
.ox button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.ox button.wrong { border-color: var(--ng); background: var(--ng-soft); color: var(--ng); }
.feedback { margin-top: 14px; border-radius: 12px; padding: 14px; background: var(--code); display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.ng { background: var(--ng-soft); }
.feedback .v { font-weight: 700; }
.feedback.ok .v { color: var(--ok); }
.feedback.ng .v { color: var(--ng); }
.feedback .ans { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
.feedback .ex { font-size: 14px; color: var(--sub); white-space: pre-line; overflow-wrap: anywhere; }
.myans { display: block; width: 100%; min-height: 96px; margin-top: 14px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--card); font-size: 15px; line-height: 1.5; resize: vertical; }
.myans:focus { border-color: var(--primary); outline: none; }
.feedback .mine { font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.feedback .mine b { color: var(--sub); font-weight: 600; margin-right: 6px; }
.feedback .same { font-size: 13px; color: var(--ok); font-weight: 600; }
.hint { font-size: 13px; color: var(--sub); margin-top: 12px; text-align: center; }

/* 결과 */
.score { text-align: center; padding: 24px 16px; }
.score b { display: block; font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rlist { display: flex; flex-direction: column; gap: 8px; }
.ritem { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.ritem .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: var(--ok); margin-top: 1px; }
.ritem.ng .mk { background: var(--ng); }
.ritem p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ritem small { display: block; color: var(--sub); white-space: pre-wrap; }

/* 홈 카드 버튼 */
.subj-btns { display: flex; gap: 8px; margin-top: 4px; }
.subj-btns .btn { height: 44px; font-size: 15px; }

/* 과목 탭 */
.tabs { display: flex; background: var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 9px; height: 40px; font-size: 15px; font-weight: 500; color: var(--sub); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.jump { margin-bottom: 12px; }
.note { scroll-margin-top: calc(64px + env(safe-area-inset-top, 0px)); }
.note .link { margin-top: 10px; }

/* 오답노트 */
.tag.miss { background: var(--ng-soft); color: var(--ng); font-weight: 700; }
.wnote .qtext { margin-bottom: 10px; }
.wopts { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--sub); }
.wopts li { overflow-wrap: anywhere; }
.wopts li.right { color: var(--ok); font-weight: 700; }
.wans { margin-top: 12px; }
.wans summary { cursor: pointer; color: var(--primary); font-size: 14px; font-weight: 500; }
.wans .feedback { margin-top: 8px; }
.wbtns { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.wbtns .done { color: var(--sub); }
.empty { text-align: center; color: var(--sub); }
.empty b { color: var(--text); display: block; margin-bottom: 4px; }
.empty p { margin: 0; font-size: 14px; }

/* 상세 요약 (요약정리 HTML에서 가져온 장별 내용) */
.nquick { background: var(--primary-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
.nquick summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: 14px; }
.nquick ul { margin-top: 8px; }
.ndoc { font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 8px; }
.ndoc h4 { font-size: 15.5px; margin: 10px 0 0; padding-left: 8px; border-left: 4px solid var(--primary); }
.ndoc h5 { font-size: 15px; margin: 6px 0 0; color: var(--primary); }
.ndoc p { margin: 0; }
.ndoc ul, .ndoc ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.ndoc pre { margin: 0; background: var(--code); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; overflow-x: auto; white-space: pre; }
.ndoc code { white-space: pre-wrap; }
.ndoc pre code { background: none; padding: 0; white-space: pre; }
/* flex 자식은 기본 min-width:auto라 넓은 표가 화면 밖으로 밀어내므로 0으로 풀어 준다 */
.stack > *, .ndoc, .ndoc > *, .n-star > *, .n-note > *, .n-box > * { min-width: 0; max-width: 100%; }
.n-tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 8px; }
.n-tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.n-tbl th, .n-tbl td { border-bottom: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; overflow-wrap: normal; word-break: keep-all; min-width: 3.2em; }
.n-tbl th { background: var(--code); font-weight: 700; white-space: nowrap; }
.n-tbl tr:last-child td { border-bottom: 0; }
.n-star { border: 1.5px solid color-mix(in srgb, #f5b100 70%, transparent); background: color-mix(in srgb, #f5b100 9%, var(--card)); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.n-note { border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.n-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.n-sub { font-weight: 700; }
.n-badge { align-self: flex-start; font-size: 11.5px; font-weight: 700; color: #b37400; background: color-mix(in srgb, #f5b100 22%, transparent); border-radius: 999px; padding: 1px 8px; }
.n-hl { background: linear-gradient(transparent 55%, color-mix(in srgb, #f5d000 45%, transparent) 55%); font-weight: 500; }
.n-red { color: var(--ng); font-weight: 700; }
.n-formula { text-align: center; font-weight: 700; font-size: 16px; background: var(--code); border-radius: 8px; padding: 8px; }

/* 노트 */
.note h3 { font-size: 16px; margin-bottom: 8px; }
.note ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.note li { overflow-wrap: anywhere; }

/* 하단 고정 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock-in { max-width: 600px; margin: 0 auto; display: flex; gap: 8px; }
.btn { flex: 1; height: 52px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.light { background: var(--card); color: var(--text); border: 1px solid var(--line); }
.btn.ok { background: var(--ok); }
.btn.ng { background: var(--ng); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
.foot { font-size: 12px; color: var(--sub); text-align: center; margin-top: 16px; }
</style>

<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
window.BANK = [];
</script>
<script>
// 컴퓨터구조 문제은행
// 출처: 컴퓨터구조.pdf, 컴퓨터구조_시험_요약정리.html (2024·2025 기출 반영)
// 형식: t=유형(ox|mc|sa|bl), c=장, q=문제, k=코드블록, o=보기, a=정답, e=해설, s=1이면 빈출
BANK.push({
  id: "ca",
  name: "컴퓨터구조",
  short: "컴구조",
  line: "2",
  chapters: {
    1: "어셈블리 언어·피연산자",
    2: "기계어",
    3: "논리·시프트·상수",
    4: "분기와 제어문",
    5: "배열과 ASCII",
    6: "프로시저와 스택",
    7: "프로그램 실행·메모리 맵",
    8: "마이크로아키텍처·성능",
    9: "단일 사이클 데이터패스"
  },
  notes: {
    1: [
      "아키텍처 = 프로그래머 관점(명령어 집합 + 피연산자 위치). 마이크로아키텍처 = 그걸 하드웨어로 <b>어떻게 구현</b>할지",
      "피연산자 출처 3가지: 레지스터 / 메모리 / 상수(즉치)",
      "MIPS: 32비트 레지스터 32개 → 32비트 아키텍처. $0은 항상 0",
      "$v0–$v1 반환값 · $a0–$a3 인자 · $t 임시 · $s 저장 · $sp 29 · $ra 31",
      "lw = 메모리 → 레지스터, sw = 레지스터 → 메모리. 주소 = base + offset",
      "바이트 주소 지정: 워드 n의 주소 = n × 4 (워드 10 → 40 = 0x28)",
      "리틀엔디안: LSB 쪽부터 바이트 번호 / 빅엔디안: MSB 쪽부터",
      "즉치는 16비트 2의 보수 → subi 없음, addi에 음수",
      "syscall: $v0=1 정수 출력($a0) · 4 문자열 출력 · 5 정수 입력 · 8 문자열 입력 · 9 sbrk · 10 종료"
    ],
    2: [
      "명령어는 모두 32비트. 형식 3가지: R / I / J",
      "R: op(6) rs(5) rt(5) rd(5) shamt(5) funct(6)",
      "I: op(6) rs(5) rt(5) imm(16) · J: op(6) addr(26)",
      "어셈블리 순서: add rd, rs, rt / addi rt, rs, imm / lw rt, imm(rs)",
      "opcode: R-type 0 (add funct 32, sub funct 34) · addi 8 · lw 35 · sw 43",
      "해석 순서: opcode 먼저 → 0이면 funct로 판별",
      "저장 프로그램: 명령어·데이터 모두 메모리. PC가 현재 명령어 추적. 시작 0x00400000, +4씩"
    ],
    3: [
      "and = 마스킹, or = 결합, nor = 반전 (A NOR $0 = NOT A)",
      "andi·ori·xori 즉치는 <b>0 확장</b> (부호 확장 아님)",
      "sll·srl·sra는 R-type. 왼쪽 n칸 = ×2ⁿ",
      "32비트 상수 = lui(상위 16비트, 하위 0) + ori(하위 16비트)",
      "mult: 64비트 결과 → hi(상위)·lo(하위) · div: 몫 lo, 나머지 hi"
    ],
    4: [
      "조건 분기 beq·bne / 무조건 j·jr·jal",
      "어셈블리는 고급 언어 조건의 <b>반대</b>를 검사 (if i==j → bne)",
      "slt $t1,$s0,$t0 → $s0 < $t0 이면 1",
      "분기 주소 = (PC + 4) + offset × 4",
      "레이블은 콜론(:)으로 끝남, 예약어 불가"
    ],
    5: [
      "array[i] 주소 = base + 4 × i → sll $t0,$s1,2로 i×4",
      "base 0x12348000이면 array[3] = 0x1234800C",
      "ASCII: 대·소문자 차이 0x20(32). A = 0x41, a = 0x61"
    ],
    6: [
      "호출 jal, 복귀 jr $ra, 인자 $a0–$a3, 반환 $v0",
      "jal = PC+4를 $ra에 저장 후 점프 (0x00400200 jal → $ra 0x00400204)",

  {"t":"ox","q":"Microarchitecture는 명령어 집합과 같이 프로그래머에게 제공되는 인터페이스를 정의한 것이고, Architecture는 이를 하드웨어로 구현하는 방법이다.","a":"X","e":"정반대이다. Architecture = 명령어 집합(프로그래머 관점), Microarchitecture = 그것을 하드웨어로 어떻게 구현할지.","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":8},
  {"t":"mc","q":"함수 수행을 마치고 결과 값을 전달할 때 사용하도록 제시된 레지스터는?","o":["$at","$v0","$a0","$t0"],"a":1,"e":"반환값은 $v0–$v1, 인자는 $a0–$a3.","s":1,"org":"기출 · 2024 중간·2025 중간 (단답)","src":"요약정리","c":6},
  {"t":"mc","q":"다음 메모리 중 접근 속도가 가장 느린 메모리는?","o":["캐쉬 메모리","레지스터 메모리","메인 메모리","하드 디스크"],"a":3,"e":"레지스터 > 캐시 > 메인 메모리 > 하드 디스크 순으로 빠르다.","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":1},
  {"t":"mc","q":"메모리 접근 명령어 lw $s3, 4($0)는 어떤 동작을 하는가?","o":["$s3에 값 4를 저장한다","메모리 주소 4에서 워드를 읽어와 $s3에 저장한다","$s3의 값을 메모리 주소 4에 저장한다","$s3에서 4를 더한다"],"a":1,"e":"lw는 메모리 → 레지스터. 주소 = $0 + 4 = 4번지의 워드를 $s3에 저장.","org":"기출 · 2025 기말 (퀴즈 출제)","src":"요약정리","c":1},
  {"t":"mc","q":"빅엔디안과 리틀엔디안의 차이로 옳은 설명은?","o":["메모리 크기의 차이","명령어 길이의 차이","워드 내 바이트 저장 순서의 차이","CPU 클럭 속도의 차이"],"a":2,"e":"워드 안에서 바이트를 어느 쪽(MSB/LSB)부터 번호 매기느냐의 차이이다.","org":"기출 · 2025 기말 (퀴즈 출제)","src":"요약정리","c":1},
  {"t":"mc","q":"MIPS에서 정수를 출력하는 system call의 번호와 사용되는 레지스터는?","o":["번호 1, $a0에 출력할 정수를 저장","번호 4, $a0에 출력할 정수를 저장","번호 5, $v0에 출력할 정수를 저장","번호 9, $a0에 출력할 정수를 저장"],"a":0,"e":"print integer = 서비스 번호 1(→$v0), 출력할 정수는 $a0. (4 = print string, 5 = read integer, 9 = sbrk)","org":"기출 · 2025 기말 (퀴즈 출제)","src":"요약정리","c":1},
  {"t":"mc","q":"MIPS의 R-Type 명령어 형식에서 funct 필드는 무엇을 나타내는가?","o":["명령어의 주소","명령의 구체적인 기능","상수 값","분기 대상"],"a":1,"e":"R-type은 op=0이므로 funct가 구체적인 기능(add=32, sub=34 등)을 결정한다.","org":"기출 · 2025 기말 (퀴즈 출제)","src":"요약정리","c":2},
  {"t":"mc","q":"I-Type 명령어에서 immediate의 크기는?","o":["8비트","12비트","16비트","32비트"],"a":2,"e":"I-type: op(6) rs(5) rt(5) imm(16).","org":"기출 · 2025 기말 (퀴즈 출제)","src":"요약정리","c":2},
  {"t":"mc","q":"메모리 주소 공간에서 스택(Stack)의 확장 방향으로 옳은 것은?","o":["메모리 주소가 증가하는 방향으로 확장","메모리 주소가 감소하는 방향으로 확장","랜덤 접근","고정 크기"],"a":1,"e":"스택은 높은 주소에서 낮은 주소로 성장한다(주소 감소 방향).","org":"기출 · 2025 기말 (퀴즈 출제)","src":"요약정리","c":6},
  {"t":"mc","q":"6비트로 “-7”을 2의 보수로 표현한 올바른 이진수는?","o":["110111","111000","111001","000111"],"a":2,"e":"7 = 000111 → 비트 반전 111000 → +1 = 111001. (참고: -1은 111111)","s":1,"org":"기출 · 2024 중간 (2025 중간은 -1)","src":"요약정리","c":3},
  {"t":"mc","q":"“add $9, $8, $7”의 기계어 코드는? (add: op=0, funct=32)","o":["0x01074822","0x8D074820","0x01E94020","0x01074820"],"a":3,"e":"R-type: op 000000, rs=8 (01000), rt=7 (00111), rd=9 (01001), shamt 00000, funct 100000 → 0000 0001 0000 0111 0100 1000 0010 0000 = 0x01074820. (add rd, rs, rt 순서 주의)","s":1,"org":"기출 · 2024 중간 (2025 중간도 같은 유형)","src":"요약정리","c":2},
  {"t":"sa","q":"수행할 명령어의 메모리 주소를 지속적으로 tracking 하는 레지스터는 무엇인가?","a":"PC (Program Counter, 프로그램 카운터)","e":"기출 4회 모두 출제(2024 중·기말, 2025 중·기말). 가장 확실한 빈출 문제.","s":1,"org":"기출 · 2024 중간·기말, 2025 중간·기말","src":"요약정리","c":2},
  {"t":"sa","q":"Architecture와 Microarchitecture의 차이를 간략히 설명하시오.","a":"Architecture: 명령어 집합(프로그래머 관점의 인터페이스·추상적 사양) / Microarchitecture: 그 명령어 집합을 하드웨어로 ‘어떻게 구현’할 것인가","e":"핵심어: Architecture = “명령어 집합”, Microarchitecture = “어떻게 구현”.","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":8},
  {"t":"sa","q":"R-type 명령어를 이루는 필드를 순서대로 쓰고 각 필드의 비트 수를 쓰시오. (예: “funct:6, shamt:5, …”)","a":"op:6, rs:5, rt:5, rd:5, shamt:5, funct:6","e":"합계 6+5+5+5+5+6 = 32비트.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":2},
  {"t":"sa","q":"“int a = 0xFEDC8765;”처럼 32비트 상수 값을 레지스터에 넣기 위해 사용하는 두 명령어는?","a":"lui, ori","e":"lui $s0,0xFEDC → 상위 16비트, ori $s0,$s0,0x8765 → 하위 16비트.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":3},
  {"t":"sa","q":"Logisim에서 (가) 두 입력 중 하나를 선택 신호로 골라 출력에 연결하는 모듈, (나) 명령어 메모리에서 나온 32비트 명령어를 세부 필드로 쪼개는 모듈의 이름은?","a":"(가) Multiplexer (먹스, MUX)  (나) Splitter (스플리터)","e":"단일 사이클 데이터패스의 ALUSrc, RegDst, MemtoReg 선택에 MUX가 쓰이고, Instr[31:26], [25:21] 등을 나누는 데 Splitter가 쓰인다.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":9},
  {"t":"sa","q":"입출력 장치를 프로세서가 접근하는 방법 중, 입출력 장치 접근을 마치 메모리 접근하듯 메모리 접근 명령어를 통해 구현하는 방식을 무엇이라 부르는가?","a":"Memory-Mapped I/O (메모리 맵 입출력)","e":"한글 작성 가능. 입출력 장치에 메모리 주소를 할당해 lw/sw로 접근한다.","s":1,"org":"기출 · 2024 기말(OX)·2025 기말","src":"요약정리","c":7},
  {"t":"sa","q":"아래 코드에서 jal simple 실행 시 (가) 마지막 줄 jr $ra가 실행될 때 $ra의 값은? (나) jal이 수행하는 두 기능을 완성하시오: ① (A) ← PC + (B) ; 돌아올 곳 저장  ② (C) ← 0x00401020 ; simple로 점프","k":"0x00400200 main:   jal  simple\n0x00400204         add  $s0, $s1, $s2\n...\n0x00401020 simple: jr   $ra","a":"(가) $ra = 0x00400204   (나) A = $ra, B = 4, C = PC","e":"jal은 PC+4를 $ra에 저장하고(0x00400200+4 = 0x00400204) PC를 simple 주소로 바꾼다. jr $ra는 $ra 주소로 복귀.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":6},
  {"t":"sa","q":"main의 시작 주소가 0x00400004이고 명령어당 4바이트일 때, jal my_function 수행 후 PC와 $ra의 값은?","k":"main:\n  li  $t0, 10           # $t0 = 10\n  li  $t1, 20           # $t1 = 20\n  jal my_function       # 함수 호출\n  add $t2, $t0, $t1     # $t2 = $t0 + $t1\nmy_function:\n  li  $t0, 30           # $t0 = 30\n  jr  $ra               # 리턴","a":"PC = 0x00400014, $ra = 0x00400010","e":"li 2개가 0x00400004, 0x00400008 → jal은 0x0040000C, 다음 add는 0x00400010($ra = PC+4), my_function은 0x00400014. (2024 중간: main 시작 0x00400000 → PC=0x00400010, $ra=0x0040000C)","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":6},
  {"t":"sa","q":"단일 사이클 MIPS 프로세서에서 (가) beq, (나) j 명령어 수행 시 제어 신호 값을 쓰시오. (모르면 don't care는 X)  (가) RegWrite, RegDst, ALUSrc, Branch, MemWrite, MemtoReg  (나) RegWrite, RegDst, ALUSrc, Branch, MemWrite, MemtoReg, Jump","a":"(가) 0 X 0 1 0 X   (나) 0 X X X 0 X 1","e":"beq: 레지스터에 쓰지 않음(RegWrite 0), ALU 두 입력 모두 레지스터(ALUSrc 0, ALU는 뺄셈으로 비교), Branch 1, MemWrite 0이며 RegDst·MemtoReg는 쓰는 값이 없어 X. j: 쓰기 없음, Jump = 1, 나머지는 영향 없음(X) — MemWrite·RegWrite만 0.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":9},
  {"t":"sa","q":"a, b, c가 각각 $t0, $t1, $t2에 있다고 할 때, 다음 C 코드를 MIPS 어셈블리로 변환하시오.   if (a > b) c = c - 1;  else c = c + 1;","a":"slt $t3,$t1,$t0 / beq $t3,$zero,ELSE / addi $t2,$t2,-1 / j END / ELSE: addi $t2,$t2,1 / END:","e":"a > b ⇔ b < a 이므로 slt $t3,$t1,$t0 (b<a이면 1). $t3==0이면(a ≤ b) ELSE로 분기. (2024 중간은 then이 c+1, else가 c-1로 반대)","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":4},
  {"t":"bl","q":"“hello world”를 출력하는 코드의 빈칸을 채우시오.","k":"# a program that prints \"hello world\"\n         .text\n         .globl __start\n__start: (가) $a0, str\n         (나) $v0, (다)\n         syscall\n         (나) $v0, (라)\n         syscall\n\n         .data\nstr: (마) \"hello world\\n\"","a":"(가) la  (나) li  (다) 4  (라) 10  (마) .asciiz","e":"la $a0,str: 문자열 주소를 $a0에, li $v0,4: print string, li $v0,10: exit. (마)는 .asciiz(널 종료 문자열 지시어)로 정확한 답만 인정.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":1},
  {"t":"bl","q":"MIPS 프로세서에는 (가)개의 레지스터(PC, HI, LO 제외)가 있고 각 레지스터는 (나)비트이다. 항상 값 0을 저장하는 레지스터는 (다)이다.","a":"(가) 32  (나) 32  (다) $zero ($0, R0)","e":"$0 ~ $31, 컴파일러(어셈블러)가 쓰는 $at($1) 포함 32개.","s":1,"org":"기출 · 2024 기말·2025 중간·기말","src":"요약정리","c":1},
  {"t":"bl","q":"명령어 타입을 쓰시오.  and: (가)   sll: (나)   beq: (다)   jr: (라)   jal: (마)","a":"(가) R-type  (나) R-type  (다) I-type  (라) R-type 또는 I-type (모두 인정)  (마) J-type","e":"and·sll은 레지스터/시프트(R), beq는 16비트 offset(I), jal은 26비트 주소(J). jr은 기출 정답에서 R/I 모두 인정.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":2},
  {"t":"bl","q":"(addi의 opcode는 1로 가정) 기계어 코드를 구하시오.  ① addi $1, $0, -2 → 0x(    )   ② add $5, $3, $4 (op 0, funct 32) → 0x(    )   ③ lw $3, -4($0) (op 35) → 0x(    )","a":"① 0401FFFE  ② 00642820  ③ 8C03FFFC","e":"① op 000001, rs 00000, rt 00001, imm FFFE → 0x0401FFFE. (-1이면 0x0401FFFF)  ② 000000 00011 00100 00101 00000 100000 → 0x00642820.  ③ 100011 00000 00011 FFFC → 0x8C03FFFC.","s":1,"org":"기출 · 2024 기말·2025 기말·2025 중간","src":"요약정리","c":2},
  {"t":"bl","q":"① jump 명령어의 26비트 주소 필드 값이 2일 때, 실제 점프할 32비트 주소는? (최상위 4비트는 0x0 사용) 0x(    )   ② 모든 명령어가 1 clock cycle, 클럭이 4GHz일 때 10억(10⁹)개 명령어 수행 시간은? (    )","a":"① 0x00000008  ② 0.25초 (1/4초)","e":"① 주소 = {PC[31:28], addr<<2} = 2×4 = 8 → 0x00000008. (2024: addr 8 → 0x00000020)  ② 10⁹ × 1 cycle ÷ 4×10⁹ Hz = 0.25 s. (2024: 2 cycle, 2GHz → 1초)","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":8},
  {"t":"bl","q":"CPI가 add/sub/addi = 2, lw/sw = 3, beq/bne = 2이고 클럭이 1GHz인 프로세서가 아래 프로그램을 실행한다. (가) 실행되는 명령어 수 (나) 필요한 클럭 사이클 수 (다) 실행 시간 (라) 실행 후 $t2 (마) $t3 (바) 메모리 4번지의 값","k":"addi $sp, $zero, 12\nlw   $t0, -8($sp)\nlw   $t1, -8($sp)\nsub  $t2, $t0, $t1\nbne  $t2, $zero, LLL\naddi $s0, $zero, 1\naddi $s1, $zero, 2\nadd  $t2, $s0, $s1\nsub  $t3, $s0, $s1\naddi $t1, $s0, -12\nLLL: addi $t1, $t2, 8\nsub  $t3, $t2, $t1\nadd  $t2, $t2, $t1\nsw   $t1, -8($sp)","a":"(가) 14개  (나) 31  (다) 31 ns  (라) 14  (마) -8  (바) 11","e":"$sp=12 → lw -8($sp)는 두 번 모두 4번지를 읽어 $t0=$t1 → $t2=0 → bne 분기 안 함 → 14개 전부 실행. 사이클: lw 2×3 + sw 1×3 + bne 2 = 11, 나머지 10개 × 2 = 20 → 31. 1GHz → 31ns. $s0=1,$s1=2,$t2=3,$t3=-1,$t1=-11 → LLL: $t1=3+8=11, $t3=3-11=-8, $t2=3+11=14, sw $t1 → 메모리 4번지(12-8) = 11.","s":1,"org":"기출 · 2025 기말 (2024 기말도 동일 유형)","src":"요약정리","c":8},
  {"t":"bl","q":"바로 앞 문제와 같은 프로그램(CPI·클럭 조건도 동일)에서 (가) bne $t2,$zero,LLL의 offset (나) 평균 CPI (분수) (다) single cycle MIPS에서 ALU 덧셈 횟수 (라) ALU 뺄셈 횟수 (마) lw/sw의 CPI를 3→2로 줄이면 수행시간은 몇 배 빨라지는가? (분수)","k":"addi $sp, $zero, 12\nlw   $t0, -8($sp)\nlw   $t1, -8($sp)\nsub  $t2, $t0, $t1\nbne  $t2, $zero, LLL\naddi $s0, $zero, 1\naddi $s1, $zero, 2\nadd  $t2, $s0, $s1\nsub  $t3, $s0, $s1\naddi $t1, $s0, -12\nLLL: addi $t1, $t2, 8\nsub  $t3, $t2, $t1\nadd  $t2, $t2, $t1\nsw   $t1, -8($sp)","a":"(가) 5  (나) 31/14  (다) 10회  (라) 4회  (마) 31/28","e":"(가) 분기 명령 다음부터 LLL 직전까지 5개 명령어를 건너뜀 → offset 5. (나) 31/14. (다) 덧셈: addi 5개 + add 2개 + lw 2개·sw 1개(주소 계산) = 10. (라) 뺄셈: sub 3개 + bne(비교를 위한 뺄셈) 1개 = 4. (마) lw/sw가 3개 → 사이클 31 → 28, 속도 향상 31/28.","s":1,"org":"기출 · 2025 기말 (2024 기말: offset 3, CPI 2, 덧셈 8, 뺄셈 3, 22/17)","src":"요약정리","c":8},
  {"t":"bl","q":"초기 메모리 0번지 = 4, 4번지 = 3일 때 아래 프로그램을 수행하면 (가) 실행되는 명령어 수 (나) $t1 (다) $t3 (라) 메모리 4번지의 값은?","k":"      addi $t0, $0, 0\n      lw   $t1, 0($t0)\n      lw   $t2, 4($t0)\n      slt  $t3, $t1, $t2\n      beq  $t3, $zero, LLL\nKKK:  addi $t3, $t3, 8\n      sll  $t1, $t3, 1\n      j    MMM\nLLL:  addi $t1, $t2, 6\n      addi $t0, $0, 4\n      j    KKK\nMMM:  sw   $t1, -4($t0)\n      sw   $t3, 0($t0)","a":"(가) 13개  (나) 16  (다) 8  (라) 8","e":"$t1=4, $t2=3 → slt $t3 = (4<3) = 0 → beq 분기(LLL): $t1=3+6=9, $t0=4, j KKK: $t3=0+8=8, $t1=8<<1=16, j MMM: sw $t1,-4($t0) → 메모리 0번지=16, sw $t3,0($t0) → 메모리 4번지=8. 명령어: 5+3+3+2=13.","org":"기출 · 2025 중간","src":"요약정리","c":4},
  {"t":"bl","q":"초기 메모리 0번지 = 4, 4번지 = 3일 때 아래 프로그램을 수행하면 (가) 실행되는 명령어 수 (나) $t1 (다) $t3 (라) 메모리 4번지의 값은?","k":"      addi $t0, $0, 0\n      lw   $t1, 0($t0)\n      lw   $t2, 4($t0)\n      slt  $t3, $t1, $t2\n      beq  $t3, $zero, LLL\nKKK:  addi $t3, $t3, 10\n      sll  $t1, $t3, 2\n      j    MMM\nLLL:  addi $t1, $t2, 8\n      sub  $t3, $t2, $t1\n      addi $t0, $0, 4\n      j    KKK\nMMM:  sw   $t1, -4($t0)\n      sw   $t3, 0($t0)","a":"(가) 14개  (나) 8  (다) 2  (라) 2","e":"slt $t3=0 → beq 분기: $t1=3+8=11, $t3=3-11=-8, $t0=4, j KKK: $t3=-8+10=2, $t1=2<<2=8, j MMM: mem[0]=8, mem[4]=2. 명령어: 5+4+3+2=14.","org":"기출 · 2024 중간","src":"요약정리","c":4},
  {"t":"bl","q":"2의 거듭제곱의 합(1 ~ 100)을 구하는 for 루프의 빈칸 (가), (나), (다)를 채우시오.","k":"# $s0 = i, $s1 = sum        for (i=1; i<101; i=i*2) sum = sum + i;\n      addi $s1, $0, 0\n      addi $s0, $0, 1\n      addi $t0, $0, 101\nloop: (가) $t1, $s0, $t0\n      beq  $t1, (나), done\n      add  $s1, $s1, $s0\n      (다) $s0, $s0, 1\n      j    loop\ndone:","a":"(가) slt  (나) $0 ($zero)  (다) sll","e":"i < 101이면 $t1 = 1(slt), $t1 == 0이면 종료(beq $t1,$0), i = i*2 는 왼쪽 시프트 sll $s0,$s0,1.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":4}
);

<script>
// 요약정리 HTML의 장별 요약 (tools/import_notes.js로 생성)
BANK.find(b => b.id === "ca").notesHtml = {
 "1": "<h5>아키텍처 vs 마이크로아키텍처</h5>\n<ul><li><b>아키텍처</b>: 프로그래머 관점의 컴퓨터. <span class=\"n-hl\">명령어(연산)와 피연산자의 위치</span>로 정의된다.</li>\n<li><b>마이크로아키텍처</b>: 아키텍처를 <span class=\"n-hl\">하드웨어로 어떻게 구현할 것인가</span> (7장에서 다룸).</li>\n<li><b>명령어(instruction)</b>: 컴퓨터 언어의 단어 / <b>명령어 집합(instruction set)</b>: 컴퓨터 언어의 어휘.</li>\n<li><b>어셈블리 언어</b>: 사람이 읽을 수 있는 명령어 형식 / <b>기계어</b>: 기계가 읽는 형식(1과 0).</li>\n<li>MIPS: 1980년대 스탠퍼드의 <b>John Hennessy</b> 팀이 개발. SGI, 닌텐도, 시스코 등 상용 시스템에서 사용. 한 아키텍처를 익히면 다른 것도 쉽다.</li></ul>\n<h5>시스템 콜 서비스 ($v0에 코드, 인자는 $a0 등)</h5><div class=\"n-tbl\"><table><thead><tr><th>서비스</th><th>$v0 코드</th><th>인자 / 결과</th></tr></thead><tbody><tr><td>print integer</td><td>1</td><td>$a0 = 출력할 정수</td></tr><tr><td>print float / double</td><td>2 / 3</td><td>$f12 = 출력할 값</td></tr><tr><td>print string</td><td>4</td><td>$a0 = 널 종료 문자열 주소</td></tr><tr><td>read integer</td><td>5</td><td>결과: $v0에 정수</td></tr><tr><td>read string</td><td>8</td><td>$a0 = 버퍼 주소, $a1 = 최대 문자 수</td></tr><tr><td>sbrk (힙 할당)</td><td>9</td><td>$a0 = 바이트 수 → $v0 = 할당된 주소</td></tr><tr><td>exit (종료)</td><td>10</td><td>-</td></tr></tbody></table></div>\n<h5>기본 연산: 덧셈·뺄셈</h5>\n<pre>a = b + c;        add a, b, c      # add: 니모닉(연산), b·c: 소스, a: 목적지\na = b - c;        sub a, b, c\na = b + c - d;    add t, b, c      # t = b + c\n                  sub a, t, d      # a = t - d   (복잡한 식 = 여러 명령어)</pre>\n<div class=\"n-star\"><b>피연산자(Operand)의 3가지 출처 & 레지스터</b>\n<ul><li>피연산자는 <span class=\"n-hl\">레지스터 / 메모리 / 상수(즉치, immediate)</span>에서 가져온다.</li>\n<li>메모리는 느리고 크다. MIPS는 <span class=\"n-hl\">32비트 레지스터 32개</span> → 32비트 데이터를 다루므로 “32비트 아키텍처”.</li>\n<li>레지스터는 <code>$</code>로 표기. <span class=\"n-red\">$0은 항상 상수 0</span>, $t0–$t9는 임시값 보관용.</li></ul></div>\n<div>\n<h5>MIPS 레지스터 집합</h5><div class=\"n-tbl\"><table><thead><tr><th>이름</th><th>번호</th><th>용도</th></tr></thead><tbody><tr><td>$0</td><td>0</td><td>상수 0</td></tr><tr><td>$at</td><td>1</td><td>어셈블러 임시</td></tr><tr><td>$v0–$v1</td><td>2–3</td><td>프로시저 반환값</td></tr><tr><td>$a0–$a3</td><td>4–7</td><td>프로시저 인자</td></tr><tr><td>$t0–$t7</td><td>8–15</td><td>임시 레지스터</td></tr><tr><td>$s0–$s7</td><td>16–23</td><td>저장(saved) 변수</td></tr><tr><td>$t8–$t9</td><td>24–25</td><td>추가 임시</td></tr><tr><td>$k0–$k1</td><td>26–27</td><td>OS 임시</td></tr><tr><td>$gp</td><td>28</td><td>글로벌 포인터</td></tr><tr><td>$sp</td><td>29</td><td>스택 포인터</td></tr><tr><td>$fp</td><td>30</td><td>프레임 포인터</td></tr><tr><td>$ra</td><td>31</td><td>프로시저 복귀 주소</td></tr></tbody></table></div>\n<h5>메모리 피연산자: lw / sw</h5><div class=\"n-star\"><b>워드/바이트 주소 지정 메모리</b>\n<ul><li>메모리 읽기 = <b>load</b>(<code>lw</code>), 쓰기 = <b>store</b>(<code>sw</code>). <span class=\"n-hl\">lw: 메모리→레지스터, sw: 레지스터→메모리</span>.</li>\n<li>주소 = <span class=\"n-hl\">base address + offset</span> (base는 아무 레지스터나 가능).</li>\n<li><b>바이트 주소 지정</b>: 각 바이트가 고유 주소. 1워드=4바이트 → <span class=\"n-red\">워드 주소는 4씩 증가</span> (워드 n의 주소 = n×4; 워드 10 → 40 = 0x28, 워드 11 → 44 = 0x2C). 단일 바이트는 <code>lb</code>/<code>sb</code>.</li></ul>\n<pre>lw $s3, 1($0)     # (워드 주소 지정) 워드 1 → $s3 = 0xF2F1AC07\nlw $s3, 4($0)     # (바이트 주소 지정) 주소 4(워드 1) → $s3\nsw $t7, 44($0)    # 주소 44(=0x2C, 워드 11)에 $t7 저장</pre></div><div class=\"n-star\"><b>빅엔디안 vs 리틀엔디안</b>\n<ul><li><b>리틀엔디안</b>: 워드 안에서 <span class=\"n-hl\">LSB(최하위) 쪽부터</span> 바이트 번호 부여 / <b>빅엔디안</b>: <span class=\"n-hl\">MSB(최상위) 쪽부터</span>. 워드 주소는 동일.</li>\n<li>어느 쪽이든 상관없지만 <span class=\"n-red\">두 시스템이 데이터를 공유할 때</span>는 문제가 된다. (걸리버 여행기의 달걀 깨는 쪽 유래)</li>\n<li>예) <code>$t0 = 0x23456789</code>, <code>sw $t0,0($0)</code> 후 <code>lb $s0,1($0)</code> → <b>빅엔디안 0x00000045 / 리틀엔디안 0x00000067</b></li></ul></div><div class=\"n-note\"><span class=\"n-sub\">📝 LECTURE NOTE</span>메모리 계층: 레지스터(빠름·작음) → 캐시(SRAM) → 주메모리(RAM, 수 GB). 자주 쓰는 변수는 레지스터에 둔다. 1워드 = 32비트 = 4바이트.</div>\n<h5>상수 / 즉치(Immediate)</h5>\n<ul><li>명령어 자체에 들어 있어 <span class=\"n-hl\">레지스터·메모리 접근이 필요 없다</span>. <code>addi</code>는 즉치를 레지스터에 더한다.</li>\n<li>즉치는 <span class=\"n-hl\">16비트 2의 보수</span>. <span class=\"n-red\"><code>subi</code>는 불필요</span> — 음수 즉치로 <code>addi</code> 사용.</li></ul>\n<pre>a = a + 4;   addi $s0, $s0, 4\nb = a - 12;  addi $s1, $s0, -12</pre></div>",
 "2": "<ul><li>컴퓨터는 0과 1만 이해. 명령어는 <span class=\"n-hl\">32비트</span>(규칙성이 단순성을 낳는다) — 3가지 형식: <b>R-Type(레지스터), I-Type(즉치), J-Type(점프)</b>.</li></ul>\n<div class=\"n-star\"><b>3가지 명령어 형식 필드</b><div class=\"n-tbl\"><table><thead><tr><th>형식</th><th>필드 (비트 수)</th></tr></thead><tbody><tr><td>R-Type</td><td>op(6) | rs(5) | rt(5) | rd(5) | shamt(5) | funct(6)</td></tr><tr><td>I-Type</td><td>op(6) | rs(5) | rt(5) | imm(16)</td></tr><tr><td>J-Type</td><td>op(6) | addr(26)</td></tr></tbody></table></div>\n<ul><li>R-Type: rs, rt = <b>소스</b>, rd = <b>목적지</b>. op와 funct가 함께 연산을 결정. shamt = 시프트 양(시프트 외에는 0).</li>\n<li>어셈블리 순서 주의: <span class=\"n-red\">add rd, rs, rt</span> / <span class=\"n-red\">addi rt, rs, imm</span> / <span class=\"n-red\">lw rt, imm(rs)</span>.</li></ul></div>\n<h5>R-Type 예시</h5><div class=\"n-tbl\"><table><thead><tr><th>어셈블리</th><th>op</th><th>rs</th><th>rt</th><th>rd</th><th>shamt</th><th>funct</th><th>기계어</th></tr></thead><tbody><tr><td>add $s0,$s1,$s2</td><td>0</td><td>17</td><td>18</td><td>16</td><td>0</td><td>32</td><td>0x02328020</td></tr><tr><td>sub $t0,$t3,$t5</td><td>0</td><td>11</td><td>13</td><td>8</td><td>0</td><td>34</td><td>0x016D4022</td></tr></tbody></table></div>\n<h5>I-Type 예시</h5><div class=\"n-tbl\"><table><thead><tr><th>어셈블리</th><th>op</th><th>rs</th><th>rt</th><th>imm</th><th>기계어</th></tr></thead><tbody><tr><td>addi $s0,$s1,5</td><td>8</td><td>17</td><td>16</td><td>5</td><td>0x22300005</td></tr><tr><td>addi $t0,$s3,-12</td><td>8</td><td>19</td><td>8</td><td>-12</td><td>0x2268FFF4</td></tr><tr><td>lw $t2,32($0)</td><td>35</td><td>0</td><td>10</td><td>32</td><td>0x8C0A0020</td></tr><tr><td>sw $s1,4($t1)</td><td>43</td><td>9</td><td>17</td><td>4</td><td>0xAD310004</td></tr></tbody></table></div><div class=\"n-star\"><b>opcode 값 & 기계어 해석 순서</b>\n<ul><li><span class=\"n-hl\">addi = 8, lw = 35, sw = 43</span>, R-type은 op=0 + funct (<span class=\"n-hl\">add = 32, sub = 34</span>).</li>\n<li>해석: ① opcode부터 본다 → ② <span class=\"n-hl\">opcode가 모두 0이면 R-type</span>(funct로 명령 판별), 아니면 opcode가 명령을 결정.</li>\n<li>예) <code>0x2237FFF1</code> → addi $s7,$s1,-15 / <code>0x02F34022</code> → sub $t0,$s7,$s3</li></ul></div>\n<h5>저장 프로그램(Stored Program)</h5>\n<ul><li>32비트 명령어와 데이터가 <b>메모리에 저장</b>된다. 프로그램(명령어 순서)만 다르고 하드웨어는 같다 → 새 프로그램 = 메모리에 저장만 하면 됨(재배선 불필요).</li>\n<li>프로세서는 메모리에서 명령어를 <b>순서대로 fetch</b> 후 수행. <span class=\"n-hl\"><b>PC(프로그램 카운터)</b>가 현재 명령어를 추적</span>.</li>\n<li>MIPS 프로그램은 보통 주소 <span class=\"n-hl\"><code>0x00400000</code></span>에서 시작. 명령어 1개 = 4바이트(주소 +4씩).</li></ul>",
 "3": "<div class=\"n-star\"><b>논리 명령어</b>\n<ul><li><code>and, or, xor, nor</code>: <b>and</b> = 비트 마스킹, <b>or</b> = 비트 결합, <b>nor</b> = 비트 반전.</li>\n<li>마스킹: <code>0xF234012F AND 0xFF = 0x0000002F</code> / 결합: <code>0xF2340000 OR 0x000012BC = 0xF23412BC</code></li>\n<li><span class=\"n-hl\"><code>A NOR $0 = NOT A</code></span> → <code>nori</code>는 불필요.</li>\n<li><code>andi, ori, xori</code>: 16비트 즉치는 <span class=\"n-red\">zero-extended(0 확장), sign-extended 아님</span>.</li></ul></div>\n<pre>$s1 = 1111 1111 1111 1111 0000 0000 0000 0000\n$s2 = 0100 0110 1010 0001 1111 0000 1011 0111\nand → 0100 0110 1010 0001 0000 0000 0000 0000\nor  → 1111 1111 1111 1111 1111 0000 1011 0111\nxor → 1011 1001 0101 1110 1111 0000 1011 0111\nnor → 0000 0000 0000 0000 0000 1111 0100 1000</pre>\n<p>예) <code>$s1 = 0x000000FF</code>, 즉치 <code>0xFA34</code> → andi = 0x00000034, ori = 0x0000FAFF, xori = 0x0000FACB</p>\n<h5>시프트 명령어</h5><div class=\"n-tbl\"><table><thead><tr><th>명령</th><th>의미</th><th>형식</th><th>funct</th></tr></thead><tbody><tr><td>sll</td><td>왼쪽 논리 시프트</td><td>R-type (op=0)</td><td>0</td></tr><tr><td>srl</td><td>오른쪽 논리 시프트</td><td>R-type</td><td>2</td></tr><tr><td>sra</td><td>오른쪽 산술 시프트</td><td>R-type</td><td>3</td></tr><tr><td>sllv / srlv / srav</td><td>시프트 양을 레지스터로 지정(variable)</td><td>R-type</td><td>-</td></tr></tbody></table></div><div class=\"n-note\"><span class=\"n-sub\">📝 LECTURE NOTE</span>시프트 = 곱셈/나눗셈: 왼쪽 1칸 ×2, 2칸 ×4, 3칸 ×8 / 오른쪽 시프트는 ÷2ⁿ. 예) <code>sll $t0,$s1,2</code> → shamt=2, rs=0, rt=17, rd=8 → <code>0x00114080</code></div>\n<h5>상수 생성</h5><div class=\"n-star\"><b>16비트 / 32비트 상수 만들기</b>\n<ul><li>16비트: <code>addi $s0, $0, 0x4f3c</code></li>\n<li>32비트: <span class=\"n-hl\"><code>lui</code>(load upper immediate) + <code>ori</code></span> — lui는 16비트 즉치를 <b>상위 절반</b>에 넣고 하위 절반을 0으로 설정.</li></ul>\n<pre>int a = 0xFEDC8765;   lui $s0, 0xFEDC\n                      ori $s0, $s0, 0x8765</pre></div><div class=\"n-star\"><b>곱셈 / 나눗셈 (특수 레지스터 hi, lo)</b>\n<ul><li><code>mult $s0,$s1</code>: 32×32 곱셈, <span class=\"n-hl\">64비트 결과가 hi(상위), lo(하위)</span>에 저장.</li>\n<li><code>div $s0,$s1</code>: 32비트 나눗셈 → <span class=\"n-hl\">몫(quotient)은 lo, 나머지(remainder)는 hi</span>.</li></ul></div>",
 "4": "<div class=\"n-star\"><b>분기의 종류</b>\n<ul><li><b>조건부 분기</b>: <code>beq</code>(같으면 분기), <code>bne</code>(다르면 분기)</li>\n<li><b>무조건 분기</b>: <code>j</code>(jump), <code>jr</code>(jump register, 레지스터 주소로), <code>jal</code>(jump and link)</li>\n<li><span class=\"n-hl\">레이블</span>: 명령어 위치 표시. <span class=\"n-red\">예약어 사용 불가, 반드시 콜론(:)으로 끝남</span>. 분기를 안 하면 다음 명령 계속 실행.</li></ul></div>\n<pre>beq $s0,$s1,target   # $s0==$s1 이면 분기(taken) → 사이 명령어는 실행 안 됨\nbne $s0,$s1,target   # 같으면 분기 안 함(not taken)\nj   target           # 무조건 점프\njr  $s0              # $s0에 든 주소로 점프 (예: $s0 = 0x2010)</pre>\n<h5>제어문 → 어셈블리</h5><div class=\"n-star\"><b>if / if-else / while / for</b>\n<p><span class=\"n-red\">어셈블리는 고급 언어 조건의 “반대”를 검사</span>한다. (if(i==j) → bne, while(pow!=128) → beq, for(i!=10) → beq)</p>\n<pre># if (i==j) f=g+h;  f=f-i;\n    bne $s3,$s4,L1\n    add $s0,$s1,$s2\nL1: sub $s0,$s0,$s3\n\n# if-else:  if(i==j) f=g+h; else f=f-i;\n    bne $s3,$s4,L1\n    add $s0,$s1,$s2\n    j   done\nL1: sub $s0,$s0,$s3\ndone:</pre></div>\n<pre># while (pow != 128) { pow = pow*2; x = x+1; }\n        addi $s0,$0,1\n        add  $s1,$0,$0\n        addi $t0,$0,128\nwhile:  beq  $s0,$t0,done\n        sll  $s0,$s0,1      # pow*2\n        addi $s1,$s1,1\n        j    while\ndone:\n\n# for (i=0; i!=10; i=i+1) sum += i;\n        addi $s1,$0,0\n        add  $s0,$0,$0\n        addi $t0,$0,10\nfor:    beq  $s0,$t0,done\n        add  $s1,$s1,$s0\n        addi $s0,$s0,1\n        j    for\ndone:</pre>\n<ul><li>for 구조: <b>initialization</b>(루프 전 1회) / <b>condition</b>(매 반복 시작 시 검사) / <b>loop operation</b>(매 반복 끝) / <b>loop body</b>(조건 만족 시마다 실행).</li></ul><div class=\"n-star\"><b>slt (set less than)</b>\n<ul><li><code>slt $t1,$s0,$t0</code> → <span class=\"n-hl\">$s0 &lt; $t0 이면 $t1 = 1</span>, 아니면 0. 크기 비교 루프에 사용.</li></ul>\n<pre># for (i=1; i</pre></div>",
 "5": "<ul><li>배열: 같은 타입의 많은 데이터를 접근할 때 유용. <b>인덱스</b>로 접근, <b>크기</b> = 원소 개수.</li>\n<li>접근 첫 단계: <span class=\"n-hl\">base address(첫 원소 array[0]의 주소)를 레지스터에 로드</span>. 예) base = 0x12348000 → array[1] = base+4, array[2] = base+8, array[3] = base+12(0x1234800C).</li></ul>\n<div class=\"n-star\"><b>배열 접근 패턴</b>\n<ul><li>원소 주소 = <span class=\"n-hl\">base + 4 × i</span> (int = 4바이트) → <span class=\"n-hl\"><code>sll $t0,$s1,2</code></span>로 i×4 계산 후 base에 더함.</li>\n<li>32비트 base 주소 로드: <code>lui $s0,0x1234</code> + <code>ori $s0,$s0,0x8000</code></li></ul>\n<pre># array[0] = array[0]*2\nlui $s0,0x1234\nori $s0,$s0,0x8000\nlw  $t1,0($s0)        # $t1 = array[0]\nsll $t1,$t1,1         # ×2\nsw  $t1,0($s0)        # array[0] = $t1\nlw  $t1,4($s0)        # array[1] ... 같은 방식 offset 4</pre></div>\n<h5>for 루프로 배열 처리 (array[i] = array[i] * 8, i &lt; 1000)</h5>\n<pre>        lui  $s0,0x23B8\n        ori  $s0,$s0,0xF000    # base = 0x23B8F000\n        addi $s1,$0,0          # i = 0\n        addi $t2,$0,1000\nloop:   slt  $t0,$s1,$t2       # i  1000 ?\n        beq  $t0,$0,done\n        sll  $t0,$s1,2         # i*4 (바이트 오프셋)\n        add  $t0,$t0,$s0       # array[i] 주소\n        lw   $t1,0($t0)\n        sll  $t1,$t1,3         # ×8\n        sw   $t1,0($t0)\n        addi $s1,$s1,1\n        j    loop\ndone:</pre><div class=\"n-star\"><b>ASCII 코드</b>\n<ul><li><b>ASCII</b>(American Standard Code for Information Interchange): 각 문자에 고유한 <b>1바이트</b> 값을 부여.</li>\n<li>예) <code>S = 0x53, a = 0x61, A = 0x41</code>. <span class=\"n-hl\">소문자와 대문자는 0x20(=32)만큼 차이</span>.</li></ul></div>",
 "6": "<ul><li><b>Caller</b>: 호출하는 프로시저(예: main) / <b>Callee</b>: 호출되는 프로시저(예: sum).</li>\n<li>Caller: 인자를 callee에게 전달. Callee: <span class=\"n-hl\">caller가 쓰는 레지스터·메모리를 덮어쓰면 안 됨</span>, 호출된 곳으로 복귀, 결과를 반환.</li></ul>\n<div class=\"n-star\"><b>MIPS 호출 규약</b>\n<ul><li>호출: <span class=\"n-hl\"><code>jal</code></span> / 복귀: <span class=\"n-hl\"><code>jr $ra</code></span> / 인자: <span class=\"n-hl\">$a0–$a3</span> / 반환값: <span class=\"n-hl\">$v0</span></li>\n<li><code>jal</code>: 대상으로 점프하고 <span class=\"n-red\">PC+4를 $ra에 저장</span>. 예) <code>0x00400200 jal simple</code> → <code>$ra = 0x00400204</code>. <code>jr $ra</code>는 $ra 주소로 복귀.</li></ul></div>\n<pre># y = diffofsums(2,3,4,5);\naddi $a0,$0,2\naddi $a1,$0,3\naddi $a2,$0,4\naddi $a3,$0,5\njal  diffofsums\nadd  $s0,$v0,$0       # y = 반환값\n\ndiffofsums:           # result = (f+g) - (h+i)\nadd  $t0,$a0,$a1\nadd  $t1,$a2,$a3\nsub  $s0,$t0,$t1\nadd  $v0,$s0,$0\njr   $ra</pre>\n<p>문제점: diffofsums가 <span class=\"n-red\">$t0, $t1, $s0 세 레지스터를 덮어씀</span> → <b>스택</b>에 임시 저장해 부작용 방지.</p><div class=\"n-star\"><b>스택(Stack)</b>\n<ul><li>변수를 임시 저장하는 메모리. 접시 더미처럼 <span class=\"n-hl\">LIFO(Last-In-First-Out)</span>. 필요하면 <b>확장</b>, 불필요하면 <b>축소</b>.</li>\n<li><span class=\"n-hl\">높은 주소 → 낮은 주소 방향으로 성장(grows down)</span>. <b>$sp</b>는 스택 top을 가리킴. (스택 시작 근처: 0x7FFFFFFC)</li></ul>\n<pre>diffofsums:\n  addi $sp,$sp,-12     # 레지스터 3개 공간 확보 (3×4바이트)\n  sw   $s0,8($sp)\n  sw   $t0,4($sp)\n  sw   $t1,0($sp)\n  ...                  # 계산, 결과는 $v0\n  lw   $t1,0($sp)      # 복원\n  lw   $t0,4($sp)\n  lw   $s0,8($sp)\n  addi $sp,$sp,12      # 스택 공간 해제\n  jr   $ra</pre></div><div class=\"n-note\"><span class=\"n-sub\">📝 LECTURE NOTE</span>중첩 호출(proc1 → proc2): <code>jal</code>이 $ra를 덮어쓰므로 <b>proc1은 $ra를 스택에 저장</b>(<code>addi $sp,$sp,-4 ; sw $ra,0($sp)</code>)했다가 <code>lw $ra,0($sp) ; addi $sp,$sp,4 ; jr $ra</code>로 복원. 저장 없이 호출하면 $ra가 overwrite되어 복귀 불가.</div>",
 "7": "<div class=\"n-star\"><b>프로그램 실행 과정</b>\n<p>고급 언어 코드 → <span class=\"n-hl\">Compiler</span> → 어셈블리 코드 → <span class=\"n-hl\">Assembler</span> → 오브젝트 파일(+ 라이브러리 파일) → <span class=\"n-hl\">Linker</span> → 실행 파일(Executable) → <span class=\"n-hl\">Loader</span> → 메모리</p></div>\n<h5>예제 프로그램</h5>\n<pre>int f, g, y;                 // 전역변수 (.data 영역: f, g, y)\nint main(void){ f=2; g=3; y=sum(f,g); return y; }\nint sum(int a,int b){ return a+b; }\n\nmain: addi $sp,$sp,-4 ; sw $ra,0($sp)    # 스택 프레임, $ra 저장\n      addi $a0,$0,2 ; sw $a0,f           # f = 2\n      addi $a1,$0,3 ; sw $a1,g           # g = 3\n      jal sum ; sw $v0,y                 # y = sum()\n      lw $ra,0($sp) ; addi $sp,$sp,4 ; jr $ra\nsum:  add $v0,$a0,$a1 ; jr $ra</pre><div class=\"n-star\"><b>MIPS 메모리 맵 (위 → 아래)</b><div class=\"n-tbl\"><table><thead><tr><th>영역</th><th>주소 범위 / 설명</th></tr></thead><tbody><tr><td>Reserved</td><td>0x80000000 ~ 0xFFFFFFFC</td></tr><tr><td>Stack (스택)</td><td>~ 0x7FFFFFFC (아래로 성장)</td></tr><tr><td>Heap (동적 데이터)</td><td>0x10010000 ~ (위로 성장)</td></tr><tr><td>Static Data (정적/전역)</td><td>0x10000000 ~ 0x1000FFFC</td></tr><tr><td>Text (코드)</td><td>0x00400000 ~ 0x0FFFFFFC</td></tr><tr><td>Reserved</td><td>0x00000000 ~ 0x003FFFFC</td></tr></tbody></table></div><p>Text는 <span class=\"n-hl\">0x00400000</span>, 정적 데이터는 <span class=\"n-hl\">0x10000000</span>에서 시작.</p></div>\n<h5>심볼 테이블 &amp; 실행 파일</h5><div class=\"n-tbl\"><table><thead><tr><th>심볼</th><th>주소</th></tr></thead><tbody><tr><td>f</td><td>0x10000000</td></tr><tr><td>g</td><td>0x10000004</td></tr><tr><td>y</td><td>0x10000008</td></tr><tr><td>main</td><td>0x00400000</td></tr><tr><td>sum</td><td>0x0040002C</td></tr></tbody></table></div>\n<ul><li>실행 파일 헤더: <span class=\"n-hl\">Text 크기 0x34(52바이트)</span>, <span class=\"n-hl\">Data 크기 0xC(12바이트)</span>.</li>\n<li>Text 세그먼트: 0x00400000부터 명령어(예: <code>0x23BDFFFC addi $sp,$sp,-4</code>, <code>0x00851020 add $v0,$a0,$a1</code>, <code>0x03E00008 jr $ra</code>). 전역변수는 $gp 기준 접근(예: <code>sw $a0,0x8000($gp)</code>).</li></ul>",
 "8": "<ul><li><b>마이크로아키텍처</b>: 아키텍처를 하드웨어로 어떻게 구현할 것인가. <b>프로세서 = 데이터패스(기능 블록) + 제어(제어 신호)</b>.</li>\n<li>하나의 아키텍처에 대해 구현 방법이 여러 가지:</li></ul><div class=\"n-tbl\"><table><thead><tr><th>구현 방식</th><th>특징</th></tr></thead><tbody><tr><td>단일 사이클 (Single-cycle)</td><td>각 명령어를 <b>한 사이클</b>에 실행 (가장 쉬움)</td></tr><tr><td>다중 사이클 (Multicycle)</td><td>명령어를 <b>짧은 여러 단계</b>로 쪼갬</td></tr><tr><td>파이프라인 (Pipelined)</td><td>명령어를 여러 단계로 쪼개고 <b>여러 명령어를 동시에 실행</b> (성능 ↑)</td></tr></tbody></table></div><div class=\"n-note\"><span class=\"n-sub\">📝 LECTURE NOTE</span>“CPU 만들기”: Verilog <b>HDL(Hardware Description Language, 하드웨어 기술 언어)</b>로 나만의 MIPS 프로세서를 설계해 FPGA 보드에 다운로드. 아키텍처 = 명령어 집합 = {and, or, add, sub, slt, lw, sw, beq …}</div>\n<h5>프로세서 성능 (Processor Performance)</h5><div class=\"n-star\"><b>프로그램 실행 시간 공식</b>\n<p>Execution Time = (# instructions) × (cycles / instruction) × (seconds / cycle)</p>\n<ul><li><b>CPI</b> = cycles/instruction : <span class=\"n-hl\">명령어당 요구되는 클럭 사이클 수</span></li>\n<li><b>seconds/cycle</b> = 클럭 주기(clock cycle time)</li>\n<li><b>IPC</b> = 1/CPI = instructions/cycle : <span class=\"n-hl\">한 클럭당 수행되는 명령어 수</span> → <span class=\"n-red\">IPC가 클수록 좋다</span></li>\n<li>도전 과제: <b>비용(Cost), 전력(Power), 성능(Performance)</b> 제약을 만족시키는 것.</li></ul></div><div class=\"n-note\"><span class=\"n-sub\">📝 LECTURE NOTE</span>시간 단위: ms = 10⁻³초, μs = 10⁻⁶초, ns = 10⁻⁹초, ps = 10⁻¹²초. 디지털 시스템은 클럭에 맞춰 동작: F/F(레지스터) → 조합회로 → F/F 사이를 한 클럭 사이클 안에 통과.</div>\n<h5>MIPS 프로세서 (부분집합)</h5><div class=\"n-tbl\"><table><thead><tr><th>종류</th><th>명령어</th></tr></thead><tbody><tr><td>R-type</td><td>and, or, add, sub, slt</td></tr><tr><td>메모리</td><td>lw, sw</td></tr><tr><td>분기</td><td>beq</td></tr><tr><td>추가</td><td>addi, bne, j, jr, jal</td></tr></tbody></table></div><div class=\"n-star\"><b>아키텍처 상태 & 상태 요소</b>\n<ul><li><b>아키텍처 상태(Architectural State)</b>: 프로세서에 대한 모든 것을 결정. <span class=\"n-hl\">PC(프로그램 카운터), 32개 레지스터, 메모리</span> (※ $0은 상수 0).</li>\n<li><b>MIPS 상태 요소</b>: PC, 명령어 메모리(Instruction Memory), 레지스터 파일(Register File), 데이터 메모리(Data Memory). → <span class=\"n-hl\">상태 요소 == 메모리 요소</span></li></ul></div>\n<div class=\"n-tbl\"><table><thead><tr><th>상태 요소</th><th>포트 / 설명</th></tr></thead><tbody>\n<tr><td>PC</td><td>CLK 입력, 입력 PC′ → 출력 PC (32비트, 명령어 주소)</td></tr>\n<tr><td>Instruction Memory</td><td>입력 A(주소) → 출력 RD(32비트 명령어). 읽기 전용(명령어만 저장)</td></tr>\n<tr><td>Register File</td><td>A1, A2(읽을 레지스터 번호 5비트) → RD1, RD2 / A3(쓸 레지스터 번호), WD3(쓸 데이터), WE3(쓰기 허용). 32개×32비트</td></tr>\n<tr><td>Data Memory</td><td>A(주소), WD(쓸 데이터), WE(쓰기 허용) → RD. lw는 읽기, sw는 쓰기</td></tr></tbody></table></div>",
 "9": "<ul><li><b>데이터패스(Datapath)</b>: 데이터가 계산되며 흐르는 경로 / <b>제어(Control)</b>: 제어 신호를 생성하는 부분.</li>\n<li>명령어에 따라 <span class=\"n-hl\">데이터가 흐르는 방향이 바뀌고</span>, 제어 신호가 그 방향을 제어한다.</li></ul>\n<div class=\"n-star\"><b>lw 명령어 실행 6단계 (예: lw $t1, 4($t2))</b><div class=\"n-tbl\"><table><thead><tr><th>STEP</th><th>동작</th><th>핵심</th></tr></thead><tbody><tr><td>1</td><td>명령어 가져오기 (Fetch)</td><td>PC → Instruction Memory → Instr. I-Type: op[31:26], rs[25:21], rt[20:16], imm[15:0]</td></tr><tr><td>2</td><td>레지스터 파일에서 소스 피연산자 읽기</td><td>Instr[25:21](rs) → A1 → RD1 = base address</td></tr><tr><td>3</td><td>즉치 부호 확장 (Sign-extend)</td><td>Instr[15:0] 16비트 → Sign Extend → SignImm 32비트</td></tr><tr><td>4</td><td>메모리 주소 계산</td><td>ALU: SrcA = base, SrcB = SignImm → <b>ALUControl = 010 (덧셈)</b>, 주소 = base + offset</td></tr><tr><td>5</td><td>메모리에서 데이터 읽어 레지스터 파일에 쓰기</td><td>ReadData → WD3, 목적지 = rt(Instr[20:16]) → A3, <b>RegWrite = 1</b></td></tr><tr><td>6</td><td>다음 명령어 주소 결정</td><td>PCPlus4 = PC + 4 → PC′</td></tr></tbody></table></div></div>\n<h5>lw 데이터패스 정리</h5>\n<pre>PC → Instruction Memory → Instr\nrs → RegFile(A1) → RD1 ─────────────┐\nimm(16) → Sign Extend → SignImm ────┴→ ALU(+) → ALUResult → Data Memory(A)\nData Memory(RD) = ReadData → RegFile(WD3), 쓸 레지스터 = rt(A3), RegWrite=1\nPC + 4 → PC'</pre><div class=\"n-note\"><span class=\"n-sub\">📝 LECTURE NOTE</span>lw: 메모리 → 레지스터, sw: 레지스터 → 메모리. 주소 계산은 <b>base address + offset</b> (ALU 덧셈, ALUControl 010). 아직 완성된 프로세서가 아니라 lw 하나를 위한 경로만 구성한 것이며, 이후 R-type·sw·beq 경로가 이어서 추가된다.</div><div class=\"n-star\"><b>꼭 기억할 숫자</b>\n<ul><li>명령어 32비트 / 레지스터 32개 / 레지스터 번호 5비트 / 즉치 16비트 → 32비트 부호확장 / PC+4 / ALUControl 010 / RegWrite 1</li></ul></div>"
};

// 요약정리 HTML 예상문제 원문 (tools/import_summary.js로 생성)
BANK.find(b => b.id === "ai").qs.push(
  {"t":"ox","q":"스팸 판별 모델의 X에 ‘사용자의 사후 신고 여부’를 포함하면 데이터 누출이 발생한다.","a":"O","e":"사후 신고 여부는 문자가 도착한 예측 시점에는 알 수 없는 미래 정보다. 이런 정보가 X에 섞이면 개발 중 성능만 높아 보이는 ‘성능 착시’가 생긴다. (1장 ★★★ 데이터 누출)","src":"요약정리","c":1,"s":1},
  {"t":"ox","q":"테스트 데이터로 성능을 확인한 뒤 결과를 보고 모델 설정을 반복해서 수정해도 평가의 신뢰성은 유지된다.","a":"X","e":"테스트 결과를 보고 설정을 고치면 테스트 데이터를 ‘간접적으로 학습’한 셈이 되어 평가의 신뢰성이 무너진다. 테스트는 마지막 최종 평가에서 단 한 번만 개봉한다. (2장, 70:15:15 분할)","src":"요약정리","c":2,"s":1},
  {"t":"ox","q":"훈련 성능은 95%인데 테스트 성능이 68%라면 전형적인 과적합이다.","a":"O","e":"과적합은 훈련 성능은 매우 높고 테스트 성능은 상대적으로 낮은 상태다. 두 성능의 격차가 벌어지는 순간을 포착하는 것이 중요하다.","src":"요약정리","c":2,"s":1},
  {"t":"ox","q":"K-means에서 군집의 수 K는 알고리즘이 데이터를 보고 자동으로 정해 준다.","a":"X","e":"K는 사용자가 지정하는 값이다(n_clusters=3). 또한 inertia는 K가 커질수록 항상 감소하므로 가장 작은 값만으로 K를 고르면 안 된다.","src":"요약정리","c":3,"s":1},
  {"t":"ox","q":"PCA에서는 가장 큰 고유값(λ)을 가진 고유벡터가 제1주성분(PC1)이 된다.","a":"O","e":"Σv = λv 에서 고유값은 그 축이 설명하는 분산의 크기다. 분산이 최대가 되는 방향(가장 큰 λ의 v)이 PC1이며 정보 손실이 가장 적은 투영 축이다. (3장 ★★★)","src":"요약정리","c":3,"s":1},
  {"t":"ox","q":"단일 퍼셉트론도 학습 횟수를 충분히 늘리면 XOR 문제를 완벽하게 분류할 수 있다.","a":"X","e":"XOR는 선형 분리가 불가능하다. 학습 횟수의 문제가 아니라 단일 퍼셉트론이 만들 수 있는 경계가 직선 하나이기 때문이며, 이 한계가 첫 번째 ‘AI 겨울’을 불렀다.","src":"요약정리","c":4,"s":1},
  {"t":"ox","q":"층 사이에 활성화 함수(비선형 변환)가 없다면 층을 100개 쌓아도 하나의 선형 변환과 같다.","a":"O","e":"(XW₁)W₂ = X(W₁W₂) — 행렬곱의 결합법칙에 따라 선형층은 합쳐진다. 실습에서도 np.allclose(...)가 True로 나왔다.","src":"요약정리","c":4,"s":1},
  {"t":"ox","q":"경사하강법에서 학습률 η를 매우 크게 잡을수록 더 빠르고 안정적으로 최솟값에 수렴한다.","a":"X","e":"학습률이 너무 크면 최솟값을 지나쳐 반대편으로 튀며 손실이 진동·발산한다(실습: lr=200 → 손실 43.44, 정확도 50%). 너무 작아도(lr=0.01) 학습이 느리다.","src":"요약정리","c":2,"s":1},
  {"t":"ox","q":"시그모이드 도함수의 최댓값은 0.25이므로, 10개 층을 거치면 앞쪽 층의 기울기가 최대로 잡아도 약 100만 분의 1로 줄어든다.","a":"O","e":"σ′(z)=σ(1−σ) ≤ 0.5×0.5 = 0.25 이고 0.25¹⁰ ≈ 10⁻⁶ 이다. 이것이 기울기 소실이며, ReLU(양수 구간 기울기 1)와 He/Xavier 초기화로 완화한다. (6장 ★★★)","src":"요약정리","c":6,"s":1},
  {"t":"ox","q":"드롭아웃은 훈련 때와 테스트(실제 사용) 때 모두 무작위로 일부 뉴런을 꺼서 사용한다.","a":"X","e":"드롭아웃은 훈련 중에만 무작위로 뉴런 출력을 0으로 만든다. 테스트·실제 사용 때는 모든 뉴런을 켠다(여러 작은 신경망의 의견을 모은 효과).","src":"요약정리","c":6,"s":1},
  {"t":"mc","q":"좋은 학습 문제를 설계하는 3가지 기둥에 해당하지 않는 것은?","o":["대상(Target)","시점(Timing)","출력(Output)","알고리즘의 종류"],"a":3,"e":"3가지 기둥은 대상(무엇을 하나의 사례로 볼 것인가), 시점(언제까지의 정보로 언제의 결과를 예측하는가), 출력(숫자·범주·집단 중 무엇을 내놓는가)이다. 알고리즘의 종류보다 이것들을 먼저 정의해야 한다.","src":"요약정리","c":1,"s":1},
  {"t":"mc","q":"암 환자를 ‘정상’으로 잘못 판정해 돌려보내는 오류는 혼동행렬의 어디에 해당하며, 어떤 지표로 줄이려 하는가?","o":["FP(오탐) — 정밀도","FN(놓침) — 재현율","FP(오탐) — 재현율","FN(놓침) — 정밀도"],"a":1,"e":"양성(환자)을 음성으로 놓친 것이 FN이며, 놓침을 줄이는 것이 중요한 암 진단에서는 재현율(Recall)을 중시한다. 스팸 필터는 정상 메일을 차단하는 FP가 문제이므로 정밀도를 중시한다.","src":"요약정리","c":2,"s":1},
  {"t":"mc","q":"데이터를 훈련 70% / 검증 15% / 테스트 15%로 나눌 때, 학습 방향 점검과 하이퍼파라미터 수정에 사용하는 데이터는?","o":["훈련 데이터","검증 데이터","테스트 데이터","전체 데이터"],"a":1,"e":"검증 데이터(9월 모의고사)는 학습 방향 점검과 하이퍼파라미터 수정 기회를 주는 데이터다. 훈련 데이터는 매개변수 학습, 테스트 데이터는 마지막에 단 한 번 쓰는 최종 평가용이다.","src":"요약정리","c":2,"s":1},
  {"t":"mc","q":"365일 중 364일 맑은 지역에서 ‘항상 비 안 옴’으로만 예측하는 모델의 정확도와 문제점으로 옳은 것은?","o":["약 50%, 데이터가 부족하다","약 99.7%이지만 비 오는 날을 한 번도 못 맞힌다","약 0.3%이지만 비 오는 날은 모두 맞힌다","약 99.7%이며 가장 이상적인 모델이다"],"a":1,"e":"364/365 ≈ 99.7%다. 하지만 정작 비가 오는 날(소수 클래스)은 전혀 맞히지 못하는 ‘쓸모없는 깡통’ — 데이터 불균형에서는 정확도만 보면 안 되고 정밀도·재현율·F1 등을 함께 봐야 한다.","src":"요약정리","c":2,"s":1},
  {"t":"mc","q":"입력 X의 shape이 (4, 2), 첫 번째 층 가중치 W1이 (2, 2), 두 번째 층 가중치 W2가 (2, 1)일 때, Z2 = A1 @ W2 + b2 의 shape은?","o":["(2, 1)","(4, 2)","(4, 1)","(2, 2)"],"a":2,"e":"Z1 = X@W1+b1 은 (4,2)@(2,2) = (4,2). A1도 (4,2). Z2 = (4,2)@(2,1) = (4,1). 안쪽 차원이 같아야 곱할 수 있고, 4는 샘플 수·마지막 1은 출력 뉴런 수다.","src":"요약정리","c":4,"s":1},
  {"t":"mc","q":"StandardScaler를 적용한 뒤 각 특성의 분포로 옳은 것은?","o":["최솟값 0, 최댓값 1","평균 0, 표준편차 1","평균 1, 표준편차 0","합계가 1"],"a":1,"e":"StandardScaler는 각 특성을 평균 0, 표준편차 1 수준(Z-score)으로 맞춘다. K-means처럼 거리를 쓰는 알고리즘은 단위·스케일의 영향을 받기 때문에 필요하며, 훈련 데이터로만 fit하고 테스트에는 transform만 한다.","src":"요약정리","c":3,"s":1},
  {"t":"mc","q":"PCA 설명분산비가 PC1 68%, PC2 22%, PC3 10%일 때 PC1과 PC2만 사용하면 보존되는 정보(분산)는?","o":["68%","78%","90%","100%"],"a":2,"e":"누적 설명분산비 = 68% + 22% = 90%. 단 2개의 새로운 축만으로 전체 분산의 90%가 보존된다.","src":"요약정리","c":3,"s":1},
  {"t":"mc","q":"5장 실습 셀 4에서 w=0.5, lr=0.5, grad=−0.0887 일 때 w_new = w − lr·grad 의 값은?","o":["0.4556","0.5444","0.5887","0.4113"],"a":1,"e":"0.5 − 0.5×(−0.0887) = 0.5 + 0.0444 = 0.5444. 음수 기울기를 빼면 w는 커지고, 손실은 0.071268 → 0.067408 로 줄어든다.","src":"요약정리","c":5,"s":1},
  {"t":"mc","q":"6장 실습 2(좁은 골짜기 40걸음 경주)에서 40걸음 뒤 손실이 가장 작았던 최적화 방법은?","o":["SGD (0.102)","Momentum (0.050)","Adam (0.022)","RMSprop (0.001)"],"a":3,"e":"40걸음 뒤 손실: SGD 0.102 · Momentum 0.050 · Adam 0.022 · RMSprop 0.001. 변수마다 보폭을 나누는 RMSprop이 가장 작은 손실을 기록했다.","src":"요약정리","c":6,"s":1},
  {"t":"mc","q":"조기 종료에서 patience=3, 검증 손실이 에폭 1~7에서 0.62, 0.48, 0.41, 0.39, 0.40, 0.42, 0.41일 때, 학습이 중단되는 에폭과 복원해 사용하는 가중치의 에폭은?","o":["중단 7 / 복원 4","중단 4 / 복원 4","중단 7 / 복원 7","중단 5 / 복원 3"],"a":0,"e":"에폭 4(0.39)가 최저이고 이후 5, 6, 7에폭에서 3회 연속 개선이 없어 7에폭에 중단된다. 마지막(7)이 아니라 가장 좋았던 에폭 4의 가중치를 복원한다.","src":"요약정리","c":6,"s":1},
  {"t":"sa","q":"‘데이터 누출’을 판별하기 위한 질문 3가지(관점)를 쓰시오. 하나라도 ‘아니오’이면 해당 컬럼은 삭제한다.","a":"① 시점 — 예측해야 하는 그 순간에 이미 알 수 있는 정보인가? ② 인과 — 정답이 정해진 뒤에 생겨나는 결과가 아닌가? ③ 재현 — 새 데이터가 들어와도 같은 방식으로 구할 수 있는가?","e":"2주차 실습의 누출 판별 3질문. ‘차단버튼클릭’을 넣으면 정확도 100%, 제거하면 85.7%로 현실적인 성능이 나온다.","src":"요약정리","c":1,"s":1},
  {"t":"sa","q":"학습 시작 전에 개발자가 외부에서 미리 정하는 값과, 모델이 데이터를 풀며 스스로 바꾸는 값을 각각 무엇이라 하는가? 예도 하나씩 쓰시오.","a":"하이퍼파라미터(예: learning_rate, max_depth, degree) / 매개변수(예: w, b, 회귀계수)","e":"매개변수(Parameter)는 내부 세계에서 모델이 학습으로 조정하고, 하이퍼파라미터는 외부 세계에서 개발자가 사전에 설정하는 지침이다.","src":"요약정리","c":2,"s":1},
  {"t":"sa","q":"스팸 메일 필터와 암 진단에서 각각 더 중요하게 보는 분류 평가지표를 쓰고, 두 지표의 조화평균 지표 이름을 쓰시오.","a":"스팸 필터 = 정밀도(Precision, FP 줄이기), 암 진단 = 재현율(Recall, FN 줄이기), 조화평균 = F1 점수","e":"정상 메일을 차단(오탐, FP)하면 안 될 때는 정밀도, 환자를 정상으로 놓침(FN)이 치명적일 때는 재현율을 본다.","src":"요약정리","c":2,"s":1},
  {"t":"sa","q":"특징이 늘수록 공간이 너무 방대해져 데이터가 고립되고 거리 개념이 붕괴되는 현상의 이름은? 또, 몸무게(kg)와 꼬리 길이(mm)처럼 단위가 다른 특징을 거리 기반 알고리즘에 넣기 전에 해야 할 전처리와 그 결과를 쓰시오.","a":"차원의 저주(Curse of Dimensionality) / 표준화(StandardScaler, Z-score) — 각 특징을 평균 0, 표준편차 1로 맞춰 동등한 잣대로 거리 계산","e":"표준화하지 않으면 숫자가 큰 특징(몸무게)이 거리 계산을 지배하고 꼬리 길이는 무시된다.","src":"요약정리","c":3,"s":1},
  {"t":"sa","q":"PCA를 적용하는 4단계 파이프라인을 순서대로 쓰시오.","a":"① 중심화 및 표준화 → ② 공분산 계산 → ③ 축 선택(고유값이 큰 순서대로 고유벡터 정렬) → ④ 투영(Transform)","e":"Σv = λv 에서 가장 큰 고유값의 고유벡터가 PC1이다.","src":"요약정리","c":3,"s":1},
  {"t":"sa","q":"신경망에서 ReLU 함수의 식을 쓰고, 은닉층에서 널리 쓰이는 이유를 두 가지 쓰시오.","a":"ReLU(z) = max(0, z). 이유: ① 양수 구간에서 기울기 1을 그대로 통과시켜 깊은 망에서도 신호(기울기)가 사라지지 않는다(기울기 소실 완화) ② 연산이 매우 빠르다.","e":"단점은 ‘죽은 ReLU’(입력이 계속 음수면 기울기 0). 보완: Leaky ReLU.","src":"요약정리","c":4,"s":1},
  {"t":"sa","q":"연쇄 법칙을 이용해 u = 3x, L = u² 일 때 x = 2에서의 dL/dx 를 구하시오. (과정 포함)","a":"u = 6, dL/du = 2u = 12, du/dx = 3 → dL/dx = 12 × 3 = 36","e":"직접 L = 9x² 을 미분한 18x = 36 과 같다.","src":"요약정리","c":5},
  {"t":"sa","q":"한 은닉 뉴런 모형 z = wx + b → h = σ(z) → ŷ = vh → L 에서 첫 가중치 w의 기울기 ∂L/∂w 를 연쇄 법칙으로 쓰고, 5장 실습 셀 3에서 구한 값을 쓰시오.","a":"∂L/∂w = (∂L/∂ŷ)(∂ŷ/∂h)(∂h/∂z)(∂z/∂w) = (−0.3775)(1.0)(0.2350)(1.0) = −0.088723","e":"코드: grad = dL_dyhat*dyhat_dh*dh_dz*dz_dw. 수치 미분(중앙 차분)으로 검산한 값과 같다.","src":"요약정리","c":5,"s":1},
  {"t":"sa","q":"ReLU 계열에 쓰는 He 초기화와 시그모이드·tanh 계열에 쓰는 Xavier 초기화의 분산 공식을 각각 쓰시오.","a":"He: Var(w) = 2 / n_in (ReLU 계열) / Xavier: Var(w) = 2 / (n_in + n_out) (시그모이드·tanh 계열)","e":"목표는 층을 지나도 신호의 분산이 크게 변하지 않게 하여 신호가 사라지거나 폭발하지 않게 하는 것.","src":"요약정리","c":6,"s":1},
  {"t":"sa","q":"학습 로그에서 ‘훈련 loss는 계속 감소하는데 검증 loss는 증가’하는 증상의 원인과 처방 3가지를 쓰시오.","a":"원인: 과적합(훈련 자료의 우연한 패턴까지 외움) / 처방: L2(또는 L1) 규제, 드롭아웃, 조기 종료","e":"참고: 앞쪽 층 기울기≈0·loss 정체 = 기울기 소실(ReLU+He), loss 급증/NaN = 기울기 폭발(학습률↓), 들쭉날쭉·느린 감소 = 모멘텀·Adam.","src":"요약정리","c":6,"s":1},
  {"t":"bl","q":"좋은 학습 문제 설계의 3기둥: (A) 누구/무엇을 하나의 사례로 볼 것인가, (B) 언제까지의 정보로 언제의 결과를 예측하는가, (C) 모델이 무엇을 출력하는가.","a":"(A) 대상(Target) (B) 시점(Timing) (C) 출력(Output)","e":"2주차 슬라이드 ‘좋은 학습 문제를 설계하는 3가지 기둥’.","src":"요약정리","c":1},
  {"t":"bl","q":"K-means의 4단계는 1. (A) → 2. (B) → 3. 확인 → 4. 종료 이며, 확인에서 변화가 있으면 (C)단계로 돌아간다.","a":"(A) 배정 (B) 갱신 (C) 1단계(배정)","e":"가까운 깃발에 배정 → 중심을 다시 계산 → 아직 움직이는가? → 멈추면 군집 완성.","src":"요약정리","c":3},
  {"t":"bl","q":"데이터는 훈련 (A)% / 검증 (B)% / 테스트 15%로 분할하며, 테스트 데이터는 마지막 최종 평가에서 단 (C)번만 사용한다.","a":"(A) 70 (B) 15 (C) 한(1)","e":"문제집(70) · 모의고사(15) · 봉인된 수능 시험지(15).","src":"요약정리","c":2},
  {"t":"bl","q":"경사하강법의 가중치 수정식: w_new = w_old − (A) · (B) , 여기서 (A)가 너무 크면 최솟값을 지나치고 너무 작으면 학습이 느리다.","a":"(A) η (학습률) (B) ∂L/∂w (손실의 기울기)","e":"기울기의 반대 방향으로 한 걸음 이동한다.","src":"요약정리","c":5},
  {"t":"bl","q":"PCA에서 공분산 행렬 Σ, 고유벡터 v, 고유값 (A)에 대해 Σv = (A)v 이며, (A)가 가장 큰 고유벡터가 제(B)주성분(PC1)이다.","a":"(A) λ(람다, 고유값) (B) 1","e":"고유벡터=최적의 투영 각도(새로운 축 방향), 고유값=그 축이 설명하는 분산의 크기.","src":"요약정리","c":3},
  {"t":"bl","q":"순전파: Z₁ = (A) , A₁ = (B)(Z₁), Z₂ = A₁W₂ + b₂, ŷ = sigmoid(Z₂). 행렬곱 (N×M)·(M×K) 에서 안쪽 차원 (C)이 일치해야 한다.","a":"(A) XW₁ + b₁ (B) ReLU (C) M","e":"순전파 = 가중합 → 활성화 → 다음 층 전달 → 최종 출력의 반복.","src":"요약정리","c":4},
  {"t":"bl","q":"역전파에서 첫 가중치의 기울기 ∂L/∂w = (∂L/∂ŷ)(∂ŷ/∂h)( (A) )( (B) ) 이며, 셀 3에서 시그모이드 미분 ∂h/∂z = h(1−h) 의 값은 (C)이었다.","a":"(A) ∂h/∂z (B) ∂z/∂w (C) 0.2350","e":"dh_dz = 0.6225 × (1−0.6225) ≈ 0.2350 (시그모이드 미분의 최대는 0.25).","src":"요약정리","c":5},
  {"t":"bl","q":"XOR MLP 실습에서 학습 전 손실 0.6994는 ln (A) ≈ 0.6931에 가까운 ‘모르는 상태’이며, 5000번 학습 후 최종 손실은 (B)이고, 학습률 (C)일 때 가장 잘 학습되었다.","a":"(A) 2 (B) 0.0019 (C) 1.0","e":"lr 0.01 → 손실 0.694(정확도 50%), lr 1.0 → 0.0019(100%), lr 200 → 43.44(50%).","src":"요약정리","c":5},
  {"t":"bl","q":"Adam의 기본값은 학습률 η = (A), β₁ = 0.9, β₂ = (B) 이며, Adam은 (C)(방향)과 RMSprop(보폭)을 결합한 방법이다.","a":"(A) 0.001 (B) 0.999 (C) 모멘텀","e":"m = 기울기의 평균적 방향(모멘텀), v = 기울기 제곱의 평균적 규모(RMSprop). 초반 0에서 출발한 값을 보정(m̂, v̂).","src":"요약정리","c":6},
  {"t":"bl","q":"7주차 실습의 손글씨 숫자 데이터는 훈련 (A)장 · 검증 540장이며, 아무것도 모르면 손실은 ln 10 ≈ (B)이다. 규제 비교에서 검증 손실이 가장 낮았던(0.489) 방법은 (C)이다.","a":"(A) 1,257 (B) 2.30 (C) 조기 종료","e":"1,797장 = 1,257 + 540. 규제 없음 0.762 → L2 0.623, 드롭아웃 0.693, 조기 종료 0.489(13에폭 복원).","src":"요약정리","c":6}
);
