<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>중간고사 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 일반적인 모바일 퀴즈앱 — 상단 바, 카드 목록, 하단 고정 버튼 */
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #1c2230;
  --sub: #687083;
  --line: #e2e6ee;
  --primary: #3d6df2;
  --primary-soft: #e8eefe;
  --ok: #18a058;
  --ok-soft: #e4f6ec;
  --ng: #e5484d;
  --ng-soft: #fdeaea;
  --code: #f0f2f6;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b1f27; --text: #e9ecf2; --sub: #9aa2b2; --line: #2c3240;
    --primary: #6b8ff7; --primary-soft: #22304f; --ok: #3ccf7f; --ok-soft: #173326; --ng: #ff6b6f; --ng-soft: #3a1d20; --code: #252a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b1f27; --text: #e9ecf2; --sub: #9aa2b2; --line: #2c3240;
  --primary: #6b8ff7; --primary-soft: #22304f; --ok: #3ccf7f; --ok-soft: #173326; --ng: #ff6b6f; --ng-soft: #3a1d20; --code: #252a35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
code { font-family: var(--mono); font-size: .88em; background: var(--code); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre.code { margin: 0; background: var(--code); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 13px; line-height: 1.5; overflow-x: auto; white-space: pre; }

/* 상단 바 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); display: flex; align-items: center; gap: 8px; min-height: 56px; }
.bar h1 { font-size: 19px; font-weight: 700; flex: 1; min-width: 0; }
.bar .sub { font-size: 13px; color: var(--sub); font-weight: 400; }
.icon-btn { background: none; border: 0; min-width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--sub); font-size: 14px; padding: 0 8px; }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 22px; height: 22px; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.label { font-size: 13px; color: var(--sub); font-weight: 500; }

/* 홈: 과목 카드 */
.subj { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; }
.subj-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.subj h2 { font-size: 17px; }
.dday { font-size: 12px; color: var(--primary); font-weight: 700; background: var(--primary-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .ok { background: var(--ok); }
.meter .ng { background: var(--ng); }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }

/* 설정 */
.sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.sec-head h3 { font-size: 15px; }
.link { background: none; border: 0; color: var(--primary); font-size: 13px; padding: 4px 0; }
.chap { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.chap:first-of-type { border-top: 0; }
.chap input { width: 20px; height: 20px; accent-color: var(--primary); margin: 0; }
.chap label { min-width: 0; cursor: pointer; }
.chap .nm { font-size: 15px; display: block; }
.chap .st { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.chap .only { font-size: 13px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 10px; color: var(--primary); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--sub); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip small { opacity: .8; margin-left: 2px; }
.row { display: flex; flex-direction: column; gap: 8px; }
.row + .row { margin-top: 14px; }
.pool { font-size: 14px; color: var(--sub); margin-top: 12px; }
.pool b { color: var(--text); }
.date-in { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--card); font-size: 14px; }

/* 퀴즈 */
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--code); color: var(--sub); }
.tag.type { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.tag.star { color: #c47f00; background: color-mix(in srgb, #f5b100 18%, transparent); }
.qtext { font-size: 17px; font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; word-break: keep-all; margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 15px; overflow-wrap: anywhere; word-break: keep-all; }
.opt .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--code); display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; }
.opt:not(:disabled):hover { border-color: var(--primary); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .n { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
.opt.wrong .n { background: var(--ng); color: #fff; }
.opt:disabled { cursor: default; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.ox button { height: 84px; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; font-size: 36px; font-weight: 700; }
.ox button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.ox button.wrong { border-color: var(--ng); background: var(--ng-soft); color: var(--ng); }
.feedback { margin-top: 14px; border-radius: 12px; padding: 14px; background: var(--code); display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.ng { background: var(--ng-soft); }
.feedback .v { font-weight: 700; }
.feedback.ok .v { color: var(--ok); }
.feedback.ng .v { color: var(--ng); }
.feedback .ans { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
.feedback .ex { font-size: 14px; color: var(--sub); white-space: pre-line; overflow-wrap: anywhere; }
.hint { font-size: 13px; color: var(--sub); margin-top: 12px; text-align: center; }

/* 결과 */
.score { text-align: center; padding: 24px 16px; }
.score b { display: block; font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rlist { display: flex; flex-direction: column; gap: 8px; }
.ritem { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.ritem .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: var(--ok); margin-top: 1px; }
.ritem.ng .mk { background: var(--ng); }
.ritem p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ritem small { display: block; color: var(--sub); white-space: pre-wrap; }

/* 홈 카드 버튼 */
.subj-btns { display: flex; gap: 8px; margin-top: 4px; }
.subj-btns .btn { height: 44px; font-size: 15px; }

/* 과목 탭 */
.tabs { display: flex; background: var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 9px; height: 40px; font-size: 15px; font-weight: 500; color: var(--sub); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.jump { margin-bottom: 12px; }
.note { scroll-margin-top: calc(64px + env(safe-area-inset-top, 0px)); }
.note .link { margin-top: 10px; }

/* 노트 */
.note h3 { font-size: 16px; margin-bottom: 8px; }
.note ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.note li { overflow-wrap: anywhere; }

/* 하단 고정 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock-in { max-width: 600px; margin: 0 auto; display: flex; gap: 8px; }
.btn { flex: 1; height: 52px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.light { background: var(--card); color: var(--text); border: 1px solid var(--line); }
.btn.ok { background: var(--ok); }
.btn.ng { background: var(--ng); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
.foot { font-size: 12px; color: var(--sub); text-align: center; margin-top: 16px; }
</style>

<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
window.BANK = [];
</script>
<script>
// 컴퓨터구조 문제은행
// 출처: 컴퓨터구조.pdf, 컴퓨터구조_시험_요약정리.html (2024·2025 기출 반영)
// 형식: t=유형(ox|mc|sa|bl), c=장, q=문제, k=코드블록, o=보기, a=정답, e=해설, s=1이면 빈출
BANK.push({
  id: "ca",
  name: "컴퓨터구조",
  short: "컴구조",
  line: "2",
  chapters: {
    1: "어셈블리 언어·피연산자",
    2: "기계어",
    3: "논리·시프트·상수",
    4: "분기와 제어문",
    5: "배열과 ASCII",
    6: "프로시저와 스택",
    7: "프로그램 실행·메모리 맵",
    8: "마이크로아키텍처·성능",
    9: "단일 사이클 데이터패스"
  },
  notes: {
    1: [
      "아키텍처 = 프로그래머 관점(명령어 집합 + 피연산자 위치). 마이크로아키텍처 = 그걸 하드웨어로 <b>어떻게 구현</b>할지",
      "피연산자 출처 3가지: 레지스터 / 메모리 / 상수(즉치)",
      "MIPS: 32비트 레지스터 32개 → 32비트 아키텍처. $0은 항상 0",
      "$v0–$v1 반환값 · $a0–$a3 인자 · $t 임시 · $s 저장 · $sp 29 · $ra 31",
      "lw = 메모리 → 레지스터, sw = 레지스터 → 메모리. 주소 = base + offset",
      "바이트 주소 지정: 워드 n의 주소 = n × 4 (워드 10 → 40 = 0x28)",
      "리틀엔디안: LSB 쪽부터 바이트 번호 / 빅엔디안: MSB 쪽부터",
      "즉치는 16비트 2의 보수 → subi 없음, addi에 음수",
      "syscall: $v0=1 정수 출력($a0) · 4 문자열 출력 · 5 정수 입력 · 8 문자열 입력 · 9 sbrk · 10 종료"
    ],
    2: [
      "명령어는 모두 32비트. 형식 3가지: R / I / J",
      "R: op(6) rs(5) rt(5) rd(5) shamt(5) funct(6)",
      "I: op(6) rs(5) rt(5) imm(16) · J: op(6) addr(26)",
      "어셈블리 순서: add rd, rs, rt / addi rt, rs, imm / lw rt, imm(rs)",
      "opcode: R-type 0 (add funct 32, sub funct 34) · addi 8 · lw 35 · sw 43",
      "해석 순서: opcode 먼저 → 0이면 funct로 판별",
      "저장 프로그램: 명령어·데이터 모두 메모리. PC가 현재 명령어 추적. 시작 0x00400000, +4씩"
    ],
    3: [
      "and = 마스킹, or = 결합, nor = 반전 (A NOR $0 = NOT A)",
      "andi·ori·xori 즉치는 <b>0 확장</b> (부호 확장 아님)",
      "sll·srl·sra는 R-type. 왼쪽 n칸 = ×2ⁿ",
      "32비트 상수 = lui(상위 16비트, 하위 0) + ori(하위 16비트)",
      "mult: 64비트 결과 → hi(상위)·lo(하위) · div: 몫 lo, 나머지 hi"
    ],
    4: [
      "조건 분기 beq·bne / 무조건 j·jr·jal",
      "어셈블리는 고급 언어 조건의 <b>반대</b>를 검사 (if i==j → bne)",
      "slt $t1,$s0,$t0 → $s0 < $t0 이면 1",
      "분기 주소 = (PC + 4) + offset × 4",
      "레이블은 콜론(:)으로 끝남, 예약어 불가"
    ],
    5: [
      "array[i] 주소 = base + 4 × i → sll $t0,$s1,2로 i×4",
      "base 0x12348000이면 array[3] = 0x1234800C",
      "ASCII: 대·소문자 차이 0x20(32). A = 0x41, a = 0x61"
    ],
    6: [

      "스택 = LIFO, 높은 주소 → 낮은 주소로 성장. $sp가 top",
      "레지스터 3개 저장: addi $sp,$sp,-12 → sw … → lw … → addi $sp,$sp,12",
      "중첩 호출은 $ra를 스택에 저장하지 않으면 덮어써져 복귀 불가"
    ],
    7: [
      "Compiler → Assembler → Linker → Loader",
      "메모리 맵: Text 0x00400000 · Static 0x10000000 · Heap 0x10010000(위로) · Stack 0x7FFFFFFC(아래로)",
      "전역 변수는 $gp 기준 접근"
    ],
    8: [
      "구현 방식: 단일 사이클 / 다중 사이클 / 파이프라인(여러 명령 동시 실행)",
      "실행 시간 = 명령어 수 × CPI × 클럭 주기",
      "IPC = 1/CPI, 클수록 좋다",
      "아키텍처 상태: PC, 레지스터 32개, 메모리",
      "상태 요소: PC · 명령어 메모리 · 레지스터 파일 · 데이터 메모리"
    ],
    9: [
      "lw 6단계: Fetch → rs 읽기 → 즉치 부호확장 → 주소 계산(ALU 010 덧셈) → 메모리 읽어 rt에 쓰기(RegWrite 1) → PC+4",
      "Logisim: 둘 중 하나 선택 = MUX, 명령어 필드 쪼개기 = Splitter",
      "beq 제어신호: RegWrite 0, RegDst X, ALUSrc 0, Branch 1, MemWrite 0, MemtoReg X",
      "j 제어신호: RegWrite 0, MemWrite 0, Jump 1, 나머지 X",
      "꼭 기억할 숫자: 명령어 32비트 · 레지스터 32개 · 번호 5비트 · 즉치 16비트"
    ]
  },
  qs: [
    // ── OX ──
    {t:"ox", c:3, q:"andi, ori, xori의 16비트 즉치는 부호 확장(sign extension)된다.", a:"X", e:"논리 즉치 명령은 0 확장(zero extension)이다."},
    {t:"ox", c:2, q:"MIPS의 모든 명령어 길이는 32비트이다.", a:"O", e:"‘규칙성이 단순성을 낳는다’. R·I·J 모두 32비트."},
    {t:"ox", c:6, q:"스택은 높은 주소에서 낮은 주소 방향으로 자란다.", a:"O", e:"grows down. 스택 시작 근처는 0x7FFFFFFC."},
    {t:"ox", c:3, q:"`div $s0, $s1`을 실행하면 몫은 hi, 나머지는 lo에 저장된다.", a:"X", e:"몫(quotient)은 lo, 나머지(remainder)는 hi."},
    {t:"ox", c:1, q:"MIPS에는 즉치를 빼는 subi 명령어가 따로 필요하다.", a:"X", e:"즉치가 2의 보수라서 addi에 음수를 넣으면 된다. 예: addi $s1,$s0,-12"},
    {t:"ox", c:3, q:"`nor $t0, $s0, $0`은 $s0의 모든 비트를 반전한다.", a:"O", e:"A NOR 0 = NOT A. 그래서 nori는 필요 없다."},
    {t:"ox", c:2, q:"MIPS 프로그램은 보통 주소 0x00400000에서 시작한다.", a:"O", e:"Text 세그먼트 시작 주소. 명령어 1개마다 +4."},

  {"t":"mc","q":"메모리 주소 공간에서 스택(Stack)의 확장 방향으로 옳은 것은?","o":["메모리 주소가 증가하는 방향으로 확장","메모리 주소가 감소하는 방향으로 확장","랜덤 접근","고정 크기"],"a":1,"e":"스택은 높은 주소에서 낮은 주소로 성장한다(주소 감소 방향).","org":"기출 · 2025 기말 (퀴즈 출제)","src":"요약정리","c":6},
  {"t":"mc","q":"6비트로 “-7”을 2의 보수로 표현한 올바른 이진수는?","o":["110111","111000","111001","000111"],"a":2,"e":"7 = 000111 → 비트 반전 111000 → +1 = 111001. (참고: -1은 111111)","s":1,"org":"기출 · 2024 중간 (2025 중간은 -1)","src":"요약정리","c":3},
  {"t":"mc","q":"“add $9, $8, $7”의 기계어 코드는? (add: op=0, funct=32)","o":["0x01074822","0x8D074820","0x01E94020","0x01074820"],"a":3,"e":"R-type: op 000000, rs=8 (01000), rt=7 (00111), rd=9 (01001), shamt 00000, funct 100000 → 0000 0001 0000 0111 0100 1000 0010 0000 = 0x01074820. (add rd, rs, rt 순서 주의)","s":1,"org":"기출 · 2024 중간 (2025 중간도 같은 유형)","src":"요약정리","c":2},
  {"t":"sa","q":"수행할 명령어의 메모리 주소를 지속적으로 tracking 하는 레지스터는 무엇인가?","a":"PC (Program Counter, 프로그램 카운터)","e":"기출 4회 모두 출제(2024 중·기말, 2025 중·기말). 가장 확실한 빈출 문제.","s":1,"org":"기출 · 2024 중간·기말, 2025 중간·기말","src":"요약정리","c":2},
  {"t":"sa","q":"Architecture와 Microarchitecture의 차이를 간략히 설명하시오.","a":"Architecture: 명령어 집합(프로그래머 관점의 인터페이스·추상적 사양) / Microarchitecture: 그 명령어 집합을 하드웨어로 ‘어떻게 구현’할 것인가","e":"핵심어: Architecture = “명령어 집합”, Microarchitecture = “어떻게 구현”.","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":8},
  {"t":"sa","q":"R-type 명령어를 이루는 필드를 순서대로 쓰고 각 필드의 비트 수를 쓰시오. (예: “funct:6, shamt:5, …”)","a":"op:6, rs:5, rt:5, rd:5, shamt:5, funct:6","e":"합계 6+5+5+5+5+6 = 32비트.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":2},
  {"t":"sa","q":"“int a = 0xFEDC8765;”처럼 32비트 상수 값을 레지스터에 넣기 위해 사용하는 두 명령어는?","a":"lui, ori","e":"lui $s0,0xFEDC → 상위 16비트, ori $s0,$s0,0x8765 → 하위 16비트.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":3},
  {"t":"sa","q":"Logisim에서 (가) 두 입력 중 하나를 선택 신호로 골라 출력에 연결하는 모듈, (나) 명령어 메모리에서 나온 32비트 명령어를 세부 필드로 쪼개는 모듈의 이름은?","a":"(가) Multiplexer (먹스, MUX)  (나) Splitter (스플리터)","e":"단일 사이클 데이터패스의 ALUSrc, RegDst, MemtoReg 선택에 MUX가 쓰이고, Instr[31:26], [25:21] 등을 나누는 데 Splitter가 쓰인다.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":9},
  {"t":"sa","q":"입출력 장치를 프로세서가 접근하는 방법 중, 입출력 장치 접근을 마치 메모리 접근하듯 메모리 접근 명령어를 통해 구현하는 방식을 무엇이라 부르는가?","a":"Memory-Mapped I/O (메모리 맵 입출력)","e":"한글 작성 가능. 입출력 장치에 메모리 주소를 할당해 lw/sw로 접근한다.","s":1,"org":"기출 · 2024 기말(OX)·2025 기말","src":"요약정리","c":7},
  {"t":"sa","q":"아래 코드에서 jal simple 실행 시 (가) 마지막 줄 jr $ra가 실행될 때 $ra의 값은? (나) jal이 수행하는 두 기능을 완성하시오: ① (A) ← PC + (B) ; 돌아올 곳 저장  ② (C) ← 0x00401020 ; simple로 점프","k":"0x00400200 main:   jal  simple\n0x00400204         add  $s0, $s1, $s2\n...\n0x00401020 simple: jr   $ra","a":"(가) $ra = 0x00400204   (나) A = $ra, B = 4, C = PC","e":"jal은 PC+4를 $ra에 저장하고(0x00400200+4 = 0x00400204) PC를 simple 주소로 바꾼다. jr $ra는 $ra 주소로 복귀.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":6},
  {"t":"sa","q":"main의 시작 주소가 0x00400004이고 명령어당 4바이트일 때, jal my_function 수행 후 PC와 $ra의 값은?","k":"main:\n  li  $t0, 10           # $t0 = 10\n  li  $t1, 20           # $t1 = 20\n  jal my_function       # 함수 호출\n  add $t2, $t0, $t1     # $t2 = $t0 + $t1\nmy_function:\n  li  $t0, 30           # $t0 = 30\n  jr  $ra               # 리턴","a":"PC = 0x00400014, $ra = 0x00400010","e":"li 2개가 0x00400004, 0x00400008 → jal은 0x0040000C, 다음 add는 0x00400010($ra = PC+4), my_function은 0x00400014. (2024 중간: main 시작 0x00400000 → PC=0x00400010, $ra=0x0040000C)","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":6},
  {"t":"sa","q":"단일 사이클 MIPS 프로세서에서 (가) beq, (나) j 명령어 수행 시 제어 신호 값을 쓰시오. (모르면 don't care는 X)  (가) RegWrite, RegDst, ALUSrc, Branch, MemWrite, MemtoReg  (나) RegWrite, RegDst, ALUSrc, Branch, MemWrite, MemtoReg, Jump","a":"(가) 0 X 0 1 0 X   (나) 0 X X X 0 X 1","e":"beq: 레지스터에 쓰지 않음(RegWrite 0), ALU 두 입력 모두 레지스터(ALUSrc 0, ALU는 뺄셈으로 비교), Branch 1, MemWrite 0이며 RegDst·MemtoReg는 쓰는 값이 없어 X. j: 쓰기 없음, Jump = 1, 나머지는 영향 없음(X) — MemWrite·RegWrite만 0.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":9},
  {"t":"sa","q":"a, b, c가 각각 $t0, $t1, $t2에 있다고 할 때, 다음 C 코드를 MIPS 어셈블리로 변환하시오.   if (a > b) c = c - 1;  else c = c + 1;","a":"slt $t3,$t1,$t0 / beq $t3,$zero,ELSE / addi $t2,$t2,-1 / j END / ELSE: addi $t2,$t2,1 / END:","e":"a > b ⇔ b < a 이므로 slt $t3,$t1,$t0 (b<a이면 1). $t3==0이면(a ≤ b) ELSE로 분기. (2024 중간은 then이 c+1, else가 c-1로 반대)","s":1,"org":"기출 · 2024 중간·2025 중간","src":"요약정리","c":4},
  {"t":"bl","q":"“hello world”를 출력하는 코드의 빈칸을 채우시오.","k":"# a program that prints \"hello world\"\n         .text\n         .globl __start\n__start: (가) $a0, str\n         (나) $v0, (다)\n         syscall\n         (나) $v0, (라)\n         syscall\n\n         .data\nstr: (마) \"hello world\\n\"","a":"(가) la  (나) li  (다) 4  (라) 10  (마) .asciiz","e":"la $a0,str: 문자열 주소를 $a0에, li $v0,4: print string, li $v0,10: exit. (마)는 .asciiz(널 종료 문자열 지시어)로 정확한 답만 인정.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":1},
  {"t":"bl","q":"MIPS 프로세서에는 (가)개의 레지스터(PC, HI, LO 제외)가 있고 각 레지스터는 (나)비트이다. 항상 값 0을 저장하는 레지스터는 (다)이다.","a":"(가) 32  (나) 32  (다) $zero ($0, R0)","e":"$0 ~ $31, 컴파일러(어셈블러)가 쓰는 $at($1) 포함 32개.","s":1,"org":"기출 · 2024 기말·2025 중간·기말","src":"요약정리","c":1},
  {"t":"bl","q":"명령어 타입을 쓰시오.  and: (가)   sll: (나)   beq: (다)   jr: (라)   jal: (마)","a":"(가) R-type  (나) R-type  (다) I-type  (라) R-type 또는 I-type (모두 인정)  (마) J-type","e":"and·sll은 레지스터/시프트(R), beq는 16비트 offset(I), jal은 26비트 주소(J). jr은 기출 정답에서 R/I 모두 인정.","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":2},
  {"t":"bl","q":"(addi의 opcode는 1로 가정) 기계어 코드를 구하시오.  ① addi $1, $0, -2 → 0x(    )   ② add $5, $3, $4 (op 0, funct 32) → 0x(    )   ③ lw $3, -4($0) (op 35) → 0x(    )","a":"① 0401FFFE  ② 00642820  ③ 8C03FFFC","e":"① op 000001, rs 00000, rt 00001, imm FFFE → 0x0401FFFE. (-1이면 0x0401FFFF)  ② 000000 00011 00100 00101 00000 100000 → 0x00642820.  ③ 100011 00000 00011 FFFC → 0x8C03FFFC.","s":1,"org":"기출 · 2024 기말·2025 기말·2025 중간","src":"요약정리","c":2},
  {"t":"bl","q":"① jump 명령어의 26비트 주소 필드 값이 2일 때, 실제 점프할 32비트 주소는? (최상위 4비트는 0x0 사용) 0x(    )   ② 모든 명령어가 1 clock cycle, 클럭이 4GHz일 때 10억(10⁹)개 명령어 수행 시간은? (    )","a":"① 0x00000008  ② 0.25초 (1/4초)","e":"① 주소 = {PC[31:28], addr<<2} = 2×4 = 8 → 0x00000008. (2024: addr 8 → 0x00000020)  ② 10⁹ × 1 cycle ÷ 4×10⁹ Hz = 0.25 s. (2024: 2 cycle, 2GHz → 1초)","s":1,"org":"기출 · 2024 기말·2025 기말","src":"요약정리","c":8},
  {"t":"bl","q":"CPI가 add/sub/addi = 2, lw/sw = 3, beq/bne = 2이고 클럭이 1GHz인 프로세서가 아래 프로그램을 실행한다. (가) 실행되는 명령어 수 (나) 필요한 클럭 사이클 수 (다) 실행 시간 (라) 실행 후 $t2 (마) $t3 (바) 메모리 4번지의 값","k":"addi $sp, $zero, 12\nlw   $t0, -8($sp)\nlw   $t1, -8($sp)\nsub  $t2, $t0, $t1\nbne  $t2, $zero, LLL\naddi $s0, $zero, 1\naddi $s1, $zero, 2\nadd  $t2, $s0, $s1\nsub  $t3, $s0, $s1\naddi $t1, $s0, -12\nLLL: addi $t1, $t2, 8\nsub  $t3, $t2, $t1\nadd  $t2, $t2, $t1\nsw   $t1, -8($sp)","a":"(가) 14개  (나) 31  (다) 31 ns  (라) 14  (마) -8  (바) 11","e":"$sp=12 → lw -8($sp)는 두 번 모두 4번지를 읽어 $t0=$t1 → $t2=0 → bne 분기 안 함 → 14개 전부 실행. 사이클: lw 2×3 + sw 1×3 + bne 2 = 11, 나머지 10개 × 2 = 20 → 31. 1GHz → 31ns. $s0=1,$s1=2,$t2=3,$t3=-1,$t1=-11 → LLL: $t1=3+8=11, $t3=3-11=-8, $t2=3+11=14, sw $t1 → 메모리 4번지(12-8) = 11.","s":1,"org":"기출 · 2025 기말 (2024 기말도 동일 유형)","src":"요약정리","c":8},
  {"t":"bl","q":"바로 앞 문제와 같은 프로그램(CPI·클럭 조건도 동일)에서 (가) bne $t2,$zero,LLL의 offset (나) 평균 CPI (분수) (다) single cycle MIPS에서 ALU 덧셈 횟수 (라) ALU 뺄셈 횟수 (마) lw/sw의 CPI를 3→2로 줄이면 수행시간은 몇 배 빨라지는가? (분수)","k":"addi $sp, $zero, 12\nlw   $t0, -8($sp)\nlw   $t1, -8($sp)\nsub  $t2, $t0, $t1\nbne  $t2, $zero, LLL\naddi $s0, $zero, 1\naddi $s1, $zero, 2\nadd  $t2, $s0, $s1\nsub  $t3, $s0, $s1\naddi $t1, $s0, -12\nLLL: addi $t1, $t2, 8\nsub  $t3, $t2, $t1\nadd  $t2, $t2, $t1\nsw   $t1, -8($sp)","a":"(가) 5  (나) 31/14  (다) 10회  (라) 4회  (마) 31/28","e":"(가) 분기 명령 다음부터 LLL 직전까지 5개 명령어를 건너뜀 → offset 5. (나) 31/14. (다) 덧셈: addi 5개 + add 2개 + lw 2개·sw 1개(주소 계산) = 10. (라) 뺄셈: sub 3개 + bne(비교를 위한 뺄셈) 1개 = 4. (마) lw/sw가 3개 → 사이클 31 → 28, 속도 향상 31/28.","s":1,"org":"기출 · 2025 기말 (2024 기말: offset 3, CPI 2, 덧셈 8, 뺄셈 3, 22/17)","src":"요약정리","c":8},
  {"t":"bl","q":"초기 메모리 0번지 = 4, 4번지 = 3일 때 아래 프로그램을 수행하면 (가) 실행되는 명령어 수 (나) $t1 (다) $t3 (라) 메모리 4번지의 값은?","k":"      addi $t0, $0, 0\n      lw   $t1, 0($t0)\n      lw   $t2, 4($t0)\n      slt  $t3, $t1, $t2\n      beq  $t3, $zero, LLL\nKKK:  addi $t3, $t3, 8\n      sll  $t1, $t3, 1\n      j    MMM\nLLL:  addi $t1, $t2, 6\n      addi $t0, $0, 4\n      j    KKK\nMMM:  sw   $t1, -4($t0)\n      sw   $t3, 0($t0)","a":"(가) 13개  (나) 16  (다) 8  (라) 8","e":"$t1=4, $t2=3 → slt $t3 = (4<3) = 0 → beq 분기(LLL): $t1=3+6=9, $t0=4, j KKK: $t3=0+8=8, $t1=8<<1=16, j MMM: sw $t1,-4($t0) → 메모리 0번지=16, sw $t3,0($t0) → 메모리 4번지=8. 명령어: 5+3+3+2=13.","org":"기출 · 2025 중간","src":"요약정리","c":4},
  {"t":"bl","q":"초기 메모리 0번지 = 4, 4번지 = 3일 때 아래 프로그램을 수행하면 (가) 실행되는 명령어 수 (나) $t1 (다) $t3 (라) 메모리 4번지의 값은?","k":"      addi $t0, $0, 0\n      lw   $t1, 0($t0)\n      lw   $t2, 4($t0)\n      slt  $t3, $t1, $t2\n      beq  $t3, $zero, LLL\nKKK:  addi $t3, $t3, 10\n      sll  $t1, $t3, 2\n      j    MMM\nLLL:  addi $t1, $t2, 8\n      sub  $t3, $t2, $t1\n      addi $t0, $0, 4\n      j    KKK\nMMM:  sw   $t1, -4($t0)\n      sw   $t3, 0($t0)","a":"(가) 14개  (나) 8  (다) 2  (라) 2","e":"slt $t3=0 → beq 분기: $t1=3+8=11, $t3=3-11=-8, $t0=4, j KKK: $t3=-8+10=2, $t1=2<<2=8, j MMM: mem[0]=8, mem[4]=2. 명령어: 5+4+3+2=14.","org":"기출 · 2024 중간","src":"요약정리","c":4},

  {"t":"ox","q":"드롭아웃은 훈련 때와 테스트(실제 사용) 때 모두 무작위로 일부 뉴런을 꺼서 사용한다.","a":"X","e":"드롭아웃은 훈련 중에만 무작위로 뉴런 출력을 0으로 만든다. 테스트·실제 사용 때는 모든 뉴런을 켠다(여러 작은 신경망의 의견을 모은 효과).","src":"요약정리","c":6,"s":1},
  {"t":"mc","q":"좋은 학습 문제를 설계하는 3가지 기둥에 해당하지 않는 것은?","o":["대상(Target)","시점(Timing)","출력(Output)","알고리즘의 종류"],"a":3,"e":"3가지 기둥은 대상(무엇을 하나의 사례로 볼 것인가), 시점(언제까지의 정보로 언제의 결과를 예측하는가), 출력(숫자·범주·집단 중 무엇을 내놓는가)이다. 알고리즘의 종류보다 이것들을 먼저 정의해야 한다.","src":"요약정리","c":1,"s":1},
  {"t":"mc","q":"암 환자를 ‘정상’으로 잘못 판정해 돌려보내는 오류는 혼동행렬의 어디에 해당하며, 어떤 지표로 줄이려 하는가?","o":["FP(오탐) — 정밀도","FN(놓침) — 재현율","FP(오탐) — 재현율","FN(놓침) — 정밀도"],"a":1,"e":"양성(환자)을 음성으로 놓친 것이 FN이며, 놓침을 줄이는 것이 중요한 암 진단에서는 재현율(Recall)을 중시한다. 스팸 필터는 정상 메일을 차단하는 FP가 문제이므로 정밀도를 중시한다.","src":"요약정리","c":2,"s":1},
  {"t":"mc","q":"데이터를 훈련 70% / 검증 15% / 테스트 15%로 나눌 때, 학습 방향 점검과 하이퍼파라미터 수정에 사용하는 데이터는?","o":["훈련 데이터","검증 데이터","테스트 데이터","전체 데이터"],"a":1,"e":"검증 데이터(9월 모의고사)는 학습 방향 점검과 하이퍼파라미터 수정 기회를 주는 데이터다. 훈련 데이터는 매개변수 학습, 테스트 데이터는 마지막에 단 한 번 쓰는 최종 평가용이다.","src":"요약정리","c":2,"s":1},
  {"t":"mc","q":"365일 중 364일 맑은 지역에서 ‘항상 비 안 옴’으로만 예측하는 모델의 정확도와 문제점으로 옳은 것은?","o":["약 50%, 데이터가 부족하다","약 99.7%이지만 비 오는 날을 한 번도 못 맞힌다","약 0.3%이지만 비 오는 날은 모두 맞힌다","약 99.7%이며 가장 이상적인 모델이다"],"a":1,"e":"364/365 ≈ 99.7%다. 하지만 정작 비가 오는 날(소수 클래스)은 전혀 맞히지 못하는 ‘쓸모없는 깡통’ — 데이터 불균형에서는 정확도만 보면 안 되고 정밀도·재현율·F1 등을 함께 봐야 한다.","src":"요약정리","c":2,"s":1},
  {"t":"mc","q":"입력 X의 shape이 (4, 2), 첫 번째 층 가중치 W1이 (2, 2), 두 번째 층 가중치 W2가 (2, 1)일 때, Z2 = A1 @ W2 + b2 의 shape은?","o":["(2, 1)","(4, 2)","(4, 1)","(2, 2)"],"a":2,"e":"Z1 = X@W1+b1 은 (4,2)@(2,2) = (4,2). A1도 (4,2). Z2 = (4,2)@(2,1) = (4,1). 안쪽 차원이 같아야 곱할 수 있고, 4는 샘플 수·마지막 1은 출력 뉴런 수다.","src":"요약정리","c":4,"s":1},
  {"t":"mc","q":"StandardScaler를 적용한 뒤 각 특성의 분포로 옳은 것은?","o":["최솟값 0, 최댓값 1","평균 0, 표준편차 1","평균 1, 표준편차 0","합계가 1"],"a":1,"e":"StandardScaler는 각 특성을 평균 0, 표준편차 1 수준(Z-score)으로 맞춘다. K-means처럼 거리를 쓰는 알고리즘은 단위·스케일의 영향을 받기 때문에 필요하며, 훈련 데이터로만 fit하고 테스트에는 transform만 한다.","src":"요약정리","c":3,"s":1},
  {"t":"mc","q":"PCA 설명분산비가 PC1 68%, PC2 22%, PC3 10%일 때 PC1과 PC2만 사용하면 보존되는 정보(분산)는?","o":["68%","78%","90%","100%"],"a":2,"e":"누적 설명분산비 = 68% + 22% = 90%. 단 2개의 새로운 축만으로 전체 분산의 90%가 보존된다.","src":"요약정리","c":3,"s":1},
  {"t":"mc","q":"5장 실습 셀 4에서 w=0.5, lr=0.5, grad=−0.0887 일 때 w_new = w − lr·grad 의 값은?","o":["0.4556","0.5444","0.5887","0.4113"],"a":1,"e":"0.5 − 0.5×(−0.0887) = 0.5 + 0.0444 = 0.5444. 음수 기울기를 빼면 w는 커지고, 손실은 0.071268 → 0.067408 로 줄어든다.","src":"요약정리","c":5,"s":1},
  {"t":"mc","q":"6장 실습 2(좁은 골짜기 40걸음 경주)에서 40걸음 뒤 손실이 가장 작았던 최적화 방법은?","o":["SGD (0.102)","Momentum (0.050)","Adam (0.022)","RMSprop (0.001)"],"a":3,"e":"40걸음 뒤 손실: SGD 0.102 · Momentum 0.050 · Adam 0.022 · RMSprop 0.001. 변수마다 보폭을 나누는 RMSprop이 가장 작은 손실을 기록했다.","src":"요약정리","c":6,"s":1},
  {"t":"mc","q":"조기 종료에서 patience=3, 검증 손실이 에폭 1~7에서 0.62, 0.48, 0.41, 0.39, 0.40, 0.42, 0.41일 때, 학습이 중단되는 에폭과 복원해 사용하는 가중치의 에폭은?","o":["중단 7 / 복원 4","중단 4 / 복원 4","중단 7 / 복원 7","중단 5 / 복원 3"],"a":0,"e":"에폭 4(0.39)가 최저이고 이후 5, 6, 7에폭에서 3회 연속 개선이 없어 7에폭에 중단된다. 마지막(7)이 아니라 가장 좋았던 에폭 4의 가중치를 복원한다.","src":"요약정리","c":6,"s":1},
  {"t":"sa","q":"‘데이터 누출’을 판별하기 위한 질문 3가지(관점)를 쓰시오. 하나라도 ‘아니오’이면 해당 컬럼은 삭제한다.","a":"① 시점 — 예측해야 하는 그 순간에 이미 알 수 있는 정보인가? ② 인과 — 정답이 정해진 뒤에 생겨나는 결과가 아닌가? ③ 재현 — 새 데이터가 들어와도 같은 방식으로 구할 수 있는가?","e":"2주차 실습의 누출 판별 3질문. ‘차단버튼클릭’을 넣으면 정확도 100%, 제거하면 85.7%로 현실적인 성능이 나온다.","src":"요약정리","c":1,"s":1},
  {"t":"sa","q":"학습 시작 전에 개발자가 외부에서 미리 정하는 값과, 모델이 데이터를 풀며 스스로 바꾸는 값을 각각 무엇이라 하는가? 예도 하나씩 쓰시오.","a":"하이퍼파라미터(예: learning_rate, max_depth, degree) / 매개변수(예: w, b, 회귀계수)","e":"매개변수(Parameter)는 내부 세계에서 모델이 학습으로 조정하고, 하이퍼파라미터는 외부 세계에서 개발자가 사전에 설정하는 지침이다.","src":"요약정리","c":2,"s":1},
  {"t":"sa","q":"스팸 메일 필터와 암 진단에서 각각 더 중요하게 보는 분류 평가지표를 쓰고, 두 지표의 조화평균 지표 이름을 쓰시오.","a":"스팸 필터 = 정밀도(Precision, FP 줄이기), 암 진단 = 재현율(Recall, FN 줄이기), 조화평균 = F1 점수","e":"정상 메일을 차단(오탐, FP)하면 안 될 때는 정밀도, 환자를 정상으로 놓침(FN)이 치명적일 때는 재현율을 본다.","src":"요약정리","c":2,"s":1},
  {"t":"sa","q":"특징이 늘수록 공간이 너무 방대해져 데이터가 고립되고 거리 개념이 붕괴되는 현상의 이름은? 또, 몸무게(kg)와 꼬리 길이(mm)처럼 단위가 다른 특징을 거리 기반 알고리즘에 넣기 전에 해야 할 전처리와 그 결과를 쓰시오.","a":"차원의 저주(Curse of Dimensionality) / 표준화(StandardScaler, Z-score) — 각 특징을 평균 0, 표준편차 1로 맞춰 동등한 잣대로 거리 계산","e":"표준화하지 않으면 숫자가 큰 특징(몸무게)이 거리 계산을 지배하고 꼬리 길이는 무시된다.","src":"요약정리","c":3,"s":1},
  {"t":"sa","q":"PCA를 적용하는 4단계 파이프라인을 순서대로 쓰시오.","a":"① 중심화 및 표준화 → ② 공분산 계산 → ③ 축 선택(고유값이 큰 순서대로 고유벡터 정렬) → ④ 투영(Transform)","e":"Σv = λv 에서 가장 큰 고유값의 고유벡터가 PC1이다.","src":"요약정리","c":3,"s":1},
  {"t":"sa","q":"신경망에서 ReLU 함수의 식을 쓰고, 은닉층에서 널리 쓰이는 이유를 두 가지 쓰시오.","a":"ReLU(z) = max(0, z). 이유: ① 양수 구간에서 기울기 1을 그대로 통과시켜 깊은 망에서도 신호(기울기)가 사라지지 않는다(기울기 소실 완화) ② 연산이 매우 빠르다.","e":"단점은 ‘죽은 ReLU’(입력이 계속 음수면 기울기 0). 보완: Leaky ReLU.","src":"요약정리","c":4,"s":1},
  {"t":"sa","q":"연쇄 법칙을 이용해 u = 3x, L = u² 일 때 x = 2에서의 dL/dx 를 구하시오. (과정 포함)","a":"u = 6, dL/du = 2u = 12, du/dx = 3 → dL/dx = 12 × 3 = 36","e":"직접 L = 9x² 을 미분한 18x = 36 과 같다.","src":"요약정리","c":5},
  {"t":"sa","q":"한 은닉 뉴런 모형 z = wx + b → h = σ(z) → ŷ = vh → L 에서 첫 가중치 w의 기울기 ∂L/∂w 를 연쇄 법칙으로 쓰고, 5장 실습 셀 3에서 구한 값을 쓰시오.","a":"∂L/∂w = (∂L/∂ŷ)(∂ŷ/∂h)(∂h/∂z)(∂z/∂w) = (−0.3775)(1.0)(0.2350)(1.0) = −0.088723","e":"코드: grad = dL_dyhat*dyhat_dh*dh_dz*dz_dw. 수치 미분(중앙 차분)으로 검산한 값과 같다.","src":"요약정리","c":5,"s":1},
  {"t":"sa","q":"ReLU 계열에 쓰는 He 초기화와 시그모이드·tanh 계열에 쓰는 Xavier 초기화의 분산 공식을 각각 쓰시오.","a":"He: Var(w) = 2 / n_in (ReLU 계열) / Xavier: Var(w) = 2 / (n_in + n_out) (시그모이드·tanh 계열)","e":"목표는 층을 지나도 신호의 분산이 크게 변하지 않게 하여 신호가 사라지거나 폭발하지 않게 하는 것.","src":"요약정리","c":6,"s":1},
  {"t":"sa","q":"학습 로그에서 ‘훈련 loss는 계속 감소하는데 검증 loss는 증가’하는 증상의 원인과 처방 3가지를 쓰시오.","a":"원인: 과적합(훈련 자료의 우연한 패턴까지 외움) / 처방: L2(또는 L1) 규제, 드롭아웃, 조기 종료","e":"참고: 앞쪽 층 기울기≈0·loss 정체 = 기울기 소실(ReLU+He), loss 급증/NaN = 기울기 폭발(학습률↓), 들쭉날쭉·느린 감소 = 모멘텀·Adam.","src":"요약정리","c":6,"s":1},
  {"t":"bl","q":"좋은 학습 문제 설계의 3기둥: (A) 누구/무엇을 하나의 사례로 볼 것인가, (B) 언제까지의 정보로 언제의 결과를 예측하는가, (C) 모델이 무엇을 출력하는가.","a":"(A) 대상(Target) (B) 시점(Timing) (C) 출력(Output)","e":"2주차 슬라이드 ‘좋은 학습 문제를 설계하는 3가지 기둥’.","src":"요약정리","c":1},
  {"t":"bl","q":"K-means의 4단계는 1. (A) → 2. (B) → 3. 확인 → 4. 종료 이며, 확인에서 변화가 있으면 (C)단계로 돌아간다.","a":"(A) 배정 (B) 갱신 (C) 1단계(배정)","e":"가까운 깃발에 배정 → 중심을 다시 계산 → 아직 움직이는가? → 멈추면 군집 완성.","src":"요약정리","c":3},
  {"t":"bl","q":"데이터는 훈련 (A)% / 검증 (B)% / 테스트 15%로 분할하며, 테스트 데이터는 마지막 최종 평가에서 단 (C)번만 사용한다.","a":"(A) 70 (B) 15 (C) 한(1)","e":"문제집(70) · 모의고사(15) · 봉인된 수능 시험지(15).","src":"요약정리","c":2},
  {"t":"bl","q":"경사하강법의 가중치 수정식: w_new = w_old − (A) · (B) , 여기서 (A)가 너무 크면 최솟값을 지나치고 너무 작으면 학습이 느리다.","a":"(A) η (학습률) (B) ∂L/∂w (손실의 기울기)","e":"기울기의 반대 방향으로 한 걸음 이동한다.","src":"요약정리","c":5},
  {"t":"bl","q":"PCA에서 공분산 행렬 Σ, 고유벡터 v, 고유값 (A)에 대해 Σv = (A)v 이며, (A)가 가장 큰 고유벡터가 제(B)주성분(PC1)이다.","a":"(A) λ(람다, 고유값) (B) 1","e":"고유벡터=최적의 투영 각도(새로운 축 방향), 고유값=그 축이 설명하는 분산의 크기.","src":"요약정리","c":3},
  {"t":"bl","q":"순전파: Z₁ = (A) , A₁ = (B)(Z₁), Z₂ = A₁W₂ + b₂, ŷ = sigmoid(Z₂). 행렬곱 (N×M)·(M×K) 에서 안쪽 차원 (C)이 일치해야 한다.","a":"(A) XW₁ + b₁ (B) ReLU (C) M","e":"순전파 = 가중합 → 활성화 → 다음 층 전달 → 최종 출력의 반복.","src":"요약정리","c":4},
  {"t":"bl","q":"역전파에서 첫 가중치의 기울기 ∂L/∂w = (∂L/∂ŷ)(∂ŷ/∂h)( (A) )( (B) ) 이며, 셀 3에서 시그모이드 미분 ∂h/∂z = h(1−h) 의 값은 (C)이었다.","a":"(A) ∂h/∂z (B) ∂z/∂w (C) 0.2350","e":"dh_dz = 0.6225 × (1−0.6225) ≈ 0.2350 (시그모이드 미분의 최대는 0.25).","src":"요약정리","c":5},
  {"t":"bl","q":"XOR MLP 실습에서 학습 전 손실 0.6994는 ln (A) ≈ 0.6931에 가까운 ‘모르는 상태’이며, 5000번 학습 후 최종 손실은 (B)이고, 학습률 (C)일 때 가장 잘 학습되었다.","a":"(A) 2 (B) 0.0019 (C) 1.0","e":"lr 0.01 → 손실 0.694(정확도 50%), lr 1.0 → 0.0019(100%), lr 200 → 43.44(50%).","src":"요약정리","c":5},
  {"t":"bl","q":"Adam의 기본값은 학습률 η = (A), β₁ = 0.9, β₂ = (B) 이며, Adam은 (C)(방향)과 RMSprop(보폭)을 결합한 방법이다.","a":"(A) 0.001 (B) 0.999 (C) 모멘텀","e":"m = 기울기의 평균적 방향(모멘텀), v = 기울기 제곱의 평균적 규모(RMSprop). 초반 0에서 출발한 값을 보정(m̂, v̂).","src":"요약정리","c":6},

    {t:"mc", c:1, src:"퀴즈", q:"소스 제어 패널에 버튼이 두 개 보인다. 눌러야 할 것과 그 이유로 옳은 것은?", o:["아래 Publish to GitHub — 저장소 생성 · 첫 커밋 · 업로드가 한 번에 끝나니까","둘 중 아무거나 — 결과는 같다","위 Initialize Repository — 저장소를 만드는 버튼이니까"], a:0, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"실수로 위쪽 Initialize Repository 를 눌렀다. 슬라이드가 안내하는 복구 방법은?", o:["VS Code 를 닫고 → 숨김 파일을 켜서 .git 폴더만 지우고 → 폴더를 다시 연다","GitHub 웹에서 저장소를 만들어 연결한다","폴더를 지우고 압축파일을 다시 푼다"], a:0, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"위쪽 Initialize Repository 를 먼저 눌렀을 때 생기는 문제로 슬라이드가 드는 것은?", o:["GitHub 계정이 잠긴다","브랜치 이름 맞추기와 첫 커밋이 건너뛰어져, 윈도우에서는 브랜치가 master 로 만들어지고 10 장 자동 실행이 돌지 않는다","메인 폴더의 파일이 전부 지워진다"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:".gitignore 를 받은 압축파일에서 복사하지 않고 직접 만들게 하는 이유는?", o:["파일을 복사하면 커밋이 되지 않기 때문에","압축파일 안의 .gitignore 는 내용이 다르기 때문에","틀려도 아무 오류를 내지 않는 파일이라, 무엇을 막고 있는지 보고 넘어가야 하기 때문에"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:".env 가 아직 없는 1 장에서 .gitignore 를 먼저 만드는 이유는?", o:[".env 파일을 자동으로 만들어 주기 때문에","토큰이 생기기 전에 방어막을 세우려고 — 한 번 커밋되면 GitHub 이력에 남아 되돌릴 수 없다",".gitignore 가 있어야 저장소를 만들 수 있어서"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"저장소를 만들기 전에 git config 로 이름과 이메일을 설정해 두는 이유는?", o:["GitHub 로그인을 대신해 주기 때문에","커밋에는 누가 했는지가 함께 기록되기 때문에 — 안 하면 Author identity unknown 으로 막힌다","저장소 이름이 그 이름으로 만들어지기 때문에"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"메인 프로젝트 폴더 이름을 영문·숫자로 지으라고 하는 이유는?", o:["한글 폴더에서는 파이썬이 실행되지 않아서","한글 이름은 GitHub 에서 검색되지 않아서","폴더 이름이 저장소 이름으로 그대로 제안되는데, 한글은 한 글자당 하이픈 하나로 바뀌어서"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"커밋 메시지를 적지 않고 Commit 버튼을 먼저 누르면 어떻게 되는가?", o:["메시지 없이 그대로 커밋된다","커밋이 취소되고 아무 일도 일어나지 않는다","COMMIT_EDITMSG 가 열리고 소스 제어 패널이 잠긴 것처럼 보인다 — Git 이 기다리는 중이다"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"1 장에서 GitHub 저장소부터 만들어 두는 이유는?", o:["코드를 잃어버렸을 때 복구하려고","과제 제출을 GitHub 으로 받기 때문에","10 장에서 GitHub 가 내 코드를 대신 실행하려면 그 코드가 거기 있어야 하기 때문에"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"받은 watchlist.csv 를 열어 본 내용이다. 첫 줄 code,name 의 역할은?", k:"code,name\n005930,삼성전자\n000660,SK하이닉스\n005380,현대자동차", o:["첫 번째 종목","각 열의 이름(제목 줄)","파일 형식 표시"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:".gitignore 를 열면 맨 위에 아래 세 줄이 있다. 이것이 뜻하는 것은?", k:"# 비밀정보 — 절대 커밋하지 말 것. 한 번 커밋되면 GitHub 이력에 남아 되돌릴 수 없고,\n# 지금 private 이어도 나중에 public 으로 바꾸는 순간 그대로 공개된다.\n.env", o:[".env 파일을 자동으로 만들어 준다",".env 파일을 GitHub 에 올리지 않는다",".env 파일을 삭제한다"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"학기말까지의 로드맵에 있는 기능이 아닌 것은?", o:["봇이 내 폰에 말을 건다","종가가 DB 에 쌓인다","가만히 있어도 원하는 정보가 온다 (자동 실행)","핸드폰에서는 정보 확인이 불가능하다"], a:3, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"터미널에 아래 두 줄을 차례로 쳤다. 첫 줄과 둘째 줄이 각각 하는 일은?", k:"git config --global user.name\ngit config --global user.name \"hong-gildong\"", o:["첫 줄은 이름을 지우고, 둘째 줄은 이름을 넣는다","첫 줄은 지금 설정된 이름을 확인하고, 둘째 줄은 이름을 설정한다","둘 다 같은 일을 한다"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"직접 만든 .gitignore 의 앞부분이다. 이 목록 때문에 2 장에서 .env 를 만들고 나서 소스 제어 패널에서 보게 되는 것은?", k:"# 비밀정보 — 절대 커밋하지 말 것\n.env\n.env.*\n!.env.example\n*token*.txt\n*secret*", o:["Changes 목록에 .env 가 뜨지만 커밋은 되지 않는다","Changes 목록에 .env 가 아예 뜨지 않는다",".env 를 저장할 때마다 경고 창이 뜬다"], a:1, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"같은 .gitignore 의 전체 내용이다. 이 파일이 GitHub 에 올라가지 못하게 막는 것이 아닌 것은?", k:".env\n.env.*\n!.env.example\n*token*.txt\n*secret*\n__pycache__/\n*.pyc\n*.docx\n*.pptx\n*.pdf\n*.jpg\n*.jpeg\n*.png", o:[".env","__pycache__/ 폴더","watchlist.csv"], a:2, e:""},
    {t:"mc", c:1, src:"퀴즈", q:"1 장에서 갖추는 개발 환경의 선후 관계를 설명한 것 중 잘못된 것은?", o:["Git 프로그램이 깔려 있어야 VS Code 소스 제어의 Publish to GitHub 가 동작한다","VS Code 를 설치해야 그 안에 확장 Python(게시자 Microsoft)을 설치할 수 있다","Git 을 설치한 직후 VS Code 가 켜져 있어도 소스 제어가 바로 Git 을 찾는다"], a:2, e:"설치한 뒤에는 VS Code를 껐다 켜야 Git을 찾는다."},
    {t:"sa", c:1, src:"퀴즈", q:"터미널에 그대로 치는 아래 한 줄로 설치되는 라이브러리는 모두 몇 개인가?", k:"pip install requests python-dotenv pandas matplotlib holidays streamlit libsql-client", a:"7개", e:"13장 동안 이 설치는 한 번뿐."},
    {t:"sa", c:1, src:"퀴즈", q:"13 장 뒤 텔레그램으로 오게 될 메시지다. 빈칸에 들어갈 것은?", k:"📈 삼성전자 ( ______ )\n    208,500원 🔺 +1.24%", a:"종목코드 005930", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"VS Code 왼쪽 탐색기에서 새 파일을 만들고 이름을 `gitignore`라고 쳤다. 무엇이 잘못됐는가?", a:"맨 앞의 점(.)이 빠졌다. 이름은 .gitignore여야 한다", e:"점이 없으면 Git이 목록으로 인식하지 않는다."},
    {t:"sa", c:1, src:"퀴즈", q:"맥에서 `git --version`을 쳤더니 버전 숫자 대신 설치 안내 창이 떴다. 어떻게 해야 하는가?", a:"안내 창에서 Xcode Command Line Tools를 설치한다 (설치 후 VS Code 재시작)", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"이 프로젝트가 지나가는 다섯 칸을 순서대로 나열하시오.\n㉠ 시각화 ㉡ 수집 ㉢ 확인 ㉣ 가공 ㉤ 저장", a:"㉡ → ㉤ → ㉣ → ㉠ → ㉢", e:"수집 → 저장 → 가공 → 시각화 → 확인."},
    {t:"sa", c:1, src:"퀴즈", q:"단계와 기술을 짝지으시오.\n(1) 수집 (2) 저장 (3) 시각화 (4) 확인\n㉠ matplotlib ㉡ 네이버 금융 API ㉢ Turso DB ㉣ 텔레그램 봇 · Streamlit 대시보드", a:"(1)-㉡ (2)-㉢ (3)-㉠ (4)-㉣", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"VS Code 에서 내 GitHub 저장소를 만드는 다섯 단계를 순서대로 나열하시오.\n㉠ 아래 public 을 마우스로 클릭한다\n㉡ 소스 제어 패널을 열어 아래 Publish to GitHub 를 누른다\n㉢ VS Code 로 메인 폴더를 열고 '신뢰함'을 고른다\n㉣ 로그인 창에서 승인한다\n㉤ 저장소 이름이 영문·숫자인지 확인한다", a:"㉢ → ㉡ → ㉤ → ㉠ → ㉣", e:"폴더 열기 → Publish → 이름 확인 → public → 승인."},
    {t:"sa", c:1, src:"퀴즈", q:"실수로 Initialize Repository 를 눌렀을 때의 복구 세 단계를 순서대로 나열하시오.\n㉠ 숨김 파일을 켜고 .git 폴더만 지운다\n㉡ 폴더를 다시 연다\n㉢ VS Code 를 닫는다", a:"㉢ → ㉠ → ㉡", e:"순서를 틀리면 복구되지 않는다."},
    {t:"sa", c:1, src:"퀴즈", q:"2 장부터 매 장마다 반복하는 다섯 단계를 순서대로 나열하시오.\n㉠ 파란 Commit 버튼을 누른다\n㉡ 그 장의 zip 을 풀어 메인 폴더에 덮어쓴다\n㉢ 버튼이 Sync Changes 로 바뀌면 한 번 더 누른다\n㉣ 소스 제어 패널을 열어 바뀐 파일 목록을 확인한다\n㉤ 맨 위 입력칸에 커밋 메시지를 쓴다", a:"㉡ → ㉣ → ㉤ → ㉠ → ㉢", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"이번 장에서 Git 관련으로 하는 네 가지를 순서대로 나열하시오.\n㉠ Publish to GitHub 를 누른다\n㉡ Git 프로그램을 설치한다\n㉢ git config 로 이름과 이메일을 설정한다\n㉣ VS Code 를 껐다 켠다", a:"㉡ → ㉣ → ㉢ → ㉠", e:"설치 후 VS Code를 재시작해야 소스 제어가 Git을 찾는다."},
    {t:"sa", c:1, src:"퀴즈", q:"버튼과 하는 일을 짝지으시오.\n(1) Initialize Repository (2) Publish to GitHub (3) Commit (4) Sync Changes\n㉠ '여기까지 됐다'고 내 컴퓨터에 도장을 찍는다\n㉡ 내 컴퓨터 안에만 저장소를 만든다\n㉢ 커밋한 것을 GitHub 으로 올려 원격과 로컬을 맞춘다\n㉣ 저장소 생성 · 첫 커밋 · 업로드를 한 번에 한다", a:"(1)-㉡ (2)-㉣ (3)-㉠ (4)-㉢", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"증상과 원인을 짝지으시오.\n(1) Author identity unknown (2) 저장소 이름이 하이픈 범벅 (3) Publish to GitHub 버튼이 없다 (4) 로그인 창이 두 번 뜬다\n㉠ 메인 폴더 이름에 한글 ㉡ git config 미설정 ㉢ 윈도우에서는 원래 그렇다 ㉣ 신뢰를 주지 않아 제한 모드", a:"(1)-㉡ (2)-㉠ (3)-㉣ (4)-㉢", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 윈도우에서 `python --version`을 쳤더니 python 을 찾을 수 없다고 나온다. 원인과 조치는?", a:"원인 — 설치 화면의 Add python.exe to PATH 체크를 하지 않았다 / 조치 — 그 체크박스를 켜고 Python을 다시 설치한다", e:"맥에서 같은 증상이면 명령 이름이 python3이다."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] `pip install -r requirements.txt`를 쳤더니 그런 파일이 없다며 실패한다. 원인과 조치는?", a:"원인 — 1장 누적본에는 requirements.txt가 없다(2장부터) / 조치 — 라이브러리 이름을 나열해 한 번에 설치한다", e:"pip install requests python-dotenv pandas matplotlib holidays streamlit libsql-client"},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] `git --version`을 쳤더니 git 을 찾을 수 없다고 나온다. 그대로 두면 무엇이 막히고 어떻게 조치하는가?", a:"원인 — Git 미설치 → Publish to GitHub 버튼이 아예 나타나지 않는다 / 조치 — 윈도우 Git for Windows, 맥 Xcode Command Line Tools 설치 후 VS Code를 껐다 켠다", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 저장소 이름을 친 뒤 그냥 엔터를 쳤더니 private 이다. 왜 그렇고 앞으로 무엇이 달라지는가?", a:"원인 — 위 private이 기본 선택 / 조치 — 수업은 진행 가능, 12장 배포 때 권한 승인 단계가 하나 더 있다. 바꾸려면 Settings 맨 아래에서 public으로 전환", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] Publish to GitHub 를 눌렀더니 Author identity unknown / Please tell me who you are 가 뜬다. 원인과 조치는?", a:"원인 — Git에 이름·이메일을 알려주지 않았다 / 조치 — git config --global user.name \"아이디\", git config --global user.email \"이메일\"", e:"이메일은 GitHub 계정 이메일과 같게."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 소스 제어 패널에 두 버튼이 없고 Manage Workspace Trust 만 보인다. 원인과 조치는?", a:"원인 — 폴더를 열 때 신뢰를 주지 않아 제한 모드 / 조치 — Manage Workspace Trust에서 신뢰함 선택", e:"그래도 없으면 Git 미설치."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 저장소를 브라우저로 열어 봤더니 이름이 ---------- 이다. 원인과 조치는?", a:"원인 — 메인 폴더 이름이 한글 / 조치 — Settings → Repository name에서 영문으로 Rename, VS Code에서 폴더를 다시 열어 Sync 확인", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 소스 제어 패널에서 위쪽 Initialize Repository 를 눌러 버렸다. 무엇이 잘못됐고 어떻게 되돌리는가?", a:"원인 — 내 컴퓨터에만 저장소를 만들어 GitHub 작업·첫 커밋이 건너뛰어짐(윈도우는 master 브랜치 → 10장 자동 실행 안 됨) / 조치 — VS Code 닫기 → .git 폴더만 삭제 → 폴더 다시 열기", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 2 장에서 .env 를 만들었더니 Changes 목록에 .env 가 보인다. 원인과 조치는?", a:"원인 — .gitignore가 없거나 이름·내용이 잘못됨 / 조치 — 커밋 전에 .gitignore의 파일 이름과 .env 줄을 확인해 고친다", e:"한 번 커밋되면 이력에 남는다."},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] 맥 Finder 로 메인 폴더를 열었는데 방금 만든 .gitignore 가 안 보인다. 원인과 조치는?", a:"원인 — 맥은 점으로 시작하는 파일을 숨긴다 / 조치 — Finder에서 ⌘⇧. 을 누르거나 VS Code 탐색기에서 확인", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] Commit 을 눌렀더니 COMMIT_EDITMSG 가 열리고 패널이 먹통이다. 원인과 조치는?", a:"원인 — 메시지 없이 Commit을 눌러 Git이 기다리는 중 / 조치 — 1번 줄에 메시지 → 저장 → 탭 닫기", e:""},
    {t:"sa", c:1, src:"퀴즈", q:"[증상] Commit 을 눌러 Changes 목록이 비었는데 GitHub 에는 반영되지 않았다. 원인과 조치는?", a:"원인 — Sync Changes를 누르지 않아 원격에 안 감 / 조치 — Sync Changes를 한 번 더 누르고 OK", e:""},

    // ═════════ 2장 퀴즈 ═════════
    {t:"ox", c:2, src:"퀴즈", q:"텔레그램 앱 설치와 계정 만들기는 2 장 대면 수업 시간에 다 같이 하므로 미리 해 둘 필요가 없다.", a:"X", e:"2장 실습 사전 과제. 대면 수업은 봇 만들기부터 시작."},
    {t:"ox", c:2, src:"퀴즈", q:"requirements.txt 에 이름을 적어 두기만 하면 그 라이브러리가 자동으로 설치된다.", a:"X", e:"적는 것과 설치는 별개."},
    {t:"ox", c:2, src:"퀴즈", q:"notify_stock_price.py 는 이번 장에 처음 생겨서 13 장까지 계속 자라는 파일이다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:".gitignore 에 적어 두면 이미 GitHub 에 올라간 .env 도 자동으로 내려온다.", a:"X", e:"이미 올라간 파일은 되돌려 주지 않는다."},
    {t:"ox", c:2, src:"퀴즈", q:".env 를 만든 뒤 소스 제어 패널의 커밋 대상 목록에 .env 가 뜨지 않는다면, .gitignore 가 제 일을 하고 있다는 뜻이다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"토큰이 한 번 커밋되면, 나중에 그 파일을 지우고 다시 커밋해도 GitHub 이력에는 값이 그대로 남는다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"토큰이 노출됐다면 봇을 지우고 새로 만들어야 하며 TELEGRAM_CHAT_ID 도 다시 알아내야 한다.", a:"X", e:"/revoke로 토큰만 바꾸면 된다. CHAT_ID는 그대로."},
    {t:"ox", c:2, src:"퀴즈", q:"봇의 표시 이름(name)은 남과 겹쳐도 되지만, username 은 겹치면 안 되고 bot 으로 끝나야 한다.", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"토큰은 아이디와 함께 써야 봇을 조종할 수 있으므로, 토큰만 알아서는 아무것도 할 수 없다.", a:"X", e:"아이디를 따로 묻지 않는다. 값을 아는 사람이 곧 주인."},
    {t:"ox", c:2, src:"퀴즈", q:"telebot.py 를 실행했는데 'result': [] 만 나오면 토큰이 잘못된 것이므로 봇을 다시 만들어야 한다.", a:"X", e:"받은 메시지가 0건이라는 뜻."},
    {t:"ox", c:2, src:"퀴즈", q:"telebot.py 는 CHAT_ID 를 알아낸 뒤에도 매 장마다 한 번씩 실행해야 한다.", a:"X", e:"1회용. .env에 적고 나면 다시 쓸 일 없다."},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄은 .env 에 그 이름의 키가 없으면 프로그램을 오류로 멈춘다.", k:"TELEGRAM_BOT_TOKEN = os.environ.get(\"TELEGRAM_BOT_TOKEN\")", a:"X", e:"키가 없으면 None."},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄이 만드는 주소 안에는 내 토큰이 그대로 들어간다.", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"O", e:"그래서 주소째로 공개되면 안 된다."},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄에서 getUpdates 자리는 '기능(함수) 이름'이라, 메시지를 보낼 때는 이 조각만 sendMessage 로 바뀐다.", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"아래 딕셔너리에서 chat_id 는 '누구에게' 보낼지를 정하는 값이다.", k:"data = {\"chat_id\": TELEGRAM_CHAT_ID, \"text\": text, \"parse_mode\": \"HTML\"}", a:"O", e:""},
    {t:"ox", c:2, src:"퀴즈", q:"아래 줄의 timeout=15 는 '실패하면 15 번까지 다시 보낸다'는 뜻이다.", k:"response = requests.post(url, data=data, timeout=15)", a:"X", e:"15초까지만 기다린다."},
    {t:"mc", c:2, src:"퀴즈", q:"이번 장의 작업을 마친 뒤 소스 제어 패널에서 해야 하는 일은?", o:["메시지를 쓰고 Commit 을 누른 뒤, Sync Changes 로 바뀐 버튼을 한 번 더 누른다","2 장에서는 아직 올리지 않고 3 장에서 한 번에 올린다","Commit 만 누르면 GitHub 까지 올라간다"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:".env 를 만들었더니 소스 제어 패널의 커밋 대상 목록에 .env 가 떴다. 이것이 뜻하는 것은?", o:[".env 파일 이름이 잘못됐다는 뜻이다","정상이다 — 커밋해도 .gitignore 가 알아서 걸러 준다",".gitignore 가 메인 폴더에 없거나 잘못 적혀 있다 — 이대로 커밋하면 토큰이 GitHub 으로 간다"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"이번 장에 새로 생기는 파일이 아닌 것은?", o:["notify_stock_price.py","telebot.py","watchlist.csv","requirements.txt"], a:2, e:"watchlist.csv는 1장 압축파일에 이미 있었다."},
    {t:"mc", c:2, src:"퀴즈", q:"파일 이름이 telegram 이 아니라 notify_stock_price 인 이유로 옳은 것은?", o:["이번 장에서만 쓰는 임시 파일이기 때문에","텔레그램 말고 다른 메신저도 쓰기 때문에","학기 끝에는 이 파일이 주가 알림 전체를 맡기 때문에"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"10 장에서 GitHub 가 requirements.txt 를 읽어 대신 설치할 때 쓰는 명령은?", o:["pip install -r requirements.txt","python requirements.txt","pip install requests python-dotenv"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:".env 를 만드는 가장 안전한 방법은?", o:["아무 파일이나 만들고 확장자를 지운다",".env.example 을 복사해 이름만 .env 로 바꾼다","메모장으로 새 파일을 만들어 .env 로 저장한다"], a:1, e:"메모장은 .env.txt가 될 수 있다."},
    {t:"mc", c:2, src:"퀴즈", q:".gitignore 의 !.env.example 한 줄이 뜻하는 것은?", o:[".env.example 을 지워라",".env.example 만은 예외로 올려도 된다",".env.example 도 절대 올리지 마라"], a:1, e:"본보기라 비밀이 아니다."},
    {t:"mc", c:2, src:"퀴즈", q:"토큰이 노출됐을 때의 올바른 조치는?", o:["@BotFather 에서 /revoke 로 새 토큰을 발급받아 .env 에 갈아끼운다","저장소를 private 으로 바꾸고 그대로 둔다","커밋 이력을 손봐서 값을 지운다"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"슬라이드가 든 토큰 노출 경로가 아닌 것은?", o:["편집기에서 .env 를 열어 둔 채 파일을 저장하는 것","제출 스크린샷에 .env 내용이 같이 찍히는 것",".env 를 선택해 둔 채 AI 도구를 쓰는 것","화면 공유·녹화 중에 .env 편집 화면이 찍히는 것"], a:0, e:"저장하는 것 자체는 노출이 아니다."},
    {t:"mc", c:2, src:"퀴즈", q:"봇 username 이 계속 거절될 때의 해결로 옳은 것은?", o:["bot 을 빼고 다시 시도한다","학번이나 이름을 넣어 고유하게 만든다","표시 이름을 짧게 줄인다"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"응답에서 TELEGRAM_CHAT_ID 를 찾아가는 경로로 옳은 것은?", o:["result → message → chat → id","ok → chat → id","result → message → from → id"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"telebot.py 를 실행하기 전에 반드시 해야 하는 일은?", o:[".gitignore 에 telebot.py 를 추가한다","requirements.txt 로 라이브러리를 다시 설치한다","텔레그램에서 내 봇에게 아무 메시지나 하나 보낸다"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"실행화면에 <Response [200]> 과 {'ok': True, 'result': []}만 나왔을 때 해야 할 일은?", o:["토큰을 재발급받는다","봇에게 메시지를 하나 보내고 다시 실행한다","봇을 다시 만든다"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"실행화면에 <Response [401]> 만 떴다. 이 숫자가 알려 주는 것은?", o:["토큰을 아예 못 읽었다","토큰은 읽었는데 값이 틀렸다","받은 메시지가 없다"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"실행화면에 <Response [404]> 만 떴을 때 가장 먼저 볼 곳은?", o:[".env 파일 이름·위치와 키 이름을 확인한다","BotFather 에서 토큰을 다시 복사한다","인터넷 연결을 확인한다"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 빈칸에 들어갈 기능 이름은? (메시지를 보내려는 코드다)", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/______\"", o:["sendMessage","newbot","getUpdates"], a:0, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 빈칸에 들어갈 것은?", k:"response = requests.______(url, data=data, timeout=15)", o:["send","get","post"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 줄이 돌려주는 값의 종류는?", k:"return response.status_code == 200", o:["상태 코드 숫자(200, 401 …)","True 또는 False","응답 원문 문자열"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 호출부에서 ‘텔레그램으로 메시지를 전송했습니다!’가 찍히는 조건은?", k:"if send_telegram_message(\"안녕하세요! 제 봇이 보낸 첫 메시지입니다\"):\n    print(\"✅ 텔레그램으로 메시지를 전송했습니다!\")\nelse:\n    print(\"❌ 메시지 전송에 실패했습니다. 토큰과 CHAT_ID를 다시 확인해 주세요.\")", o:["폰에 알림이 도착했을 때","send_telegram_message 함수가 True 를 돌려줬을 때(= 텔레그램이 200 을 돌려줬을 때)","인터넷이 연결돼 있을 때"], a:1, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"아래 except 블록이 하는 일로 옳은 것은?", k:"except Exception as e:\n    print(f\"❌ 텔레그램 메시지 전송 중 오류 발생: {e}\")\n    return False", o:["프로그램을 즉시 종료한다","오류를 무시하고 True 를 돌려준다","이유를 화면에 찍고 False 를 돌려준다"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"폰에 알림이 안 왔을 때 가장 먼저 볼 곳은?", o:["@BotFather 대화창","텔레그램 앱","코드를 실행한 터미널"], a:2, e:""},
    {t:"mc", c:2, src:"퀴즈", q:"윈도우에서 UnicodeEncodeError 가 났다. 무엇이 원인인가?", o:["토큰이 틀렸다","코드에 오타가 있다","터미널이 이모지를 표현하지 못하는 인코딩 문제다"], a:2, e:""},
    {t:"sa", c:2, src:"퀴즈", q:".env 에 적어야 하는 키 이름 두 개를 대소문자까지 정확히 쓰시오.", a:"TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID", e:""},
    {t:"sa", c:2, src:"퀴즈", q:".gitignore 에 이미 적혀 있는, 비밀정보를 막는 세 줄을 쓰시오.", a:".env\n.env.*\n!.env.example", e:"!는 예외."},
    {t:"sa", c:2, src:"퀴즈", q:"TELEGRAM_BOT_TOKEN 이 123456789:AAH 라고 할 때, 아래 줄이 실제로 만드는 주소를 쓰시오.", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"https://api.telegram.org/bot123456789:AAH/getUpdates", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"아래 주소를 '메시지를 보내는' 주소로 바꾸려면 어느 부분을 무엇으로 바꿔야 하는가?", k:"url = f\"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/getUpdates\"", a:"마지막 getUpdates를 sendMessage로", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"아래 출력에서 .env 에 TELEGRAM_CHAT_ID 로 적어야 할 숫자와 그 경로를 쓰시오.", k:"{'ok': True, 'result': [{'update_id': 870512345, 'message':\n  {'message_id': 12, 'from': {'id': 987654321, 'is_bot': False, 'first_name': '길동'},\n   'chat': {'id': 123456789, 'first_name': '길동', 'type': 'private'},\n   'date': 1757030400, 'text': '안녕'}}]}", a:"123456789 / result → message → chat → id", e:"from의 id가 아니다."},
    {t:"sa", c:2, src:"퀴즈", q:"`load_dotenv()` 한 줄이 하는 일을 말로 쓰시오.", a:"같은 폴더의 .env 파일 내용을 환경 변수로 불러온다", e:"그다음 os.environ.get()으로 값을 꺼낸다."},
    {t:"sa", c:2, src:"퀴즈", q:"아래 한 줄이 하는 일과, .env 에 그 키가 없을 때 들어가는 값을 쓰시오.", k:"TELEGRAM_BOT_TOKEN = os.environ.get(\"TELEGRAM_BOT_TOKEN\")", a:"환경 변수에서 TELEGRAM_BOT_TOKEN 값을 꺼내 변수에 저장한다 / 없으면 None", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"`return response.status_code == 200`이 무엇을 돌려주는지 쓰시오.", a:"상태 코드가 200이면 True, 아니면 False", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"`requests.post(url, data=data, timeout=15)`의 timeout=15 뜻과 이 줄을 try 안에 넣은 이유를 쓰시오.", a:"15초까지만 기다린다 / 인터넷이 끊기거나 응답이 늦으면 예외가 나서 프로그램이 멈추므로, except로 받아 False를 돌려주려고", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"telebot.py 를 실행했더니 {'ok': True, 'result': []}만 나왔다. 목록을 채우려면 무엇을 해야 하는지 한 문장으로 쓰시오.", a:"텔레그램에서 내 봇에게 아무 메시지나 보낸 뒤 다시 실행한다", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"아래 두 줄 중 값이 제대로 읽히지 않는 것을 고르고 그 이유를 쓰시오.", k:"TELEGRAM_BOT_TOKEN=123456:ABCdef\nTELEGRAM_BOT_TOKEN=“123456:ABCdef”", a:"둘째 줄 — 둥근 따옴표(“ ”)가 벗겨지지 않고 값 안에 그대로 들어간다", e:".env는 따옴표 없이 값만, VS Code로 편집."},
    {t:"sa", c:2, src:"퀴즈", q:".env 가 아니라 .env.txt 로 저장돼 있는지 확인하려면 윈도우와 맥에서 각각 무엇을 켜야 하는가?", a:"윈도우: 탐색기 보기 → 파일 확장명 / 맥: Finder 설정 → 고급 → 모든 파일 확장자 보기", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"notify_stock_price.py 를 실행하는 명령을 맥과 윈도우 각각 쓰시오.", a:"맥: python3 ./notify_stock_price.py / 윈도우: python ./notify_stock_price.py", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"토큰이 노출됐을 때의 조치를 순서대로 쓰시오.", a:"@BotFather → /revoke → 해당 봇 선택 → 새 토큰 발급 → .env에 갈아끼우기", e:"봇 재생성 불필요, CHAT_ID 그대로."},
    {t:"sa", c:2, src:"퀴즈", q:"봇 username 을 지을 때 지켜야 할 조건 두 가지와 예를 하나 쓰시오.", a:"① 남과 겹치면 안 된다(전 세계 유일) ② bot으로 끝나야 한다 / 예: stock_2026001_bot", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"오늘 진행하는 단계를 ⓪부터 ④까지 순서대로 쓰시오.", a:"⓪ 텔레그램 가입 ① 비밀정보 옮기기(.env) ② 봇 만들기 ③ CHAT_ID 알아내기 ④ 메시지 보내기", e:"②③을 건너뛰면 ④가 안 된다."},
    {t:"sa", c:2, src:"퀴즈", q:"아래 두 화면의 차이를 한 문장으로 쓰고, ①에서 ②로 넘어가는 방법을 쓰시오.\n① {'ok': True, 'result': []}\n② {'ok': True, 'result': [{'update_id': 870512345, 'message': …}]}", a:"차이: result 목록이 비었는지(받은 메시지가 있는지) / 방법: 봇에게 메시지 한 통 보내기", e:"코드·토큰·봇은 그대로."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 실행 결과가 <Response [200]> / {'ok': True, 'result': []} 이다. 오류인지 판단하고 원인과 조치를 쓰시오.", a:"오류가 아니다. 원인 — 봇에게 먼저 메시지를 보내지 않아 받은 메시지 0건 / 조치 — 봇에게 아무 말이나 보낸 뒤 다시 실행", e:"봇 재생성·토큰 재발급 금지."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 빈 배열이 나와서 봇을 새로 만들고 토큰도 새로 받았는데 여전히 'result': [] 다. 무엇이 잘못됐는가?", a:"원인 — 빠진 것은 토큰이 아니라 ‘봇에게 말을 거는 단계’ / 조치 — 새 봇 대화방에서 /start 후 아무 말이나 보내고 다시 실행", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 실행 시 <Response [404]> 한 줄만 뜬다. 원인과 조치는?", a:"원인 — 토큰을 아예 못 읽음 / 조치 — .env 이름(.env.txt 아닌지)·위치·키 이름 확인", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 실행 시 <Response [401]> 한 줄만 뜬다. 원인과 조치는?", a:"원인 — .env는 읽었으나 토큰 값이 틀림 / 조치 — @BotFather에서 토큰을 다시 확인해 붙여넣기(둥근 따옴표 의심)", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 404 와 401 을 둘 다 겪은 학생이 \"어차피 토큰 문제니 똑같지 않냐\"고 묻는다. 차이와 고칠 곳을 쓰시오.", a:"404 — .env를 못 읽음(파일 이름·위치·키 이름) / 401 — 토큰 값이 틀림(토큰 값)", e:"404인데 토큰만 다시 붙여넣으면 영원히 안 고쳐진다."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] print(TELEGRAM_BOT_TOKEN)을 넣어 보니 None 이 찍힌다. 가장 흔한 원인과 조치는?", a:"원인 — 파일이 .env.txt로 저장됨 / 조치 — 확장자를 보이게 켜고 .env로 이름 변경", e:".env.example을 복사하는 것이 가장 안전."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 파일 이름·위치·키 이름이 다 맞는데 계속 None 이다. 실행 방법에서 의심할 것과 조치는?", a:"원인 — Code Runner로 실행해 다른 위치 기준으로 .env를 못 찾음 / 조치 — 터미널에서 python 파일이름.py로 직접 실행", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 토큰을 제대로 붙여넣었는데 계속 인증 실패. .env 가 `TELEGRAM_BOT_TOKEN=“123456789:AAHdEfGh”` 이다. 원인과 조치는?", a:"원인 — 둥근 따옴표가 값 안에 들어감 / 조치 — 따옴표를 지우고 값만, VS Code로 편집", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] @BotFather 에서 username 이 계속 이미 사용 중이라고 거절된다. 원인과 조치는?", a:"원인 — username은 전 세계 유일 + bot으로 끝나야 함, 흔한 이름은 이미 사용 중 / 조치 — 학번·이름을 넣어 고유하게", e:"표시 이름은 바꿀 필요 없음."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 윈도우에서 실행했더니 UnicodeEncodeError 가 나며 멈춘다. 원인과 조치는?", a:"원인 — 터미널이 이모지를 표현 못 하는 인코딩 문제 / 조치 — PowerShell: $env:PYTHONIOENCODING=\"utf-8\"; python notify_stock_price.py", e:"cmd는 set PYTHONIOENCODING=utf-8. 맥에서는 안 생긴다."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] 터미널에 ‘❌ 메시지 전송에 실패했습니다. 토큰과 CHAT_ID 를 다시 확인해 주세요.’가 찍혔다. 어디부터 확인하는가?", a:"원인 — send_telegram_message()가 False(200이 아니거나 예외) / 조치 — .env의 토큰과 CHAT_ID 확인", e:"원인을 찾는 곳은 터미널."},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] .env 를 실수로 GitHub 에 올렸다. 파일을 지우고 다시 커밋했더니 목록에서 사라졌다. 해결됐는가?", a:"해결되지 않았다. 원인 — 이전 커밋 이력에 토큰이 남음 / 조치 — @BotFather → /revoke로 새 토큰을 받아 .env에 갈아끼우기", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] .env 를 만들고 소스 제어를 열었더니 Changes 목록에 .env 가 보인다. 커밋해도 되는가?", a:"안 된다. 원인 — .gitignore가 없거나 잘못됨 / 조치 — 커밋 전에 .gitignore 확인·수정. 이미 커밋했다면 /revoke로 토큰 교체", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] Commit 까지 눌렀는데 GitHub 저장소 화면에 이번 장 커밋이 안 보인다. 원인과 조치는?", a:"원인 — Sync Changes를 안 눌러 원격에 안 감 / 조치 — Sync Changes를 누르고 OK 후 새로 고쳐 확인", e:""},
    {t:"sa", c:2, src:"퀴즈", q:"[증상] telebot.py 를 여러 번 실행했지만 CHAT_ID 를 못 찾았다. 실행 순서를 처음부터 쓰시오.", a:"① 텔레그램 앱에서 내 봇 대화방 열기 ② [시작] 또는 /start ③ 아무 글자나 한 번 더 보내기 ④ python ./telebot.py 실행(맥 python3) ⑤ chat의 id를 .env에 TELEGRAM_CHAT_ID로", e:"순서가 반대면 실패."},

    // ═════════ 3장 퀴즈 ═════════
    {t:"ox", c:3, src:"퀴즈", q:"API 는 프로그램이 데이터를 달라고 부르는 창구이고, 이번 장에서 쓰는 주소는 하나뿐이다.", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"네이버 금융 API 를 쓰려면 미리 인증키를 발급받아 .env 에 적어 두어야 한다.", a:"X", e:"비공식 API라 인증키가 필요 없다."},
    {t:"ox", c:3, src:"퀴즈", q:"closePrice 는 장이 열려 있는 동안에만 값이 있고, 장이 마감되면 비어 있다.", a:"X", e:"마감 후에는 그날 종가."},
    {t:"ox", c:3, src:"퀴즈", q:"marketStatus 값이 \"OPEN\"이면 장이 열려 있다는 뜻이다.", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"response.json()은 돌아온 JSON 문자열을 진짜 파이썬 딕셔너리로 바꿔 준다.", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"아래를 실행하면 알아보기 힘든 긴 딕셔너리가 한 덩어리로 쏟아지는데, 이것은 정상이다.", k:"import requests\nurl = \"https://m.stock.naver.com/api/stock/005930/basic\"\nresponse = requests.get(url)\ndata = response.json()\nprint(data)", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"print(data)에는 값이 보이는데 폰에 메시지가 안 오면 토큰·CHAT_ID 를 의심한다.", a:"O", e:"①은 성공했으니 ②(전송) 문제."},
    {t:"ox", c:3, src:"퀴즈", q:"아래 둘째 줄은 <class 'str'>을 찍는다.", k:"print(data[\"closePrice\"])\nprint(type(data[\"closePrice\"]))", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"아래 줄은 446000 을 찍는다.", k:"print(data[\"closePrice\"] * 2)", a:"X", e:"223,000223,000 (문자열 반복)."},
    {t:"ox", c:3, src:"퀴즈", q:"replace(\",\", \"\") 는 콤마를 빈 문자열로 바꿔서 지우는 것이다.", k:"price_str = data[\"closePrice\"].replace(\",\", \"\")  # \"223000\"\nprice = int(price_str)                           # 223000", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"아래 timeout=3 은 '실패하면 3 번까지 다시 요청한다'는 뜻이다.", k:"response = requests.get(url, timeout=3)", a:"X", e:"3초 안에 응답 없으면 끊는다."},
    {t:"ox", c:3, src:"퀴즈", q:"retries 가 2 일 때 아래 반복문은 1 번째 시도와 2 번째 시도, 두 번을 돈다.", k:"for attempt in range(1, retries + 1):", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"아래 줄은 price_str 가 숫자가 아니면 price 에 0 이 담긴다.", k:"price = int(price_str) if price_str.isdigit() else 0", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"price 에 0 이 저장되었을 때 그 값을 그대로 돌려주면 텔레그램에 멀쩡한 가격처럼 표시돼 실패인 줄 아무도 모르기 때문에, 실패하면 None 을 돌려준다.", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"아래 한 줄이 조회 실패를 구분하는 자리다.", k:"info = fetch_naver_current_price(STOCK_CODE)\nif info is None:", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"traded_at 은 조회한 시각이 아니라 그 가격이 체결된 시각이다.", a:"O", e:""},
    {t:"ox", c:3, src:"퀴즈", q:"아래 줄의 콤마는 소수점 아래 자리를 맞추라는 뜻이다.", k:"prefix = f\"{price:,}원\"", a:"X", e:"천 단위 구분."},
    {t:"mc", c:3, src:"퀴즈", q:"API 에 대한 설명으로 옳은 것은?", o:["프로그램이 데이터를 달라고 부르는 창구다","사람이 브라우저로 눈으로 보는 네이버 금융 화면이다","파이썬에만 있는 문법의 이름이다"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"이번 장에서 쓰는 주소에 대한 설명으로 옳은 것은?", k:"https://m.stock.naver.com/api/stock/{code}/basic", o:["종목마다 주소가 따로 있어 종목 수만큼 외워야 한다","주소는 하나뿐이고 {code} 자리에 종목코드를 넣는다","주소는 하나지만 뒤에 인증키를 붙여야 한다"], a:1, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"메시지 둘째 줄(가격과 등락률)을 만드는 데 쓰는 응답 필드 짝으로 옳은 것은?", k:"📈 삼성전자 (005930)\n    208,500원 🔺 +1.24%", o:["localTradedAt, marketStatus","stockName, marketStatus","closePrice, fluctuationsRatio"], a:2, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"response.json() 이 하는 일로 옳은 것은?", o:["JSON 문자열을 파이썬 딕셔너리로 바꾼다","파이썬 딕셔너리를 JSON 문자열로 바꾼다","응답을 .json 파일로 저장한다"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"아래를 실행하면 화면에 나오는 것은?", k:"url = \"https://m.stock.naver.com/api/stock/005930/basic\"\nresponse = requests.get(url)\ndata = response.json()\nprint(data)", o:["종목명과 현재가가 두 줄로 깔끔하게 나온다","아무것도 출력되지 않는다","알아보기 힘든 긴 딕셔너리가 한 덩어리로 쏟아진다"], a:2, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"아래 4 줄 중 네이버에 실제로 요청을 보내는 줄은?", k:"url = \"https://m.stock.naver.com/api/stock/005930/basic\"\nresponse = requests.get(url)\ndata = response.json()\nprint(data)", o:["response = requests.get(url)","data = response.json()","print(data)"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"print(data)에 아무 값도 안 보인다. 어디를 볼 차례인가?", o:[".env 의 토큰과 CHAT_ID","requirements.txt 에 빠진 라이브러리","네이버 쪽 문제 — FAQ 2 절 3 번"], a:2, e:"①(API 호출) 단계 문제."},
    {t:"mc", c:3, src:"퀴즈", q:"data[\"closePrice\"] * 2 가 446,000 이 아니라 223,000223,000 을 만든다. 특히 위험한 이유는?", o:["프로그램이 그 자리에서 즉시 멈춰서","오류 없이 멀쩡히 돌아가면서 엉뚱한 값을 만들어서","화면에 출력이 너무 많이 찍혀서"], a:1, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"아래 빈칸에 들어갈 것은?", k:"price_str = data[\"closePrice\"].______(\",\", \"\")  # \"223000\"", o:["replace","strip","split"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"콤마를 지우는 부분을 빼먹고 int()에 바로 넣으면 어떻게 되는가?", k:"price = int(data[\"closePrice\"])", o:["int()가 콤마를 알아서 무시하고 변환한다","int()에서 오류가 나며 멈춘다","값이 0 으로 들어간다"], a:1, e:"ValueError."},
    {t:"mc", c:3, src:"퀴즈", q:"아래 timeout=3 의 뜻으로 옳은 것은?", k:"response = requests.get(url, headers={\"User-Agent\": \"Mozilla/5.0\"}, timeout=3)", o:["실패하면 3 번까지 다시 요청한다","3 초마다 한 번씩 응답을 다시 확인한다","3 초 안에 응답이 없으면 기다리지 않고 끊는다"], a:2, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"retries = 2 의 뜻으로 옳은 것은?", k:"def fetch_naver_current_price(code: str, retries: int = 2) -> dict:\n    for attempt in range(1, retries + 1):", o:["첫 시도를 포함해 모두 2 번 시도한다","처음 실패한 뒤 2 번을 더 시도해 모두 3 번 시도한다","2 초를 기다렸다가 다시 시도한다"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"아래 두 줄이 있는 이유로 옳은 것은?", k:"if attempt < retries:\n    time.sleep(1)", o:["네이버 서버가 느려서 요청 전에 항상 1 초를 기다린다","1 초 뒤에 프로그램을 종료한다","순간적인 오류일 수 있으니 짧게 쉬었다가 다시 시도한다"], a:2, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"아래 줄에서 isdigit() 이 하는 일은?", k:"price = int(price_str) if price_str.isdigit() else 0", o:["문자열을 숫자로 바꾼다","문자열이 숫자로만 이루어졌는지 확인한다","문자열에서 콤마를 지운다"], a:1, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"price 에 0 이 저장되었을 때 0 원을 돌려주지 않고 None 을 돌려주는 이유로 옳은 것은?", o:["텔레그램에 '0 원'이 멀쩡한 가격처럼 표시돼 실패인 줄 아무도 모르기 때문에","텔레그램이 0 원이 들어간 메시지를 거부하기 때문에","함수 실행이 느려지기 때문에"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"아래 빈칸에 들어갈 것은?", k:"info = fetch_naver_current_price(STOCK_CODE)\nif info ______:\n    print(\"❌ 현재가를 가져오지 못했습니다.\")", o:["is None","== 0","is False"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"종목코드를 파일 맨 위에 `STOCK_CODE = \"005930\"`으로 한 번만 적는 이유는?", o:["파이썬이 대문자 변수를 먼저 읽기 때문에","종목을 바꿀 때 고칠 곳이 이 한 줄뿐이게 하려고","대문자로 적으면 실행이 빨라져서"], a:1, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"format_rate_badge(208500, 1.24) 가 돌려주는 문자열은?", k:"def format_rate_badge(price: int, rate: float) -> str:\n    prefix = f\"{price:,}원\"\n    if rate > 0:\n        return f\"{prefix} 🔺 +{rate}%\"\n    if rate < 0:\n        return f\"{prefix} ▼ {rate}%\"\n    return f\"{prefix} ▫️ 0.0%\"", o:["208500원 🔺 +1.24%","208,500원 🔺 +1.24%","208,500 1.24"], a:1, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"send_telegram_message()에서 지난 장과 이번 장의 차이에 대한 설명으로 옳은 것은?", o:["함수는 지난 장 그대로이고 넘기는 text 만 바뀐다","이번 장에서 함수 안을 현재가용으로 고쳐 쓴다","이번 장에서 새 전송 함수를 만든다"], a:0, e:""},
    {t:"mc", c:3, src:"퀴즈", q:"윈도우에서 실행했더니 UnicodeEncodeError 가 났다. 원인으로 옳은 것은?", o:["코드에 오타가 있다","네이버가 돌려준 응답이 깨졌다","터미널이 이모지를 표현하지 못하는 인코딩 문제다"], a:2, e:""},
    {t:"sa", c:3, src:"퀴즈", q:"삼성전자를 조회할 때 실제로 완성되는 API 주소를 쓰시오.", k:"url = f\"https://m.stock.naver.com/api/stock/{code}/basic\"", a:"https://m.stock.naver.com/api/stock/005930/basic", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"응답에서 우리가 쓰는 필드 이름 다섯 개를 대소문자까지 정확히 쓰고 용도를 쓰시오.", a:"stockName 종목 이름(첫 줄) · closePrice 현재가/종가 · fluctuationsRatio 등락률 · marketStatus 장 열림 여부(is_open) · localTradedAt 체결 시각(traded_at)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"closePrice 하나가 두 가지 값을 돌려준다. 장중일 때와 장마감 후일 때 각각 무엇인가?", a:"장중: 현재가 / 장마감 후: 그날 종가", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"marketStatus 가 어떤 값일 때 '장이 열려 있다'로 판단하는지, 그 결과가 담기는 키 이름을 쓰시오.", k:"\"is_open\": data.get(\"marketStatus\") == \"OPEN\",", a:"\"OPEN\"일 때 / is_open", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`data = response.json()`이 하는 일과, 이 줄을 거친 뒤 data 를 어떻게 다룰 수 있는지 쓰시오.", a:"JSON 문자열을 파이썬 딕셔너리로 바꾼다 / data[\"stockName\"]처럼 키로 값을 꺼낼 수 있다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"텔레그램은 건드리지 않고 콘솔에만 찍어 보는 4 줄을 순서대로 쓰시오.", a:"url = \"https://m.stock.naver.com/api/stock/005930/basic\"\nresponse = requests.get(url)\ndata = response.json()\nprint(data)", e:"맨 위 import requests."},
    {t:"sa", c:3, src:"퀴즈", q:"`print(data[\"closePrice\"] * 2)`가 찍는 것을 쓰고, 오류가 나는지도 쓰시오.", a:"223,000223,000 / 오류는 나지 않는다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"아래 세 줄 실행 시 price_str · price · 마지막 print 값은?", k:"price_str = data[\"closePrice\"].replace(\",\", \"\")\nprice = int(price_str)\nprint(price * 2)", a:"price_str = \"223000\", price = 223000, 출력 446000", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`prefix = f\"{223000:,}원\"`이 만드는 문자열과 콤마가 하는 일을 쓰시오.", a:"\"223,000원\" / 천 단위 구분 콤마를 다시 붙인다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`format_rate_badge(70000, -0.5)`가 돌려주는 문자열을 이모지까지 쓰시오.", a:"70,000원 ▼ -0.5%", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"retries 가 2 일 때 `for attempt in range(1, retries + 1):`이 몇 번 돌고, attempt 값은?", a:"2번 / 1, 2", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"`price = int(price_str) if price_str.isdigit() else 0`에서 isdigit()이 False 이면 price 값과, 결국 함수가 돌려주는 값은?", a:"price = 0 → price <= 0이라 실패 처리 → 최종 None", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"fetch_naver_current_price() 성공 시 dict 키 여섯 개를 쓰고, 이번 장에서 쓰는 세 개를 고르시오.", a:"code, name, price, rate, is_open, traded_at / name, price, rate", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"notify_stock_price.py 를 실행하는 명령을 맥과 윈도우 각각 쓰시오.", a:"맥: python3 ./notify_stock_price.py / 윈도우: python ./notify_stock_price.py", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] ‘❌ [005930] 네이버 현재가 조회 실패 (응답 코드: 500, 1/2번째 시도)’가 두 번 찍히고 ‘현재가를 가져오지 못했습니다’로 끝난다. 원인과 조치는?", a:"원인 — 비공식 API라 일시적으로 막힘. 2회 재시도 모두 실패해 None / 조치 — 잠시 후 다시 실행", e:"내 코드 문제가 아니다."},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 응답은 200인데 ‘❌ [005930] 가격을 숫자로 읽지 못했습니다 (closePrice: '', 2/2번째 시도)’가 찍힌다. 원인과 조치는?", a:"원인 — closePrice가 숫자 문자열이 아니라 isdigit() False → price 0 → 실패 / 조치 — 잠시 후 다시 실행(0원을 막아 준 정상 동작)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 윈도우에서 `UnicodeEncodeError: 'cp949' codec can't encode character '\\u274c'`. 원인과 조치는?", a:"원인 — 터미널이 이모지를 표현 못 함 / 조치 — $env:PYTHONIOENCODING=\"utf-8\"; python notify_stock_price.py", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 맥에서 `zsh: command not found: python`. 원인과 조치는?", a:"원인 — 맥은 명령 이름이 python3 / 조치 — python3 ./notify_stock_price.py (설치는 pip3)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] `print(data[\"closePrice\"] * 2)`가 오류 없이 223,000223,000 을 찍는다. 원인과 조치는?", a:"원인 — closePrice가 콤마 찍힌 문자열이라 * 2가 반복 / 조치 — replace(\",\", \"\") 후 int()로 바꿔 계산, type()으로 먼저 확인", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] `int(data[\"closePrice\"])`에서 `ValueError: invalid literal for int() with base 10: '223,000'`. 원인과 조치는?", a:"원인 — 콤마가 남아 int()가 못 읽음 / 조치 — replace(\",\", \"\")로 콤마를 먼저 지운 뒤 int()", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 텔레그램에 ‘삼성전자 (005930) / 0원 ▫️ 0.0%’가 왔다. 실패인지 정상인지와 원인·조치는?", a:"실패다. 원인 — 가격을 못 읽어 0이 된 값을 그대로 돌려보냄 / 조치 — price <= 0이면 None을 돌려주고 호출부에서 if info is None으로 구분", e:"8장에서는 0원이 DB에 쌓인다."},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 콘솔에는 {'stockName': '삼성전자', 'closePrice': '223,000', ...} 가 잘 찍혔는데 폰에는 아무것도 안 온다. 원인과 조치는?", a:"원인 — API 호출은 성공, 전송(토큰·CHAT_ID) 문제 / 조치 — .env의 토큰과 CHAT_ID 확인(.env.txt·둥근 따옴표 여부)", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 콘솔 확인 없이 전송 코드까지 다 붙여 실행했는데 폰에 아무것도 안 오고 어디가 문제인지 모르겠다. 원인과 조치는?", a:"원인 — 조회와 전송을 한 번에 붙여 어느 쪽 실패인지 구분 불가 / 조치 — requests.get → json → print 4줄로 ①부터 확인 후 ② 전송을 붙인다", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 종목을 바꾸려는데 코드 여기저기의 005930 을 찾아다니다 하나를 빠뜨렸다. 원인과 조치는?", a:"원인 — 같은 값을 여러 군데 적음 / 조치 — 파일 맨 위 STOCK_CODE = \"005930\" 한 줄만 두고 그 이름을 쓴다", e:"6장에서는 watchlist.csv로."},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 실패 확인 없이 `telegram_message = f\"📈 {info['name']} ({STOCK_CODE})\"`를 썼더니 `TypeError: 'NoneType' object is not subscriptable`. 원인과 조치는?", a:"원인 — 조회 실패로 info가 None인데 바로 꺼냄 / 조치 — if info is None:으로 먼저 거르고 else 안에서만 조립·전송", e:""},
    {t:"sa", c:3, src:"퀴즈", q:"[증상] 저녁 8 시에 여러 번 실행했는데 ‘현재가’ 값이 계속 똑같다. 고장인가?", a:"고장이 아니다. 원인 — 장마감 후 closePrice는 그날 종가 / 조치 — 값 변화를 보려면 평일 장중에 실행(marketStatus가 OPEN인지 확인)", e:""},

    {t:"ox", c:4, src:"퀴즈", q:"4 장에는 새 함수도 새 파일도 생기지 않는다. 지금까지의 코드를 읽는 것이 이번 장의 내용이다.", a:"O", e:""},

    {t:"ox", c:4, src:"퀴즈", q:"리스트·집합·딕셔너리는 여러 개의 데이터를 하나의 변수 안에 한꺼번에 담아 관리한다는 공통점이 있다.", a:"O", e:""},
    {t:"ox", c:4, src:"퀴즈", q:"집합(Set)은 리스트와 마찬가지로 데이터의 중복을 허용한다.", a:"X", e:""},

    {t:"ox", c:4, src:"퀴즈", q:"아래 줄은 응답에 closePrice 키가 없으면 그 자리에서 오류가 난다.", k:"price_str = data[\"closePrice\"]", a:"O", e:"KeyError."},
    {t:"ox", c:4, src:"퀴즈", q:"try / except 는 오류가 아예 나지 않게 막아 주는 문법이다.", a:"X", e:"오류가 나도 계속 돌게 하는 문법."},
    {t:"ox", c:4, src:"퀴즈", q:"아래 except 줄의 as e 는 오류 내용을 e 라는 이름으로 받아 두는 것이다.", k:"except Exception as e:\n    print(f\"❌ 텔레그램 메시지 전송 중 오류 발생: {e}\")", a:"O", e:""},
    {t:"ox", c:4, src:"퀴즈", q:"아래 for 문 첫 줄의 쉼표는 '짝으로 온 것을 나눠 받는 중'이라는 표시다.", k:"for code, info in current_prices.items():", a:"O", e:"언패킹."},
    {t:"ox", c:4, src:"퀴즈", q:"아래 두 줄에서 첫 줄만 천 단위 콤마가 붙고, 둘째 줄은 콤마 없이 그대로 찍힌다.", k:"print(f\"{price:,}원\")\nprint(f\"{price}원\")", a:"O", e:""},

    {t:"ox", c:4, src:"퀴즈", q:"아래 삼항 표현식을 읽는 순서는 가운데(조건) → 앞(참일 때) → 뒤(거짓일 때)다.", k:"price = int(price_str) if price_str.isdigit() else 0", a:"O", e:""},
    {t:"ox", c:4, src:"퀴즈", q:"아래 한 줄은 열 이름의 좌우 공백을 지우고 모두 소문자로 바꾼 새 리스트를 만들어 기존 값을 덮어쓴다.", k:"watchlist_df.columns = [c.strip().lower() for c in watchlist_df.columns]", a:"O", e:""},
    {t:"ox", c:4, src:"퀴즈", q:"아래 with 블록 안에서 오류가 나면 연결이 닫히지 않은 채 남는다.", k:"with get_turso_client() as client:\n    result = client.execute(\"SELECT code, date, close FROM …\")", a:"X", e:"오류가 나도 자동으로 닫힌다."},

    {t:"sa", c:4, src:"퀴즈", q:"[증상] `print(data[\"fluctuationsRatio\"])`에서 KeyError 가 나는데 `print(data.get(\"fluctuationsRatio\", \"0\"))`은 멈추지 않는다. 원인과 조치는?", a:"원인 — 대괄호 접근은 키가 없으면 오류, .get은 기본값을 돌려줌 / 조치 — .get(키, 기본값) 형태로 바꾼다", e:""},

    {t:"sa", c:6, src:"퀴즈", q:"[증상] ‘📋 읽어온 관심 종목 리스트: [5930, 660, 5380]’ 후 ‘❌ 관심종목의 현재가를 하나도 가져오지 못했습니다.’ 원인과 조치는?", a:"원인 — 앞자리 0이 사라진 코드로 조회(dtype 누락 또는 CSV 값 자체가 5930) → found == 0 / 조치 — dtype={\"code\": str} 확인, 파일을 메모장·VS Code로 확인", e:""},

    {t:"sa", c:6, src:"퀴즈", q:"[증상] 알림은 왔는데 마지막 줄이 ‘✅ … 전송했습니다! (2/3종목)’이다. 코드를 고쳐야 하는가?", a:"아닐 수 있다. 원인 — 하나가 네이버 일시 실패 / 조치 — 잠시 후 재실행, 매번 같은 종목이면 종목코드 여섯 자리 확인", e:""},
